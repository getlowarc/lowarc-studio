<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="vendor/xterm.css" />
<link rel="stylesheet" href="__lowarc.css" />
<link rel="stylesheet" href="__lowarc-primitives.css" />
<link rel="stylesheet" href="__lowarc-theme.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }

  .layout { display: flex; height: 100%; }

  .terminal-main { position: relative; flex: 1; min-width: 0; }
  .terminal-instance { position: absolute; inset: 4px; display: none; }
  .terminal-instance.is-active { display: block; }
  .terminal-empty {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--fg-dim);
    font-size: 13px;
  }
  .terminal-empty.is-visible { display: flex; }

  /* The "+"/"..." new-instance controls live in the host's own console header, not here: this
     sidebar is only the instance list, per the same VS Code-style split Nolan asked for. */
  .terminal-sidebar {
    flex: none;
    width: 160px;
    border-left: 1px solid var(--border);
    overflow-y: auto;
    font-size: 12px;
  }

  .terminal-sidebar-item {
    display: flex;
    align-items: center;
    height: 26px;
    padding: 0 4px 0 10px;
    gap: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .terminal-sidebar-item:hover { background: var(--bg-hover); }
  .terminal-sidebar-item.is-active { background: var(--border); }

  .terminal-sidebar-item-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <script src="__lowarc.js"></script>

  <div class="layout">
    <div class="terminal-main" id="terminal-main">
      <div class="terminal-empty" id="terminal-empty">No terminal open</div>
    </div>
    <div class="terminal-sidebar" id="terminal-sidebar"></div>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
