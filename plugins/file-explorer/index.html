<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="__lowarc.css" />
<link rel="stylesheet" href="__lowarc-primitives.css" />
<link rel="stylesheet" href="__lowarc-theme.css" />
<link rel="stylesheet" href="__lowarc-icons.css" />
<script src="__lowarc-icons.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-size: 13px;
    user-select: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .header-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 6px 6px 12px;
    flex: none;
  }

  .header {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1;
  }

  .toolbar { display: flex; align-items: center; gap: 2px; flex: none; }

  .banner {
    display: none;
    flex: none;
    padding: 6px 10px;
    font-size: 12px;
    line-height: 1.4;
    gap: 8px;
    align-items: center;
  }
  .banner.is-error { display: flex; background: #5a1d1d; color: #f2b8b8; }
  .banner.is-confirm { display: flex; background: var(--yellow-dim); color: #ecd88f; flex-wrap: wrap; }
  .banner-actions { display: flex; gap: 6px; margin-left: auto; }

  .tree { flex: 1; min-height: 0; overflow: auto; padding-bottom: 8px; }
  .empty-hint { padding: 10px 12px; font-size: 12px; color: var(--fg-dim); }

  .footer {
    flex: none;
    padding: 4px 12px;
    font-size: 11px;
    color: var(--fg-dim);
    border-top: 1px solid var(--border);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .footer:empty { display: none; }

  .row {
    display: flex;
    align-items: center;
    height: 26px;
    padding-left: 4px;
    padding-right: 6px;
    white-space: nowrap;
    cursor: pointer;
    gap: 2px;
  }
  .row:hover { background: var(--bg-hover); }
  .row.selected { background: var(--border); }
  .row.drop-target { outline: 1px solid var(--cyan); outline-offset: -2px; }

  /* One of these per ancestor directory, in place of the old flat depth*12px padding-left — a thin
     vertical line down the middle of each 12px slot, the same "show the nesting, not just imply it
     with whitespace" convention VS Code's own tree uses. Stacking them left-to-right for however
     deep a row is nested reproduces the full-height, unbroken-looking rule across sibling rows for
     free, since every row at a given depth draws the exact same line in the exact same slot. The
     line's own position (left: 5px in its 12px slot) stays fixed — every row at a given depth
     needs to agree on exactly where it sits, or the "continuous line down the tree" illusion
     breaks; the negative margin below is what actually closes the gap to the marker that follows
     (see .row-marker), by pulling IT toward the line instead of moving the line itself. */
  .indent-guides { display: flex; flex: none; align-self: stretch; margin-right: -9px; }
  .indent-guide { width: 12px; flex: none; align-self: stretch; position: relative; }
  .indent-guide::before { content: ""; position: absolute; top: 0; bottom: 0; left: 5px; width: 1px; background: var(--border); }

  /* The ONE marker slot every row has — a folder's chevron and a file's icon are the same thing
     positionally (see explorer.js's createRowMarker), so they share this exact box rather than
     being two separate elements that could end up different sizes or in different places depending
     on row type. Nothing else in this file should reference `.chevron`/`.row-icon` as standalone
     classes anymore. */
  .row-marker { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--fg); }
  .row-marker.chevron { color: var(--fg-dim); transform: rotate(0deg); transition: transform 0.08s ease; }
  .row-marker.chevron.expanded { transform: rotate(90deg); }
  /* Grows with .row-marker's own box (was 10px in a 14px box) — a chevron that stayed fixed-size
     while the file icon next to it grew would end up looking smaller than its own sibling. */
  .row-marker.chevron svg { width: 14px; height: 14px; }
  .row-marker svg { width: 100%; height: 100%; }
  /* Seti glyphs render at their own font-size (icons.css sets 150% of the surrounding font-size,
     tuned for a full-size file tab, not this compact a row) — scaling it back down here keeps file
     rows the same visual size as the chevron above rather than dwarfing it. */
  .row-marker .file-icon { font-size: 20px; }

  .row-status-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; margin-left: auto; }
  .row-status-dot.status-dirty { background: var(--yellow); }
  .row-status-dot.status-error { background: var(--danger); }

  .row-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row-name input {
    all: unset;
    width: 100%;
    background: var(--border);
    outline: 1px solid var(--cyan);
    outline-offset: -1px;
    padding: 0 2px;
    color: var(--fg);
    font: inherit;
  }
</style>
</head>
<body>
  <script src="__lowarc.js"></script>

  <div class="header-row">
    <div class="header" id="header">Explorer</div>
    <div class="toolbar">
      <!-- Redesigned 2026-08-27, take two: the file/folder shape is back to full size (a first
           pass shrank it to a corner badge to make room for a bigger plus, which just traded one
           readability problem for another) — only the plus itself got bigger/bolder than the
           original's barely-visible one, positioned in the shape's own lower-right, matching how
           VS Code's own new-file/new-folder icons balance the two rather than sacrificing either. -->
      <button type="button" class="btn btn-icon-only btn-ghost btn-sm" id="new-file-btn" title="New File" aria-label="New File">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 2h5l3 3v9H4V2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9 2v3h3" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 7.5v5.5M5.5 10.25h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="btn btn-icon-only btn-ghost btn-sm" id="new-folder-btn" title="New Folder" aria-label="New Folder">
        <svg viewBox="0 0 16 16" fill="none"><path d="M2 4.5C2 3.67 2.67 3 3.5 3H6.5L8 4.5H12.5C13.33 4.5 14 5.17 14 6V11.5C14 12.33 13.33 13 12.5 13H3.5C2.67 13 2 12.33 2 11.5V4.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M9 7v5.5M6.25 9.75h5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button type="button" class="btn btn-icon-only btn-ghost btn-sm" id="refresh-btn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 16 16" fill="none"><path d="M13 8A5 5 0 1 1 11.5 4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M13 2.5V5.5H10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="banner" id="banner"></div>
  <div class="tree" id="tree"></div>
  <div class="footer" id="footer"></div>

  <script src="explorer.js"></script>
</body>
</html>
