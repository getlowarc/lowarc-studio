<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="__lowarc.css" />
<!-- Computed server-side from the active theme. See plugins/debugger/index.html for why this has
     to be a separate link rather than baked into __lowarc.css. Without it this panel's own chrome
     (the var(--bg) background below) stays stuck in the default dark palette in Light/custom
     themes, even though Monaco's own editor surface (vs/editor/editor.main.css) themes itself
     independently via monaco.js's own light/dark selection. -->
<link rel="stylesheet" href="__lowarc-theme.css" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  #container { position: absolute; inset: 0; }
</style>
<link rel="stylesheet" data-name="vs/editor/editor.main" href="vs/editor/editor.main.css" />
</head>
<body>
  <script src="__lowarc.js"></script>

  <div id="container"></div>

  <script src="vs/loader.js"></script>
  <script src="monaco.js"></script>
</body>
</html>
