[package]
name = "lowarc-studio"
version = "0.1.0"
description = "LowArc Studio"
edition = "2021"
rust-version = "1.77.2"
default-run = "lowarc-studio"

[lib]
name = "lowarc_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
mime_guess = "2"
tiny_http = "0.12"
portable-pty = "0.8"
base64 = "0.22"
# std::sync::Mutex poisons itself if a thread panics while holding the lock — every later .lock()
# then fails too, permanently, until the process restarts. parking_lot's Mutex has no poisoning at
# all, so a panic loses that one operation's work without bricking the mutex (and whatever feature
# depends on it — RunState, SessionRegistry, ProcessModule's stdin/child, …) for the rest of the
# app's life. Used everywhere this crate shares mutable state across threads.
parking_lot = "0.12"
# bin/input_runtime.rs only — real OS keyboard/mouse polling (Windows/macOS/Linux-X11) and gamepad
# polling (Windows/macOS/Linux/BSD/Wasm), respectively. Plain top-level deps rather than something
# scoped to just that one binary, matching how every other bin-specific dependency in this package
# already works (e.g. portable-pty is only really used by terminal_backend.rs) — a true per-binary
# dependency split would need a real Cargo workspace, not attempted here.
device_query = "4"
gilrs = "0.11"
# bin/audio_runtime.rs — real audio playback (Windows/macOS/Linux, built on cpal), with broad
# format decoding (WAV/MP3/OGG/FLAC and more, via Symphonia) rather than hand-rolling a decoder.
rodio = "0.22"
# bin/file_explorer_backend.rs's Draft Tool half — line-level text diffing (added/removed counts,
# and later a real unified diff) for the review functionality bolted onto the file explorer. A
# correctness-sensitive algorithm (Myers diff) is worth a small, well-tested real dependency rather
# than hand-rolling it.
similar = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"
