[package]
name = "lowarc-studio"
version = "0.58.6"
description = "LowArc Studio"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/getlowarc/lowarc-studio"
rust-version = "1.77.2"
default-run = "lowarc-studio"

[lib]
name = "lowarc_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
# Range matching for module and contract requirements. Already in the tree via
# tauri-plugin-updater, so this is a direct name for something the binary already links, not a new
# dependency. Not hand-rolled: caret ranges, comparator sets and pre-release ordering are exactly
# the rules a hand-rolled comparator gets subtly wrong.
semver = "1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
mime_guess = "2"
tiny_http = "0.12"
portable-pty = "0.8"
base64 = "0.23"
# std::sync::Mutex poisons itself if a thread panics while holding the lock — every later .lock()
# then fails too, permanently, until the process restarts. parking_lot's Mutex has no poisoning at
# all, so a panic loses that one operation's work without bricking the mutex (and whatever feature
# depends on it — RunState, SessionRegistry, ProcessModule's stdin/child, …) for the rest of the
# app's life. Used everywhere this crate shares mutable state across threads.
parking_lot = "0.12"
# bin/device_input_runtime.rs only — real OS keyboard/mouse polling (Windows/macOS/Linux-X11) and gamepad
# polling (Windows/macOS/Linux/BSD/Wasm), respectively. Plain top-level deps rather than something
# scoped to just that one binary, matching how every other bin-specific dependency in this package
# already works (e.g. portable-pty is only really used by terminal_backend.rs) — a true per-binary
# dependency split would need a real Cargo workspace, not attempted here.
device_query = "4"
gilrs = "0.11"
# bin/audio_playback_runtime.rs — real audio playback (Windows/macOS/Linux, built on cpal), with broad
# format decoding (WAV/MP3/OGG/FLAC and more, via Symphonia) rather than hand-rolling a decoder.
rodio = "0.22"
# bin/file_explorer_backend.rs's Draft Tool half — line-level text diffing (added/removed counts,
# and later a real unified diff) for the review functionality bolted onto the file explorer. A
# correctness-sensitive algorithm (Myers diff) is worth a small, well-tested real dependency rather
# than hand-rolling it.
similar = "3"
# bin/vector_canvas_runtime.rs only — the windowed 2D drawing surface. femtovg is a GPU vector
# renderer (OpenGL ES 3.0+) whose API is modelled on the HTML5 Canvas API, which is the same drawing
# model p5.js wraps; adopting it is why that module is a command dispatcher rather than a
# hand-written renderer, and why antialiasing, glyph shaping and image decoding come for free. Its
# default features carry text layout and image loading; "glutin" adds the safe
# OpenGl::new_from_glutin_display constructor. winit owns the window and its event queue, glutin the
# GL context, glutin-winit the bridge between them (its version is pinned by femtovg's own glutin
# feature, so these four move together).
femtovg = { version = "0.27", features = ["glutin"] }
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
# bin/lowarc.rs only — turns Ctrl+C into "set the run's stop flag" rather than a hard kill. That
# matters because spawn_and_run is what sends every module its `stop` phase; skipping it leaves
# sounds queued, a canvas window never closed, and on non-Windows platforms orphaned child
# processes. Somebody WILL Ctrl+C a long-running CLI. Three lines of crate beats per-platform unsafe
# FFI (SetConsoleCtrlHandler and friends) for something this mundane.
ctrlc = "3.5.2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Self-updating. Desktop-only both because there's nothing to update on mobile and because that's
# how the plugin ships. Deliberately NOT hand-rolled: this is the one feature where a bug is a
# remote-code-execution hole rather than an annoyance, and signature verification against the
# embedded public key is exactly the part that must not be improvised. Inert until a signing key
# and endpoint are configured — see docs/updating.md.
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2"
