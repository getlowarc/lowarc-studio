name: Release

# Tag-triggered, not push-triggered — a release is a deliberate act, and the tag is what names the
# version. The tag must match the version in src-tauri/Cargo.toml, which is now the single source of
# truth for it (tauri.conf.json inherits it); check-version below fails the run rather than
# publishing a release whose contents disagree with its own name.
#
# Windows-only for the same reason CI is — see ci.yml's own note. Extend the matrix when the
# toolchain pin does; the manifest format already keys artifacts per platform, so adding one is a
# matrix entry rather than a redesign.
#
# INERT UNTIL CONFIGURED. This workflow needs two repository secrets that do not exist yet, and
# without them a tag push fails here rather than shipping something unsigned:
#   TAURI_SIGNING_PRIVATE_KEY           the private key from `cargo tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password ("" if generated without one)
# See docs/updating.md for generating them and for what still has to be decided about hosting.

on:
  push:
    tags:
      - "v*"

# Grouped but deliberately NOT cancel-in-progress, unlike ci.yml. Two releases racing would be bad;
# a half-cancelled one would be worse, since it can publish artifacts and then not finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The tag and Cargo.toml must agree. Publishing v0.2.0 from a tree that still says 0.1.0 would
      # produce an update no client ever takes (the updater compares against its own baked-in
      # version), which is a silent failure — far better to stop here.
      - name: Check the tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) {
            Write-Error "Tag $tag does not match Cargo.toml version $cargo"
            exit 1
          }
          Write-Host "Tag and Cargo.toml agree on $cargo"

      # A release with no changelog section is a release nobody can read. Checked here because the
      # step that gets forgotten is always the one nothing enforces: bumping Cargo.toml is required
      # to tag at all, but moving Unreleased down is easy to skip and invisible until someone goes
      # looking for what changed. Matches "## [x.y.z]" or "## x.y.z", both spellings being in use
      # across this repo's changelogs.
      - name: Check the changelog has a section for this version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $escaped = [regex]::Escape($tag)
          # The trailing (\s|$) matters: without it, tag 0.5 matches a "## [0.59.0]" heading.
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^##\s+\[?$escaped\]?(\s|$)" -Quiet)) {
            Write-Error "CHANGELOG.md has no section for $tag. Move [Unreleased] down to '## [$tag] - $(Get-Date -Format yyyy-MM-dd)' first."
            exit 1
          }
          Write-Host "CHANGELOG.md documents $tag"

      # The release body is what everyone who starred the repo actually reads: GitHub mails a
      # release digest to stargazers, and the body is what it shows. Taken from the changelog
      # section rather than written twice, and rather than left to a generic "see the assets".
      # The major's name comes from the NAMES table in version.rs, the one place it lives.
      - name: Build the release name and body from what is already written down
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $escaped = [regex]::Escape($tag)

          # The section for this version, up to the next "## " heading.
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^##\s+\[?$escaped\]?(\s|$)").LineNumber
          $rest = $lines[$start..($lines.Count - 1)]
          $end = ($rest | Select-String -Pattern '^##\s' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body = ($body -join "`n").Trim()

          # "0.59.0" -> major 0 -> the name in version.rs's NAMES table, if that major has one.
          $major = $tag.Split('.')[0]
          $named = Select-String -Path src-tauri/src/version.rs -Pattern "\($major,\s*""([^""]+)""\)"
          $name = if ($named) { " " + $named.Matches[0].Groups[1].Value } else { "" }

          "releaseName=LowArc Studio $tag$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "body<<NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "NOTES_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release name: LowArc Studio $tag$name"
          Write-Host "Body is $($body.Length) characters"

      # Everything CI already runs. A release should never be the first time these are checked, but
      # a tag can be pushed to a commit CI hasn't finished, so they run again here rather than being
      # assumed.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      # Builds, bundles, signs the updater artifacts (createUpdaterArtifacts is on in
      # tauri.conf.json) and creates the GitHub release. The signature comes from the private key
      # below and is verified by clients against the public key baked into tauri.conf.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.notes.outputs.releaseName }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Left as a draft on purpose. Publishing is what mails the release digest to everyone who
          # starred the repo, so that stays a deliberate click rather than a side effect of pushing
          # a tag. The build, the signing and the artifacts all happen here; only the announcement
          # waits.
          releaseDraft: true
          prerelease: false
