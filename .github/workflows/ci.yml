name: CI

# rust-toolchain.toml pins stable-x86_64-pc-windows-msvc — this app is Windows-only today (ConPTY,
# native .dll modules, WebView2), so this only runs on windows-latest. Extend to other OSes once
# the toolchain pin itself does.
# `push` is scoped to main deliberately. Paired with an unscoped `pull_request`, a branch still gets
# full CI through its PR, main gets it on every push, and nothing runs twice — whereas `push` with no
# filter alongside `pull_request` runs the whole suite TWICE for any PR from a branch in this repo,
# which is pure duplicate cost.
on:
  push:
    branches: [main]
  pull_request:

# Without this, a push that supersedes an in-flight run leaves the old one grinding to completion on
# a commit nobody is waiting for any more — which adds up fast during a run of quick fixes. Note this
# reduces the NUMBER of runs; it does not make any single run faster.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only token. This workflow only builds and tests; nothing it runs needs to write to the
# repository, and on a public repo it runs against pull requests from forks.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      # rustup on windows-latest already reads rust-toolchain.toml at the repo root, so no
      # explicit toolchain-install step is needed — this just adds caching.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        run: cargo build

      # Clean as of the runtime-binary-target rework — no rustfmt.toml exists yet (this codebase's
      # own style runs wider than rustfmt's 100-char default on long, single-line, well-commented
      # statements throughout), so `cargo fmt --check` isn't run here; it would fail on style this
      # codebase already deliberately uses, not on anything actually wrong.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Also builds and runs everything under tests/ (native/process/plugin-host/dev-run/export
      # end-to-end coverage, folder_export_end_to_end.rs included — no external checkout needed
      # for any of it any more, see that file's own header comment).
      - name: Test
        run: cargo test
