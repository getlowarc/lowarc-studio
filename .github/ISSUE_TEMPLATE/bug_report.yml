name: Bug report
description: Something in Studio behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem instead? Do not file it here. See
        [SECURITY.md](https://github.com/getlowarc/lowarc-studio/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Help, then About. Or `lowarc --version`.
      placeholder: 0.58.6 Daedalus
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: How you are running it
      options:
        - An installed build
        - Built from source
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Modules and plugins involved
      description: >
        Which ones were loaded, if the bug involves a run. A third-party module or plugin narrows
        this down a lot, and saying so is not an accusation.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: From the Console panel, or the terminal if you ran `lowarc`. Pasted as text.
      render: text
    validations:
      required: false
