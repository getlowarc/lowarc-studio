name: Feature request
description: Something Studio should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        LowArc's shape is that the app stays small and modules and plugins do the work. Worth
        asking first: could this be a module or a plugin instead? If it could, it probably should
        be, and the useful request is whatever host change would let you build it.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem, not the solution. What does Studio make hard right now?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. A rough shape is fine.
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: Where this belongs, if you have a view
      options:
        - Studio itself
        - A module
        - A plugin
        - Not sure
    validations:
      required: false
