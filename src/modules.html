<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Modules</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      .page {
        max-width: 900px;
      }

      .tab-panel {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .tab-panel.is-active {
        display: flex;
      }

      /* .manage-list/.manage-detail/.detail-*/.status-dot now live in primitives.css — shared with
         plugins.html and editor.html's own in-editor managers. */
    </style>
  </head>
  <body>
    <!-- No titlebar, no page title/close — this page exists only as popup content now (see
         contributeIframePopup() in primitives.js); the popup shell supplies title/close chrome. -->
    <div class="page">
      <!-- The Installed/Marketplace tabs and Add-module button render in the POPUP's own header
           instead (see setPopupHeaderControls()/onPopupHeaderAction() in primitives.js) — this page
           only exists as popup content, so there's nothing else that needs its own header row here. -->

      <div class="tab-panel is-active" id="tab-panel-installed">
        <div class="manage-list">
          <div class="sidebar-nav" data-tabs id="item-list"></div>
        </div>
        <div class="manage-detail" id="detail-pane">
          <div class="manage-detail-empty">Select a module to see its details.</div>
        </div>
      </div>

      <div class="tab-panel" id="tab-panel-marketplace">
        <div class="marketplace-placeholder">The marketplace isn't built yet.</div>
      </div>
    </div>

    <!-- showPopup()'s stack (see primitives.js) — a sibling of the page's main content so nothing
         can clip it, same placement editor.html uses. -->
    <div class="popup-stack" id="popup-stack"></div>

    <script src="primitives.js"></script>
    <script>
      // The list+detail logic (list/enable/remove/install, the remove-confirm popup, the
      // Installed/Marketplace + Add-button popup-header controls) is shared with plugins.html —
      // see createManagerPage() in primitives.js. This page only supplies what's actually
      // different: which commands to call and what a module's own detail fields look like.
      createManagerPage({
        nounSingular: "Module",
        nounPlural: "modules",
        listCommand: "list_installed_modules",
        enableCommand: "set_module_enabled",
        removeCommand: "remove_module",
        installCommand: "install_module",
        installDialogTitle: "Choose a module folder to install",
        addButtonLabel: "Add Module…",
        showStatusDot: false,
        detailFields: (item) => [
          { label: "Description", value: item.description || "No description." },
          { label: "Load order", value: String(item.loadOrder) },
          { label: "Requires", value: item.requires.length ? item.requires.join(", ") : "Nothing." },
        ],
      });
    </script>
  </body>
</html>
