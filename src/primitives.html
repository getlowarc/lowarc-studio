<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LowArc Studio — Primitives</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      .section {
        margin-bottom: 40px;
      }

      .section h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--fg-dim);
        margin: 0 0 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .btn-grid {
        display: grid;
        grid-template-columns: 90px repeat(4, auto);
        gap: 10px 16px;
        align-items: center;
      }

      .btn-grid .row-label {
        font-size: 12px;
        color: var(--fg-dim);
      }

      .field-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 260px));
        gap: 24px;
      }

      .swatches {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .swatch {
        width: 96px;
      }

      .swatch-color {
        height: 48px;
        border-radius: 6px;
        border: 1px solid var(--border);
      }

      .swatch-label {
        font-size: 11px;
        color: var(--fg-dim);
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-header">
        <button class="back-link" id="back">← Start</button>
        <h1>Primitives</h1>
      </div>
      <div class="page-body">
        <div class="section">
          <h2>Colors</h2>
          <div class="swatches">
            <div class="swatch">
              <div class="swatch-color" style="background: var(--cyan)"></div>
              <div class="swatch-label">cyan</div>
            </div>
            <div class="swatch">
              <div class="swatch-color" style="background: var(--cyan-dark)"></div>
              <div class="swatch-label">cyan-dark</div>
            </div>
            <div class="swatch">
              <div class="swatch-color" style="background: var(--yellow)"></div>
              <div class="swatch-label">yellow</div>
            </div>
            <div class="swatch">
              <div class="swatch-color" style="background: var(--yellow-dark)"></div>
              <div class="swatch-label">yellow-dark</div>
            </div>
            <div class="swatch">
              <div class="swatch-color" style="background: var(--danger)"></div>
              <div class="swatch-label">danger</div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Buttons</h2>
          <div class="btn-grid">
            <div></div>
            <div class="row-label">Small</div>
            <div class="row-label">Standard</div>
            <div class="row-label">Large</div>
            <div class="row-label">Extra</div>

            <div class="row-label">Main</div>
            <button class="btn btn-sm btn-main">Button</button>
            <button class="btn btn-md btn-main">Button</button>
            <button class="btn btn-lg btn-main">Button</button>
            <button class="btn btn-xl btn-main">Button</button>

            <div class="row-label">Sub</div>
            <button class="btn btn-sm btn-sub">Button</button>
            <button class="btn btn-md btn-sub">Button</button>
            <button class="btn btn-lg btn-sub">Button</button>
            <button class="btn btn-xl btn-sub">Button</button>

            <div class="row-label">Outline</div>
            <button class="btn btn-sm btn-outline">Button</button>
            <button class="btn btn-md btn-outline">Button</button>
            <button class="btn btn-lg btn-outline">Button</button>
            <button class="btn btn-xl btn-outline">Button</button>

            <div class="row-label">Ghost</div>
            <button class="btn btn-sm btn-ghost">Button</button>
            <button class="btn btn-md btn-ghost">Button</button>
            <button class="btn btn-lg btn-ghost">Button</button>
            <button class="btn btn-xl btn-ghost">Button</button>

            <div class="row-label">Danger</div>
            <button class="btn btn-sm btn-danger">Button</button>
            <button class="btn btn-md btn-danger">Button</button>
            <button class="btn btn-lg btn-danger">Button</button>
            <button class="btn btn-xl btn-danger">Button</button>

            <div class="row-label">Disabled</div>
            <button class="btn btn-sm btn-main" disabled>Button</button>
            <button class="btn btn-md btn-outline" disabled>Button</button>
            <button class="btn btn-lg btn-ghost" disabled>Button</button>
            <button class="btn btn-xl btn-danger" disabled>Button</button>
          </div>
        </div>

        <div class="section">
          <h2>Dropdowns</h2>
          <div class="field-grid">
            <div class="field">
              <label class="field-label">Sort by (single-select)</label>
              <div class="dropdown dropdown-full" data-dropdown data-open="false">
                <button type="button" class="dropdown-trigger" data-dropdown-trigger>
                  <span class="dropdown-value placeholder" data-dropdown-value data-placeholder="Choose a field…">Choose a field…</span>
                  <span class="dropdown-chevron">▾</span>
                </button>
                <div class="dropdown-menu" data-dropdown-menu>
                  <button type="button" class="dropdown-option" data-dropdown-option data-value="name" data-label="Name">Name</button>
                  <button type="button" class="dropdown-option" data-dropdown-option data-value="date" data-label="Date modified">Date modified</button>
                  <button type="button" class="dropdown-option" data-dropdown-option data-value="size" data-label="Size">Size</button>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="field-label">Modules (checkbox / multiselect)</label>
              <div class="dropdown dropdown-full" data-dropdown data-multiselect="true" data-open="false">
                <button type="button" class="dropdown-trigger" data-dropdown-trigger>
                  <span class="dropdown-value placeholder" data-dropdown-value data-placeholder="None selected">None selected</span>
                  <span class="dropdown-chevron">▾</span>
                </button>
                <div class="dropdown-menu" data-dropdown-menu>
                  <label class="dropdown-option checkbox-row" data-dropdown-option data-label="Physics">
                    <input type="checkbox" />
                    <span class="checkbox-box">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </span>
                    <span>Physics</span>
                  </label>
                  <label class="dropdown-option checkbox-row" data-dropdown-option data-label="Rendering">
                    <input type="checkbox" />
                    <span class="checkbox-box">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </span>
                    <span>Rendering</span>
                  </label>
                  <label class="dropdown-option checkbox-row" data-dropdown-option data-label="Audio">
                    <input type="checkbox" />
                    <span class="checkbox-box">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </span>
                    <span>Audio</span>
                  </label>
                  <label class="dropdown-option checkbox-row" data-dropdown-option data-label="Networking">
                    <input type="checkbox" />
                    <span class="checkbox-box">
                      <svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </span>
                    <span>Networking</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Searchbar</h2>
          <div class="field-grid">
            <div class="field">
              <label class="field-label">Find a module</label>
              <div class="searchbar dropdown" id="module-search" data-open="false">
                <span class="searchbar-icon">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6" /><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
                </span>
                <input type="text" class="input" placeholder="Search modules…" autocomplete="off" />
                <button type="button" class="searchbar-clear" aria-label="Clear">✕</button>
                <div class="dropdown-menu" data-dropdown-menu></div>
              </div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Inputs</h2>
          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="in-standard">Project name</label>
              <input id="in-standard" class="input" type="text" placeholder="my-game" />
            </div>

            <div class="field">
              <label class="field-label">Target FPS (numeric)</label>
              <div class="numeric-input">
                <input type="text" inputmode="numeric" value="60" min="1" max="1000" step="1" />
                <div class="numeric-steppers">
                  <button type="button" class="stepper-up" aria-label="Increase">▲</button>
                  <button type="button" class="stepper-down" aria-label="Decrease">▼</button>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="field-label">Runtime (dropdown input)</label>
              <div class="dropdown dropdown-full" data-dropdown data-open="false">
                <button type="button" class="dropdown-trigger" data-dropdown-trigger>
                  <span class="dropdown-value placeholder" data-dropdown-value data-placeholder="Select a runtime…">Select a runtime…</span>
                  <span class="dropdown-chevron">▾</span>
                </button>
                <div class="dropdown-menu" data-dropdown-menu>
                  <button type="button" class="dropdown-option" data-dropdown-option data-value="native" data-label="Native">Native</button>
                  <button type="button" class="dropdown-option" data-dropdown-option data-value="dotnet" data-label=".NET">.NET</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="primitives.js"></script>
    <script>
      initDropdowns();
      initNumericInputs();
      initSearchbar(document.getElementById("module-search"), {
        options: [
          { value: "physics", label: "Physics" },
          { value: "rendering", label: "Rendering" },
          { value: "audio", label: "Audio" },
          { value: "networking", label: "Networking" },
          { value: "input", label: "Input" },
          { value: "ui", label: "UI Toolkit" },
        ],
      });

      document.getElementById("back").addEventListener("click", () => {
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
