<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Settings</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      .page-header {
        gap: 12px;
      }

      .header-spacer {
        flex: 1;
      }

      .settings-field {
        max-width: 280px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-header">
        <button class="back-link" id="back">← Start</button>
        <h1>Settings</h1>
        <div class="header-spacer"></div>
        <button type="button" class="btn btn-md btn-confirm" id="save">Save</button>
      </div>
      <div class="page-body">
        <div class="field settings-field">
          <label class="field-label" for="target-fps">Dev run target FPS</label>
          <div class="numeric-input">
            <input id="target-fps" type="text" inputmode="numeric" min="1" max="1000" step="1" />
            <div class="numeric-steppers">
              <button type="button" class="stepper-up" aria-label="Increase">▲</button>
              <button type="button" class="stepper-down" aria-label="Decrease">▼</button>
            </div>
          </div>
          <div class="field-hint">Frame rate used when running a project from the editor.</div>
        </div>

        <div class="section" style="margin-top: 28px">
          <h2 style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-dim); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border)">Appearance</h2>
          <p style="color: var(--fg-dim); font-size: 13px; margin: 0 0 12px; max-width: 460px">Switch between light, dark, or system, or build your own color theme.</p>
          <button type="button" class="btn btn-md btn-outline" id="open-appearance">Open Appearance →</button>
        </div>
      </div>
    </div>

    <script src="primitives.js"></script>
    <script>
      const { invoke } = window.__TAURI__.core;

      const targetFpsInput = document.getElementById("target-fps");
      let loadedSettings = null;

      async function load() {
        try {
          loadedSettings = await invoke("get_settings");
          targetFpsInput.value = loadedSettings.devRunTargetFps;
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      document.getElementById("save").addEventListener("click", async () => {
        const fps = Number(targetFpsInput.value);
        if (!Number.isInteger(fps) || fps < 1) {
          showToast({ variant: "error", message: "Target FPS must be a positive whole number." });
          return;
        }

        try {
          // Preserve every other field (themeMode especially) — save_settings replaces the whole
          // Settings object, so sending just { devRunTargetFps } would silently reset the rest to
          // their defaults.
          const settings = { ...(loadedSettings || (await invoke("get_settings"))), devRunTargetFps: fps };
          await invoke("save_settings", { settings });
          loadedSettings = settings;
          showToast({ variant: "success", message: "Settings saved." });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      });

      document.getElementById("open-appearance").addEventListener("click", () => {
        window.location.href = "appearance.html";
      });

      document.getElementById("back").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      initNumericInputs();
      load();
    </script>
  </body>
</html>
