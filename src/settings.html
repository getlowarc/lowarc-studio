<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LowArc Studio — Settings</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      .page-header {
        gap: 12px;
      }

      .header-spacer {
        flex: 1;
      }

      .settings-field {
        max-width: 280px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="page-header">
        <button class="back-link" id="back">← Start</button>
        <h1>Settings</h1>
        <div class="header-spacer"></div>
        <button type="button" class="btn btn-md btn-confirm" id="save">Save</button>
      </div>
      <div class="page-body">
        <div class="field settings-field">
          <label class="field-label" for="target-fps">Dev run target FPS</label>
          <div class="numeric-input">
            <input id="target-fps" type="text" inputmode="numeric" min="1" max="1000" step="1" />
            <div class="numeric-steppers">
              <button type="button" class="stepper-up" aria-label="Increase">▲</button>
              <button type="button" class="stepper-down" aria-label="Decrease">▼</button>
            </div>
          </div>
          <div class="field-hint">Frame rate used when running a project from the editor.</div>
        </div>
      </div>
    </div>

    <script src="primitives.js"></script>
    <script>
      const { invoke } = window.__TAURI__.core;

      const targetFpsInput = document.getElementById("target-fps");

      async function load() {
        try {
          const settings = await invoke("get_settings");
          targetFpsInput.value = settings.devRunTargetFps;
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      document.getElementById("save").addEventListener("click", async () => {
        const fps = Number(targetFpsInput.value);
        if (!Number.isInteger(fps) || fps < 1) {
          showToast({ variant: "error", message: "Target FPS must be a positive whole number." });
          return;
        }

        try {
          await invoke("save_settings", { settings: { devRunTargetFps: fps } });
          showToast({ variant: "success", message: "Settings saved." });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      });

      document.getElementById("back").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      initNumericInputs();
      load();
    </script>
  </body>
</html>
