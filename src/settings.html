<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Settings</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives-shared.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      /* Every tab panel sits under the shared search bar, so the gap lives here rather than on the
         bar itself — one rule covers General, Appearance and Plugins alike. The first heading was
         previously almost touching the search field. */
      #settings-search {
        margin-bottom: 28px;
      }

      .tab-panel {
        display: none;
      }

      .tab-panel.is-active {
        display: block;
      }

      .section {
        margin-bottom: 32px;
      }

      .section h2 {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--fg-dim);
        margin: 0 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      /* Theme dropdown, preset name and the save/delete buttons on one line, bottom-aligned so the
         buttons sit level with the inputs rather than with their labels. */
      .theme-row {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .theme-picker {
        width: 220px;
        flex: none;
      }

      /* A preset name is a handful of words, so it does not need the whole dialog width. */
      .preset-name-field {
        width: 220px;
        flex: none;
      }

      .color-group {
        margin-bottom: 22px;
      }

      .color-group h3 {
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin: 0 0 10px;
      }

      /* Sized off the fields rather than a round number: each column is one swatch plus one hex
         input, so the track only has to be wide enough for those and its label. The old 220px
         minimum left most of every column empty and pushed the grid down to a few columns. */
      .color-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px 12px;
      }

      .color-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .color-field .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* A native colour input paints its own swatch INSIDE the element, with its own border, so a
         border here produced two outlines — the browser's square one nested in ours. Stripping the
         inner wrapper's padding and border leaves a single rounded chip. */
      .color-field input[type="color"] {
        width: 36px;
        height: 36px;
        flex: none;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: none;
        cursor: pointer;
        overflow: hidden;
      }

      .color-field input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      .color-field input[type="color"]::-webkit-color-swatch {
        border: none;
        border-radius: 5px;
      }

      /* Wide enough for #RRGGBBAA and no wider — ch units so this tracks the mono font rather than
         a pixel guess, and stays correct if the font changes. Not flex:1: stretching to fill the
         column is what made these look oversized. */
      .color-field input.input {
        width: 11ch;
        flex: none;
        font-family: var(--font-mono, monospace);
        text-transform: uppercase;
      }

      .theme-divider {
        height: 1px;
        background: var(--border);
        margin: 4px 2px;
      }
    </style>
  </head>
  <body>
    <!-- No titlebar, no page-header, no local tab strip — this page exists only as popup content
         now (see contributeIframePopup() in primitives.js); the popup shell supplies title/close
         chrome, and the General/Appearance tabs render in ITS header too (see
         setPopupHeaderControls() below). -->
    <div class="page">
      <div class="page-body">
        <!-- Always visible regardless of which tab is showing (Appearance included) — typing here
             swaps the visible panel to #tab-panel-search, same showTab() every header tab already
             uses, just never listed as one of ITS OWN clickable tabs. Clearing it restores whatever
             tab was showing before. See the script below for why this is a plain wired input, not
             initSearchbar() — that helper is built for a type-and-pick-one autocomplete (the
             command-center's job), not a live-filtered list view like this one. -->
        <div class="searchbar" id="settings-search">
          <span class="searchbar-icon">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6" /><path d="M11 11L14.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </span>
          <input type="text" class="input" placeholder="Search settings…" autocomplete="off" />
          <button type="button" class="searchbar-clear" data-tooltip="Clear" aria-label="Clear">✕</button>
        </div>

        <div class="tab-panel" id="tab-panel-general">
          <div id="general-settings-list"></div>
        </div>

        <div class="tab-panel" id="tab-panel-plugins">
          <div id="plugin-settings-list"></div>
        </div>

        <div class="tab-panel" id="tab-panel-search">
          <div id="search-results-list"></div>
        </div>

        <div class="tab-panel" id="tab-panel-appearance">
          <!-- Theme and Save-as-preset share one row: picking a theme and saving the colors you
               just edited as a new one are the same task, and splitting them put the save controls
               below every colour field, far from the dropdown they relate to. -->
          <div class="section">
            <h2>Theme</h2>
            <div class="theme-row">
              <div class="field theme-picker">
                <label class="field-label">Active theme</label>
                <div class="dropdown dropdown-full" data-dropdown data-open="false" id="theme-dropdown">
                  <button type="button" class="dropdown-trigger" data-dropdown-trigger>
                    <span class="dropdown-value" data-dropdown-value>System</span>
                    <span class="dropdown-chevron">▾</span>
                  </button>
                  <div class="dropdown-menu" data-dropdown-menu id="theme-dropdown-menu"></div>
                </div>
              </div>
              <div class="field preset-name-field">
                <label class="field-label" for="preset-name">Save as preset</label>
                <input id="preset-name" class="input" type="text" placeholder="My theme" autocomplete="off" />
              </div>
              <button type="button" class="btn btn-md btn-confirm" id="save-preset">Save preset</button>
              <button type="button" class="btn btn-md btn-danger" id="delete-preset" style="display: none">Delete preset</button>
            </div>
          </div>

          <div class="section">
            <h2>Colors</h2>
            <div id="color-groups"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- showPopup()'s stack (see primitives.js) — a sibling of the page's main content so nothing
         can clip it, same placement editor.html uses. -->
    <div class="popup-stack" id="popup-stack"></div>

    <script src="primitives.js"></script>
    <script>
      const invoke = relayableInvoke;

      // ---------- Tabs ----------
      // The tab BUTTONS render in the popup shell's own header now (see setPopupHeaderControls()
      // near the bottom of this script) — this just switches which panel is visible.
      function showTab(value) {
        document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("is-active", p.id === `tab-panel-${value}`));
      }

      // ---------- Settings registry (General + Plugins, standardized) ----------
      // Every configurable value except Appearance's (colors are their own thing — a live preview,
      // not a single committed value, so they stay hand-built) renders off ONE shared shape now:
      // buildSearchableSettingsList()/renderSettingRow() (primitives.js), the exact same functions
      // the command-center's global search uses. General and Plugins are just two different FILTERS
      // over the same flat list, not two different rendering paths — and the search tab below is a
      // third filter over that same list, so there is genuinely only one way a setting ever renders
      // anywhere in this app.
      let loadedSettings = null;
      let registry = [];

      async function getEntryValue(entry) {
        if (entry.tab === "general") return String(loadedSettings[entry.key]);
        const values = await invoke("get_plugin_settings", { id: entry.pluginId });
        return values[entry.key] || "";
      }

      async function commitEntryValue(entry, value) {
        if (entry.tab === "general") {
          if (entry.type === "number") {
            const num = Number(value);
            if (!Number.isInteger(num) || num < 1) {
              showToast({ variant: "error", message: `${entry.label} must be a positive whole number.` });
              return;
            }
            value = num;
          }
          // Preserve every other field — save_settings replaces the whole Settings object, so
          // sending just the one changed key would silently reset the rest to their defaults.
          loadedSettings = { ...loadedSettings, [entry.key]: value };
          try {
            await invoke("save_settings", { settings: loadedSettings });
          } catch (err) {
            showToast({ variant: "error", message: String(err) });
          }
          return;
        }
        try {
          await invoke("set_plugin_setting", { id: entry.pluginId, key: entry.key, value });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      async function renderEntryInto(container, entry) {
        const value = await getEntryValue(entry);
        container.appendChild(renderSettingRow(entry, value, (newValue) => commitEntryValue(entry, newValue)));
      }

      async function loadGeneral() {
        const container = document.getElementById("general-settings-list");
        container.innerHTML = "";
        try {
          loadedSettings = await invoke("get_settings");
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }
        for (const entry of registry.filter((e) => e.tab === "general")) {
          await renderEntryInto(container, entry);
        }
        initNumericInputs();
        initDropdowns();
      }

      async function loadPluginSettings() {
        const container = document.getElementById("plugin-settings-list");
        container.innerHTML = "";
        const entries = registry.filter((e) => e.tab === "plugins");

        if (!entries.length) {
          const empty = document.createElement("div");
          empty.className = "manage-list-empty";
          empty.textContent = "No installed plugins have any settings to configure.";
          container.appendChild(empty);
          return;
        }

        // Grouped by plugin, same visual shape as before (a heading per plugin) — the row shape
        // underneath each heading is the only thing that's actually standardized now, the grouping
        // itself is still meaningful (these fields belong to a plugin, that's real context to keep).
        const bySource = new Map();
        for (const entry of entries) {
          if (!bySource.has(entry.source)) bySource.set(entry.source, []);
          bySource.get(entry.source).push(entry);
        }
        for (const [source, group] of bySource) {
          const section = document.createElement("div");
          section.className = "section";
          const heading = document.createElement("h2");
          heading.textContent = source;
          section.appendChild(heading);
          for (const entry of group) {
            await renderEntryInto(section, { ...entry, source: null }); // heading already says the source, don't repeat it per-row
          }
          container.appendChild(section);
        }
        initDropdowns();
      }

      // ---------- Search ----------
      // Not initSearchbar() — that helper is a type-and-pick-ONE autocomplete (right for the
      // command-center overlay in editor.html, which searches this exact same list), whereas this
      // is a live-filtered VIEW: every match renders as a real, immediately-editable row, not a
      // suggestion you select before anything happens.
      const searchEl = document.getElementById("settings-search");
      const searchInput = searchEl.querySelector("input");
      let previousTab = "general";

      async function renderSearchResults(query) {
        const container = document.getElementById("search-results-list");
        container.innerHTML = "";
        const lower = query.toLowerCase();
        const matches = registry.filter((e) => e.label.toLowerCase().includes(lower) || (e.hint || "").toLowerCase().includes(lower));

        if (!matches.length) {
          const empty = document.createElement("div");
          empty.className = "manage-list-empty";
          empty.textContent = `No settings match "${query}".`;
          container.appendChild(empty);
          return;
        }
        for (const entry of matches) {
          await renderEntryInto(container, entry);
        }
        initNumericInputs();
        initDropdowns();
        return matches;
      }

      searchInput.addEventListener("input", async () => {
        const query = searchInput.value.trim();
        searchEl.classList.toggle("has-value", query.length > 0);
        if (!query) {
          showTab(previousTab);
          return;
        }
        if (!document.getElementById("tab-panel-search").classList.contains("is-active")) {
          previousTab = Array.from(document.querySelectorAll(".tab-panel")).find((p) => p.classList.contains("is-active"))?.id.replace("tab-panel-", "") || "general";
        }
        showTab("search");
        await renderSearchResults(query);
      });

      searchEl.querySelector(".searchbar-clear").addEventListener("click", () => {
        searchInput.value = "";
        searchEl.classList.remove("has-value");
        showTab(previousTab);
        searchInput.focus();
      });

      // ?search=<label text> — how editor.html's command-center overlay hands off a selected
      // setting: pre-fills and runs the same search this box would if typed, then scrolls to and
      // briefly highlights (see .setting-row.is-highlighted) the one row it's actually about, since
      // the query text alone might still match more than one row.
      async function applyUrlSearch() {
        const params = new URLSearchParams(window.location.search);
        const query = params.get("search");
        const entryId = params.get("id");
        if (!query) return;
        searchInput.value = query;
        searchEl.classList.add("has-value");
        showTab("search");
        await renderSearchResults(query);
        if (entryId) {
          const row = document.querySelector(`.setting-row[data-setting-id="${CSS.escape(entryId)}"]`);
          if (row) {
            row.scrollIntoView({ block: "center" });
            row.classList.add("is-highlighted");
          }
        }
      }

      // ---------- Appearance tab ----------
      let currentColors = { ...DARK_THEME };
      let activePresetName = null;

      function makeOption(value, label) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "dropdown-option";
        btn.setAttribute("data-dropdown-option", "");
        btn.dataset.value = value;
        btn.dataset.label = label;
        btn.textContent = label;
        return btn;
      }

      async function refreshThemeDropdown(selectedMode) {
        const presets = await invoke("list_theme_presets");
        const menu = document.getElementById("theme-dropdown-menu");
        menu.innerHTML = "";

        [
          { value: "system", label: "System" },
          { value: "light", label: "Light" },
          { value: "dark", label: "Dark" },
        ].forEach((opt) => menu.appendChild(makeOption(opt.value, opt.label)));

        if (presets.length > 0) {
          const divider = document.createElement("div");
          divider.className = "theme-divider";
          menu.appendChild(divider);
          presets.forEach((preset) => menu.appendChild(makeOption(preset.name, preset.name)));
        }

        const dropdownEl = document.getElementById("theme-dropdown");
        const valueEl = dropdownEl.querySelector("[data-dropdown-value]");
        const options = Array.from(menu.querySelectorAll("[data-dropdown-option]"));
        const matched = options.find((o) => o.dataset.value === selectedMode);

        valueEl.textContent = matched ? matched.dataset.label : selectedMode;
        options.forEach((o) => o.classList.toggle("is-selected", o === matched));
        dropdownEl.dataset.value = selectedMode;

        return presets;
      }

      function colorsForBuiltIn(mode) {
        if (mode === "light") return LIGHT_THEME;
        if (mode === "dark") return DARK_THEME;
        return systemPrefersDark() ? DARK_THEME : LIGHT_THEME;
      }

      function renderColorGrid(colors) {
        const container = document.getElementById("color-groups");
        container.innerHTML = "";

        const groups = [...new Set(THEME_TOKENS.map((t) => t.group))];
        for (const group of groups) {
          const groupEl = document.createElement("div");
          groupEl.className = "color-group";

          const heading = document.createElement("h3");
          heading.textContent = group;
          groupEl.appendChild(heading);

          const grid = document.createElement("div");
          grid.className = "color-grid";
          groupEl.appendChild(grid);

          for (const token of THEME_TOKENS.filter((t) => t.group === group)) {
            const field = document.createElement("div");
            field.className = "color-field";

            const label = document.createElement("label");
            label.className = "field-label";
            label.textContent = token.label;

            const row = document.createElement("div");
            row.className = "row";

            const swatch = document.createElement("input");
            swatch.type = "color";
            swatch.value = colors[token.key];

            const hex = document.createElement("input");
            hex.type = "text";
            hex.className = "input";
            hex.value = colors[token.key];
            hex.spellcheck = false;

            const commit = (value) => {
              currentColors[token.key] = value;
              applyThemeColors(currentColors);
            };

            swatch.addEventListener("input", () => {
              hex.value = swatch.value;
              commit(swatch.value);
            });

            hex.addEventListener("change", () => {
              const value = hex.value.trim();
              if (/^#[0-9a-fA-F]{6}$/.test(value)) {
                swatch.value = value;
                commit(value);
              } else {
                hex.value = currentColors[token.key];
              }
            });

            row.appendChild(swatch);
            row.appendChild(hex);
            field.appendChild(label);
            field.appendChild(row);
            grid.appendChild(field);
          }

          container.appendChild(groupEl);
        }
      }

      function setActivePreset(name) {
        activePresetName = name;
        document.getElementById("preset-name").value = name || "";
        document.getElementById("delete-preset").style.display = name ? "" : "none";
      }

      async function persistThemeMode(mode) {
        const settings = await invoke("get_settings");
        settings.themeMode = mode;
        await invoke("save_settings", { settings });
      }

      async function switchToMode(mode) {
        let colors;
        if (mode === "system" || mode === "light" || mode === "dark") {
          colors = colorsForBuiltIn(mode);
          setActivePreset(null);
        } else {
          const presets = await invoke("list_theme_presets");
          const preset = presets.find((p) => p.name === mode);
          colors = preset ? preset.colors : colorsForBuiltIn("system");
          setActivePreset(preset ? preset.name : null);
        }

        currentColors = { ...colors };
        applyThemeColors(currentColors);
        renderColorGrid(currentColors);

        try {
          await persistThemeMode(mode);
          // applyThemeColors above only restyled THIS page. Everything outside it — the editor
          // hosting this popup — has to re-read the theme too, or the change doesn't show until a
          // reload. Deliberately after the save, so what other documents resolve is what is now on
          // disk rather than a value that might still fail to persist.
          broadcastThemeChange();
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      document.getElementById("theme-dropdown").addEventListener("dropdown-change", () => {
        switchToMode(document.getElementById("theme-dropdown").dataset.value);
      });

      document.getElementById("save-preset").addEventListener("click", async () => {
        const name = document.getElementById("preset-name").value.trim();
        if (!name) {
          showToast({ variant: "error", message: "Give the preset a name first." });
          return;
        }

        try {
          await invoke("save_theme_preset", { preset: { name, colors: currentColors } });
          await persistThemeMode(name);
          setActivePreset(name);
          await refreshThemeDropdown(name);
          // Saving a preset also makes it the active theme, so the rest of the app has to pick up
          // the colours that until now were only previewed in this page. switchToMode isn't used
          // here (it would re-fetch what we just wrote), so this needs its own call.
          broadcastThemeChange();
          showToast({ variant: "success", message: `Saved "${name}".` });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      });

      contribute("popups", {
        id: "delete-preset",
        sourceType: "host",
        title: "Delete theme?",
        size: 340,
        mount(container, ctx) {
          const body = document.createElement("div");
          body.className = "popup-body";
          body.textContent = `This removes "${ctx.target.name}" — anything using it switches to System. This can't be undone.`;
          container.appendChild(body);

          const actions = document.createElement("div");
          actions.className = "popup-actions";
          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn btn-md btn-ghost";
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", () => ctx.close(false));
          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "btn btn-md btn-danger";
          deleteBtn.textContent = "Delete";
          deleteBtn.addEventListener("click", () => ctx.close(true));
          actions.appendChild(cancelBtn);
          actions.appendChild(deleteBtn);
          container.appendChild(actions);
        },
      });

      document.getElementById("delete-preset").addEventListener("click", async () => {
        if (!activePresetName) return;
        const name = activePresetName;
        const confirmed = await showPopup("delete-preset", { name });
        if (!confirmed) return;

        try {
          await invoke("delete_theme_preset", { name });
          showToast({ variant: "success", message: `Deleted "${name}".` });
          await switchToMode("system");
          await refreshThemeDropdown("system");
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      });

      async function loadAppearance() {
        let mode = "system";
        try {
          mode = (await invoke("get_settings")).themeMode || "system";
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }

        const presets = await refreshThemeDropdown(mode);
        initDropdowns();

        if (mode === "system" || mode === "light" || mode === "dark") {
          currentColors = { ...colorsForBuiltIn(mode) };
          setActivePreset(null);
        } else {
          const preset = presets.find((p) => p.name === mode);
          currentColors = { ...(preset ? preset.colors : colorsForBuiltIn("system")) };
          setActivePreset(preset ? preset.name : null);
        }
        renderColorGrid(currentColors);
      }

      (async () => {
        try {
          initTooltips();

          const requestedTab = new URLSearchParams(window.location.search).get("tab");
          const initialTab = ["appearance", "plugins"].includes(requestedTab) ? requestedTab : "general";
          previousTab = initialTab;
          showTab(initialTab);
          setPopupHeaderControls({
            tabs: [
              { value: "general", label: "General" },
              { value: "appearance", label: "Appearance" },
              { value: "plugins", label: "Plugins" },
            ],
            activeTab: initialTab,
          });
          // Clicking a real header tab while a search is active should behave like clearing the
          // search box, not layer a tab switch underneath a still-visible search results view.
          onPopupHeaderAction({
            onTabChange: (value) => {
              previousTab = value;
              searchInput.value = "";
              searchEl.classList.remove("has-value");
              showTab(value);
            },
          });

          registry = await buildSearchableSettingsList();
          // allSettled, not all — one tab's own load failing shouldn't stop the other two from
          // still rendering whatever they can; a plain Promise.all would abandon all three the
          // moment any single one rejects.
          const results = await Promise.allSettled([loadGeneral(), loadAppearance(), loadPluginSettings()]);
          results.forEach((r) => {
            if (r.status === "rejected") console.error("[settings] a tab failed to load:", r.reason);
          });
          await applyUrlSearch();
        } catch (err) {
          console.error("[settings] failed to initialize:", err);
          showToast({ variant: "error", message: `Settings failed to load: ${err && err.message ? err.message : err}` });
        }
      })();
    </script>
  </body>
</html>
