<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Plugins</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      .page {
        max-width: 900px;
      }

      .tab-panel {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .tab-panel.is-active {
        display: flex;
      }

      /* .manage-list/.manage-detail/.detail-*/.status-dot now live in primitives.css — shared with
         modules.html and editor.html's own in-editor managers. */
    </style>
  </head>
  <body>
    <!-- No titlebar, no page title/close — this page exists only as popup content now (see
         contributeIframePopup() in primitives.js); the popup shell supplies title/close chrome. -->
    <div class="page">
      <!-- The Installed/Marketplace tabs and Add-plugin button render in the POPUP's own header
           instead (see setPopupHeaderControls()/onPopupHeaderAction() in primitives.js) — this page
           only exists as popup content, so there's nothing else that needs its own header row here. -->

      <div class="tab-panel is-active" id="tab-panel-installed">
        <div class="manage-list">
          <div class="sidebar-nav" data-tabs id="item-list"></div>
        </div>
        <div class="manage-detail" id="detail-pane">
          <div class="manage-detail-empty">Select a plugin to see its details.</div>
        </div>
      </div>

      <div class="tab-panel" id="tab-panel-marketplace">
        <div class="marketplace-placeholder">The marketplace isn't built yet.</div>
      </div>
    </div>

    <!-- showPopup()'s stack (see primitives.js) — a sibling of the page's main content so nothing
         can clip it, same placement editor.html uses. -->
    <div class="popup-stack" id="popup-stack"></div>

    <script src="primitives.js"></script>
    <script>
      const { invoke } = window.__TAURI__.core;
      const { open: openDialog } = window.__TAURI__.dialog;

      let items = [];
      let selectedId = null;

      contribute("popups", {
        id: "remove-plugin",
        sourceType: "host",
        title: "Remove plugin?",
        size: 340,
        mount(container, ctx) {
          const body = document.createElement("div");
          body.className = "popup-body";
          body.textContent = `This deletes "${ctx.target.name}" from disk. This can't be undone.`;
          container.appendChild(body);

          const actions = document.createElement("div");
          actions.className = "popup-actions";
          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn btn-md btn-ghost";
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", () => ctx.close(false));
          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "btn btn-md btn-danger";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", () => ctx.close(true));
          actions.appendChild(cancelBtn);
          actions.appendChild(removeBtn);
          container.appendChild(actions);
        },
      });

      function reportError(err) {
        showToast({ variant: "error", message: String(err) });
      }

      // ---------- List (left) ----------
      function renderList() {
        const list = document.getElementById("item-list");
        list.innerHTML = "";

        if (items.length === 0) {
          const empty = document.createElement("div");
          empty.className = "manage-list-empty";
          empty.textContent = "No plugins installed.";
          list.appendChild(empty);
          return;
        }

        for (const item of items) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "sidebar-tab" + (item.id === selectedId ? " is-active" : "");
          btn.dataset.tabValue = item.id;
          if (item.disabled) btn.style.opacity = "0.55";

          const stack = document.createElement("div");
          const name = document.createElement("div");
          name.textContent = item.name;
          const sub = document.createElement("div");
          sub.className = "item-sub";
          const bits = [item.version ? `v${item.version}` : item.id];
          if (item.disabled) bits.push("Disabled");
          sub.textContent = bits.join(" — ");
          stack.appendChild(name);
          stack.appendChild(sub);
          btn.appendChild(stack);

          list.appendChild(btn);
        }
      }

      // ---------- Detail (right) ----------
      function detailField(label, value, mono) {
        const field = document.createElement("div");
        field.className = "detail-field";
        const lab = document.createElement("div");
        lab.className = "field-label";
        lab.textContent = label;
        const val = document.createElement("div");
        val.className = "value" + (mono ? " mono" : "");
        val.textContent = value;
        field.appendChild(lab);
        field.appendChild(val);
        return field;
      }

      function renderDetail(item) {
        const pane = document.getElementById("detail-pane");
        pane.innerHTML = "";

        if (!item) {
          const empty = document.createElement("div");
          empty.className = "manage-detail-empty";
          empty.textContent = "Select a plugin to see its details.";
          pane.appendChild(empty);
          return;
        }

        const title = document.createElement("div");
        title.className = "detail-title";
        const dot = document.createElement("span");
        dot.className = "status-dot" + (item.disabled ? "" : " is-enabled");
        dot.dataset.tooltip = item.disabled ? "Disabled" : "Enabled";
        const titleText = document.createElement("span");
        titleText.textContent = item.name;
        title.appendChild(dot);
        title.appendChild(titleText);
        pane.appendChild(title);

        const sub = document.createElement("div");
        sub.className = "detail-sub";
        sub.textContent = item.id + (item.version ? ` · v${item.version}` : "");
        pane.appendChild(sub);

        pane.appendChild(detailField("Description", item.description || "No description."));
        pane.appendChild(detailField("Command", item.command, true));

        const actions = document.createElement("div");
        actions.className = "detail-actions";

        const enabledLabel = document.createElement("label");
        enabledLabel.className = "checkbox-row";
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !item.disabled;
        const box = document.createElement("span");
        box.className = "checkbox-box";
        box.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>';
        const enabledText = document.createElement("span");
        enabledText.textContent = "Enabled";
        enabledLabel.appendChild(checkbox);
        enabledLabel.appendChild(box);
        enabledLabel.appendChild(enabledText);
        checkbox.addEventListener("change", async () => {
          try {
            await invoke("set_plugin_enabled", { id: item.id, enabled: checkbox.checked });
            await loadItems();
          } catch (err) {
            reportError(err);
          }
        });
        actions.appendChild(enabledLabel);

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "btn btn-sm btn-danger";
        removeBtn.textContent = "Remove";
        removeBtn.addEventListener("click", async () => {
          const confirmed = await showPopup("remove-plugin", { name: item.name });
          if (!confirmed) return;
          try {
            await invoke("remove_plugin", { id: item.id });
            selectedId = null;
            await loadItems();
          } catch (err) {
            reportError(err);
          }
        });
        actions.appendChild(removeBtn);

        pane.appendChild(actions);
        initTooltips();
      }

      document.getElementById("item-list").addEventListener("tab-change", (e) => {
        selectedId = e.detail.value;
        renderDetail(items.find((i) => i.id === selectedId));
      });

      async function loadItems() {
        try {
          items = await invoke("list_installed_plugins");
        } catch (err) {
          reportError(err);
          items = [];
        }
        if (!items.some((i) => i.id === selectedId)) selectedId = null;
        renderList();
        renderDetail(items.find((i) => i.id === selectedId));
      }

      // ---------- Add ----------
      async function addPlugin() {
        const sourceDir = await openDialog({ directory: true, title: "Choose a plugin folder to install" });
        if (!sourceDir) return;

        try {
          const id = await invoke("install_plugin", { sourceDir });
          showToast({ variant: "success", message: `Installed "${id}".` });
          selectedId = id;
          await loadItems();
        } catch (err) {
          reportError(err);
        }
      }

      // ---------- Popup header (Installed/Marketplace tabs + Add Plugin…, rendered by the popup
      // shell itself — see setPopupHeaderControls()/onPopupHeaderAction() in primitives.js) ----------
      setPopupHeaderControls({
        tabs: [
          { value: "installed", label: "Installed" },
          { value: "marketplace", label: "Marketplace" },
        ],
        activeTab: "installed",
        buttons: [
          {
            id: "add-item",
            label: "Add Plugin…",
            icon: '<svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>',
          },
        ],
      });
      onPopupHeaderAction({
        onTabChange: (value) => {
          document.querySelectorAll(".tab-panel").forEach((p) => p.classList.toggle("is-active", p.id === `tab-panel-${value}`));
        },
        onButtonClick: (id) => {
          if (id === "add-item") addPlugin();
        },
      });

      initTooltips();
      initTabs();
      loadItems();
    </script>
  </body>
</html>
