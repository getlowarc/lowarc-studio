<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Plugins</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives-shared.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      /* .page already fills its container (width:100%, see style.css) — no max-width cap here any
         more. The popup itself (.popup-large, primitives.css) is what actually bounds the width
         (90vw, capped at 1400px); a narrower cap here just left dead space to the right of the
         list+detail layout inside a wide popup, confirmed live. */

      .tab-panel {
        display: none;
        flex: 1;
        min-height: 0;
      }

      .tab-panel.is-active {
        display: flex;
      }

      /* .manage-list/.manage-detail/.detail-* now live in primitives.css — shared with
         modules.html and editor.html's own in-editor managers. */
    </style>
  </head>
  <body>
    <!-- No titlebar, no page title/close — this page exists only as popup content now (see
         contributeIframePopup() in primitives.js); the popup shell supplies title/close chrome. -->
    <div class="page">
      <!-- The Installed/Marketplace tabs and Add-plugin button render in the POPUP's own header
           instead (see setPopupHeaderControls()/onPopupHeaderAction() in primitives.js) — this page
           only exists as popup content, so there's nothing else that needs its own header row here. -->

      <div class="tab-panel is-active" id="tab-panel-installed">
        <div class="manage-list">
          <div class="sidebar-nav" data-tabs id="item-list"></div>
        </div>
        <div class="manage-detail" id="detail-pane">
          <div class="manage-detail-empty">Select a plugin to see its details.</div>
        </div>
      </div>

      <div class="tab-panel" id="tab-panel-marketplace">
        <div class="marketplace-placeholder">The marketplace isn't built yet.</div>
      </div>
    </div>

    <!-- showPopup()'s stack (see primitives.js) — a sibling of the page's main content so nothing
         can clip it, same placement editor.html uses. -->
    <div class="popup-stack" id="popup-stack"></div>

    <!-- Overview/Changelog Markdown rendering — see renderMarkdown/configureMarkedOnce in
         primitives.js for the security-relevant renderer overrides applied on top of this. -->
    <script src="vendor/marked/marked.umd.js"></script>
    <script src="primitives.js"></script>
    <script>
      // The list+detail logic (list/enable/remove/install, the remove-confirm popup, the
      // Installed/Marketplace + Add-button popup-header controls) is shared with modules.html —
      // see createManagerPage() in primitives.js. This page only supplies what's actually
      // different: which commands to call and what a plugin's own detail fields look like.
      createManagerPage({
        nounSingular: "Plugin",
        nounPlural: "plugins",
        listCommand: "list_installed_plugins",
        enableCommand: "set_plugin_enabled",
        removeCommand: "remove_plugin",
        installCommand: "install_plugin",
        installDialogTitle: "Choose a plugin folder to install",
        addButtonLabel: "Add Plugin…",
        detailFields: (item) => [{ label: "Command", value: item.command, mono: true }],
        // What VSCode's "Feature Contributions" tab conveys for an extension — what this plugin
        // actually plugs into the app with. All of this already reaches the frontend via
        // list_installed_plugins (see PluginListItem in installs.rs): nothing new to fetch here.
        contributionFields: (item) => {
          const fields = [];
          const c = item.contributes || { panels: [], consoleTabs: [], viewers: [] };
          if (c.panels.length) fields.push({ label: "Panels", value: c.panels.map((p) => `${p.title} (${p.location})`).join(", ") });
          if (c.consoleTabs.length) fields.push({ label: "Console tabs", value: c.consoleTabs.map((t) => t.title).join(", ") });
          if (c.viewers.length) fields.push({ label: "Viewers", value: c.viewers.map((v) => `${v.title} (${v.extensions.join(" ")})`).join(", ") });
          if (item.commands.length) fields.push({ label: "Commands", value: item.commands.map((cmd) => cmd.label).join(", ") });
          if (item.settings.length) fields.push({ label: "Settings", value: item.settings.map((s) => s.label).join(", ") });
          return fields;
        },
      });
    </script>
  </body>
</html>
