<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Editor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives-shared.css" />
    <link rel="stylesheet" href="primitives.css" />
    <link rel="stylesheet" href="vendor/seti-icons/icons.css" />
    <script src="vendor/seti-icons/icons.js"></script>
    <style>
      /* ---------- Grid shell ---------- */
      /* Vocabulary: "Menu Bar" = the topmost bar (File/Edit/View/Help) — the window runs with
         decorations:false, so this row doubles as the OS caption bar too: app icon and menu on
         the left, transport controls + panel toggles on the right, then the minimize/maximize/
         close buttons, with a draggable strip in between. "Sidebar" = the Rail (icon strip) + the
         left panel together. "Tab Bar" = the center panel's own local header: file tabs only now
         that transport/toggles live in the Menu Bar. Rail/left panel/right panel run the full
         height (Menu Bar down to status bar); the console sits only under the center column. Panel
         sizes are CSS vars so JS can drive both dragging and open/close without rewriting the
         template; divider tracks are real grid cells (not overlaid elements) so they can't drift
         out of sync with what they're resizing. */
      .shell {
        height: 100%;
        display: grid;
        --sidebar-width: 240px;
        --right-width: 260px;
        --console-height: 220px;
        grid-template-columns: 36px var(--sidebar-width) 4px 1fr 4px var(--right-width);
        grid-template-rows: auto 1fr 4px var(--console-height) auto;
        grid-template-areas:
          "menu    menu    menu    menu    menu    menu"
          "rail    left    divL    center  divR    right"
          "rail    left    divL    divC    divR    right"
          "rail    left    divL    console divR    right"
          "status  status  status  status  status  status";
      }

      .shell[data-sidebar-open="false"] {
        --sidebar-width: 0px;
      }
      .shell[data-right-open="false"] {
        --right-width: 0px;
      }
      .shell[data-console-open="false"] {
        --console-height: 0px;
      }

      /* ---------- Menu Bar (also the window's caption row; see the grid-shell note above) ---- */
      .menu-bar {
        grid-area: menu;
        display: flex;
        align-items: stretch;
        height: 34px;
        padding-left: 6px;
        border-bottom: 1px solid var(--border);
        flex: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .menu-bar-left {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }

      .menu-bar-app-icon {
        height: 15px;
        width: auto;
        display: block;
        margin: 0 6px 0 2px;
      }

      .menu-item {
        all: unset;
        font-size: 13px;
        color: var(--fg-dim);
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      .menu-item:hover {
        background: var(--bg-hover);
        color: var(--fg);
      }

      /* Every top-level item is a real dropdown (.menu-dropdown/.menu-dropdown-list/etc. are the
         shared primitive in primitives.css). Items the app can't actually do yet (Edit's
         clipboard/undo commands, anything needing a plugin surface that doesn't exist) render
         disabled rather than being omitted: same placeholder-over-omission approach as the rest
         of the shell. */

      .menu-bar-drag {
        flex: 1;
      }

      /* A button, not a real input: VS Code's Command Center isn't typable in place either, it
         opens a separate overlay. Flanked by two flex:1 drag regions so it centers in whatever
         room is left between the menu and the right-side controls, and empty space on either
         side of it stays draggable. No explicit height — .menu-bar's own align-items:stretch
         fills the full row height, matching every other control in this bar instead of sitting
         inset like a smaller inline widget would. */
      /* A real .searchbar (primitives.css), not a button that opens something else: sized into
         the same slot the old look-alike button sat in, just with a usable min-width instead of
         one that could shrink to icon-only (an actual text input can't collapse to nothing the
         way a button's label could). */
      .menu-bar-search {
        flex: 0 1 320px;
        min-width: 140px;
        max-width: 45%;
        height: 26px;
        align-self: center;
      }

      .menu-bar-search input {
        height: 100%;
        padding-top: 0;
        padding-bottom: 0;
        font-size: 12px;
        border-radius: 5px;
      }

      /* Below this, there isn't room for the full-size bar without crowding the menu/transport
         controls on either side. */
      @media (max-width: 700px) {
        .menu-bar-search {
          flex: 0 1 160px;
          min-width: 90px;
        }
      }

      .menu-bar-right {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
        padding-right: 6px;
      }

      .menu-bar-right .transport-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-right: 6px;
        margin-right: 2px;
        border-right: 1px solid var(--border);
      }

      .menu-bar-icon {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 5px;
        color: var(--fg-dim);
        cursor: pointer;
      }

      .menu-bar-icon svg {
        width: 15px;
        height: 15px;
      }

      /* Every current .menu-bar-icon is a "change the IDE's own layout" control (split/console/
         inspector toggles): info-blue on hover, same semantic the console header's .btn-ghost-info
         buttons use. .is-active (currently toggled open) reuses the app's one accent color for
         "this is on" everywhere else, deliberately not the hover color. See the .btn-ghost-*
         primitives in primitives.css for the fuller reasoning. */
      .menu-bar-icon:hover {
        background: var(--bg-hover);
        color: var(--info);
      }

      .menu-bar-icon.is-active {
        background: var(--cyan-dim);
        color: var(--cyan);
      }

      /* ---------- Rail ---------- */
      .rail {
        grid-area: rail;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0;
        border-right: 1px solid var(--border);
        background: var(--bg-raised);
      }

      .rail-item {
        all: unset;
        box-sizing: border-box;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        color: var(--fg-dim);
        cursor: pointer;
      }

      .rail-item svg {
        width: 18px;
        height: 18px;
      }

      /* All three current .rail-item buttons (bell/account/settings) open a floating panel of some
         kind: yellow on hover, the "opens a menu" semantic. (No .is-active rule here any more:
         that was left over from before the panel-switching rail icons moved to the shared
         .sidebar-tab primitive (see renderTabStrip's "sidebar" slot below), and nothing has
         toggled .is-active on a .rail-item since.) */
      .rail-item:hover {
        color: var(--yellow);
      }

      /* Unread-notification dot on the bell — position:relative on .rail-item above is what this
         anchors against. */
      .rail-badge {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--danger);
        border: 1.5px solid var(--bg-raised);
      }

      /* ---------- Notification bell panel ---------- */
      /* Renders inside the same shared #floating-menu-list every action menu uses (see
         showFloatingOverlay): wider and taller than that default, since this is a scrollable
         history list, not a handful of one-line action buttons. */
      .notif-panel-list {
        width: 300px;
        max-height: 420px;
        overflow-y: auto;
        padding: 0;
      }

      .notif-panel-header {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: var(--bg-raised);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .notif-panel-clear {
        all: unset;
        font-size: 11px;
        font-weight: 600;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg-dim);
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
      }

      .notif-panel-clear:hover {
        background: var(--bg-hover);
        color: var(--danger);
      }

      .notif-panel-empty {
        padding: 20px 12px;
        text-align: center;
        font-size: 13px;
        color: var(--fg-dim);
      }

      .notif-row {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }

      .notif-row:last-child {
        border-bottom: none;
      }

      .notif-row-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }

      .notif-row-message {
        font-size: 12px;
        line-height: 1.4;
        color: var(--fg);
        word-break: break-word;
      }

      .notif-row-meta {
        font-size: 11px;
        color: var(--fg-dim);
      }

      /* Same visual language as .notif-panel-clear's own hover (muted -> danger-tinted on hover):
         hidden until the row is hovered so the list doesn't read as a wall of X's at rest. */
      .notif-row-dismiss {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        flex: none;
        color: var(--fg-dim);
        cursor: pointer;
        border-radius: 4px;
        opacity: 0;
      }

      .notif-row-dismiss svg {
        width: 11px;
        height: 11px;
      }

      .notif-row:hover .notif-row-dismiss {
        opacity: 1;
      }

      .notif-row-dismiss:hover {
        background: var(--bg-hover);
        color: var(--danger);
      }

      /* .sidebar-tab (primitives.css) is shared with the Modules/Plugins pages' wider, labelled
         list: this narrows *only* the rail's own icon-only usage of it, rather than shrinking
         the shared primitive itself and affecting those other, unrelated places too. */
      #rail-tabs.sidebar-nav {
        gap: 2px;
      }
      #rail-tabs .sidebar-tab {
        padding: 7px;
        border-radius: 0 4px 4px 0;
        /* The shared primitive has no justify-content: fine where there's a text label to keep
           left-aligned (Modules/Plugins, the in-editor managers), but a rail icon has nothing else
           in the row to anchor to, so centering it here (icon-only usage, scoped the same way as
           the padding/radius above) is what actually centers it in the rail's own width. Padding
           is symmetric (7px both sides) and the active indicator is an inset box-shadow rather than
           a border (see .sidebar-tab in primitives.css), so nothing here shifts the button's true
           center: this centers on the rail's full width, active or not. */
        justify-content: center;
      }

      .rail-spacer {
        flex: 1;
      }

      /* Account/settings triggers open through .floating-menu (see openMenuFromTrigger in the
         script below), not a local .menu-dropdown: no positioning override needed here any more. */

      /* ---------- Left / right panels ---------- */
      /* Darker than the center panel on purpose. See the background-shade section below. */
      .side-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .left-panel {
        grid-area: left;
        border-right: 1px solid var(--border);
      }

      .right-panel {
        grid-area: right;
        border-left: 1px solid var(--border);
      }

      .side-panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .side-panel-header h2 {
        flex: 1;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-dim);
        margin: 0;
      }

      .side-panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px;
      }

      /* ---------- Dividers ---------- */
      .divider {
        background: transparent;
        position: relative;
      }
      .divider::after {
        content: "";
        position: absolute;
        inset: 0;
      }
      .divider:hover,
      .divider.is-dragging {
        background: var(--cyan-dark);
      }

      .divider-col {
        cursor: col-resize;
      }
      .divider-col::after {
        left: -2px;
        right: -2px;
      }

      .divider-left {
        grid-area: divL;
      }
      .divider-right {
        grid-area: divR;
      }

      .divider-row {
        grid-area: divC;
        cursor: row-resize;
      }
      .divider-row::after {
        top: -2px;
        bottom: -2px;
      }

      /* ---------- Center panel (Tab Bar + viewport, optionally split into two groups) ---------- */
      /* Brightest of the panels: it's the focus. One background on the wrapper so every group's
         Tab Bar and viewport read as one continuous surface instead of needing the shade set per
         group. .center-panel itself is now just a flex row hosting one or two .editor-group
         columns (each the old .center-panel content verbatim) plus the divider between them: the
         outer grid's "center" cell/area is unchanged, split lives entirely inside it. */
      .center-panel {
        grid-area: center;
        display: flex;
        flex-direction: row;
        min-width: 0;
        overflow: hidden;
        background: var(--bg-raised);
      }

      .editor-group {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Off by default. Split is a deliberate opt-in (see toggle-split), not a second pane that
         exists but happens to be empty. */
      .editor-group[data-group="1"] {
        display: none;
      }
      .center-panel.is-split .editor-group[data-group="1"] {
        display: flex;
      }

      /* The subtle cue for "new files open here": otherwise nothing on screen distinguishes which
         of the two groups is the active drop target once both exist. */
      .editor-group.is-active-group .tab-bar {
        background: var(--bg-hover);
      }

      /* Reuses .divider's own hover/hit-region styling (see the Dividers section below) via a
         second class rather than duplicating it: this one just isn't grid-area-positioned, since
         it sits inside the flex-row .center-panel, not as its own grid track. */
      .editor-group-divider {
        flex: none;
        width: 4px;
        display: none;
      }
      .center-panel.is-split .editor-group-divider {
        display: block;
      }

      .tab-bar {
        display: flex;
        align-items: stretch;
        min-height: 34px;
        padding: 0 6px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .tab-bar-tabs {
        display: flex;
        align-items: stretch;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: thin;
      }

      .tab-bar-empty {
        display: flex;
        align-items: center;
        padding: 0 8px;
        font-size: 12px;
        color: var(--fg-dim);
      }

      /* One tab per open file. A div (not a button) because it hosts a real <button> of its own
         (the close control). Buttons can't nest, and a div with role="button" is the correct
         substitute rather than reaching for a click handler on something semantically wrong.
         Status (clean/dirty/missing) is shown as the underline's color, the same "line, not a
         dot" language as the header-tab/console-tab primitives' active-state underline. Unlike
         those two, a clean tab's line only shows when it's also the active one: matching
         header-tab/console-tab's own rule that an unselected tab shows no line at all, transparent
         at rest (Nolan: "tabs, sidebar or header, shouldn't have that border line if they aren't
         selected... if it is not blue and not selected, don't show a line"). Dirty/missing are
         real status signals worth seeing on a background tab too, so those two keep showing
         unconditionally regardless of which tab is active: only "selected and otherwise
         unremarkable" needs the active check. border-box so the border itself doesn't add to the
         tab's height. */
      .file-tab {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px 0 10px;
        font-size: 12px;
        color: var(--fg-dim);
        border-right: 1px solid var(--border);
        border-bottom: 2px solid transparent;
        cursor: pointer;
        flex: none;
        user-select: none;
      }

      .file-tab.is-active.status-clean {
        border-bottom-color: var(--cyan);
      }

      .file-tab.status-dirty {
        border-bottom-color: var(--yellow);
      }

      .file-tab.status-missing {
        border-bottom-color: var(--danger);
      }

      .file-tab:hover {
        color: var(--fg);
      }

      .file-tab.is-active {
        color: var(--fg);
        background: var(--bg-hover);
      }

      .file-tab:focus-visible {
        outline: 1px solid var(--cyan);
        outline-offset: -1px;
      }

      .file-tab-icon {
        flex: none;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Same reasoning as the file explorer's own row-marker sizing: icons.css's default 150% is
         tuned for a bigger surface than a compact tab. */
      .file-tab-icon.file-icon {
        font-size: 20px;
      }

      /* Always present and laid out (never swapped for something a different size) so hovering a
         tab never shifts its width: just invisible and inert until the tab is hovered or active. */
      .file-tab-close {
        display: flex;
        opacity: 0;
        pointer-events: none;
      }

      .file-tab:hover .file-tab-close,
      .file-tab.is-active .file-tab-close {
        opacity: 1;
        pointer-events: auto;
      }

      .center-viewport-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: var(--fg-dim);
        font-size: 13px;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* Always hosts either .center-viewport-empty or one iframe per mounted viewer instance (see
         the tab-bar/open-files JS below — one instance can now show several open files, so this
         isn't one-per-file any more): never bare text of its own any more, so this stays a plain
         block container; whichever child is actually showing manages its own sizing/centering.
         Positioned so the viewer frames below can stack inside it. */
      .center-viewport {
        flex: 1;
        min-height: 0;
        display: block;
        overflow: hidden;
        position: relative;
      }

      /* A viewer frame hides by going INVISIBLE, not by going display:none like every other
         .plugin-panel-frame, because an editor has to measure the font it is about to draw with,
         and a display:none document has no layout to measure. Monaco reads offsetWidth off test
         glyphs; in a frame with no layout every one of those reads back 0, so it falls back to a
         5px-per-character placeholder, marks the reading untrusted, and schedules a re-read five
         seconds out. For those five seconds the browser paints real Consolas at 7.7px while Monaco
         places the caret and maps clicks at 5px: a 35% error that grows with distance from the
         left margin, so clicking near the end of a line put the caret five or six characters short,
         and everything jumped when the timer finally fired. Measured, not guessed: 5.0 at 146ms,
         still 5.0 against 7.7px glyphs at 197ms, corrected at 5129ms.
         visibility:hidden keeps the box (so measurements are real) without painting it, and the
         absolute positioning is what lets several frames share the viewport without stacking now
         that they are no longer taken out of flow. Scoped to this viewport deliberately: sidebar
         and console panels sit in flex columns where a laid-out hidden frame WOULD take up space,
         and nothing in them has a font to measure. */
      .center-viewport > .plugin-panel-frame {
        position: absolute;
        inset: 0;
        display: block;
        visibility: hidden;
      }

      .center-viewport > .plugin-panel-frame.is-active {
        visibility: visible;
      }

      /* ---------- Console ---------- */
      /* Same darker shade as the left/right panels: console, sidebar, and inspector are all
         "supporting" surfaces around the bright center focus. */
      .console-panel {
        grid-area: console;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
        min-height: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .console-tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .console-tabs-spacer {
        flex: 1;
      }

      .console-session-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .console-header-divider {
        width: 1px;
        height: 18px;
        margin: 0 6px;
        background: var(--border);
        flex: none;
      }

      /* "New Terminal With…" opens through .floating-menu (see openMenuFromTrigger in the script
         below), not a local .menu-dropdown: no positioning override needed here any more. */


      /* Reinstated for plugin-contributed console tabs (see PanelContribution.location ==
         "console"): same underline pattern as .header-tab, tuned for the console's smaller row. */
      .console-tab {
        all: unset;
        box-sizing: border-box;
        position: relative;
        top: 1px;
        padding: 7px 2px;
        margin: 0 8px;
        font-size: 12px;
        color: var(--fg-dim);
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }

      .console-tab:first-child {
        margin-left: 0;
      }

      .console-tab:hover {
        color: var(--fg);
      }

      .console-tab.is-active {
        color: var(--fg);
        border-bottom-color: var(--cyan);
      }

      .plugin-panel-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
      }

      .plugin-panel-frame.is-active {
        display: block;
      }

      /* Same slot/show-hide convention as a .plugin-panel-frame in a SIDEBAR or console slot, which
         still hides with display:none. (Viewer frames in the center viewport no longer do; see the
         rule above for why an editor needs layout even while hidden.) The per-tab wrapper
         showSlotTab() creates for every "sidebar"/"inspector"/"console" contribution, host or
         plugin alike (see primitives.js's contribute()/getSlot() and renderTabStrip/showSlotTab
         below). Flex column, not block, so a host panel's toolbar-above-a-list layout works; a
         plugin's plain iframe just becomes that column's sole child and fills it the same way. */
      .host-panel-frame {
        width: 100%;
        height: 100%;
        min-width: 0;
        display: none;
        flex-direction: column;
      }

      .host-panel-frame.is-active {
        display: flex;
      }

      /* ---------- In-editor plugin manager ---------- */
      /* Single-column accordion, not the wide two-pane .manage-list/.manage-detail layout the
         standalone Plugins page uses: the sidebar defaults to 240px, the same width .manage-list
         alone takes on that page, nowhere near enough room for a detail pane beside it too. Each
         row expands in place instead of navigating to a separate detail view. */
      .plugin-manager-toolbar {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px;
        border-bottom: 1px solid var(--border);
      }

      /* Search (flex:1) plus two small icon-only buttons on one row — a labeled "Add X…" button
         doesn't fit the sidebar's 240px width alongside a second button (confirmed live: it pushed
         Marketplace off the edge, clipping it); icon-only + a tooltip fixes that and also settles
         the original "isn't centered" complaint (a single unconstrained labeled button sitting at
         the toolbar's own left edge with nothing balancing it). */
      .plugin-manager-toolbar-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .plugin-manager-search {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        padding: 6px 8px;
      }

      /* The row header's enable/disable toggle: same .checkbox-row/.checkbox-box control as
         everywhere else, just sized down (12px vs. the default 16px) to sit comfortably beside a
         row's name/chevron instead of dominating the row the way a full-size one would. */
      .plugin-manager-row-toggle {
        flex: none;
        margin: 0;
        gap: 0;
      }

      .plugin-manager-row-toggle .checkbox-box {
        width: 14px;
        height: 14px;
      }

      .plugin-manager-list {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
      }

      /* The Run Config popup's module picker. Capped and scrollable rather than growing with the
         list: a machine with many modules installed would otherwise push Save off the screen. */
      .run-config-modules {
        max-height: 220px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px;
      }

      .run-config-module {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 6px;
        border-radius: 3px;
        font-size: 13px;
        cursor: pointer;
      }

      .run-config-module:hover {
        background: var(--bg-hover);
      }

      .run-config-module-name {
        flex: none;
      }

      /* Pushed right and dimmed: the id and version identify a row without competing with its name,
         and the id is what project.json actually stores. */
      .run-config-module-meta {
        margin-left: auto;
        color: var(--fg-dim);
        font-size: 12px;
      }

      .run-config-module.is-missing .run-config-module-meta {
        color: var(--danger);
      }

      .plugin-manager-empty {
        padding: 16px 12px;
        font-size: 13px;
        color: var(--fg-dim);
      }

      .plugin-manager-row {
        border-bottom: 1px solid var(--border);
      }

      .plugin-manager-row-header {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }

      .plugin-manager-row-header:hover {
        background: var(--bg-hover);
      }

      .plugin-manager-row-name {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .plugin-manager-row-chevron {
        flex: none;
        display: flex;
        color: var(--fg-dim);
        transform: rotate(0deg);
        transition: transform 0.08s ease;
      }

      .plugin-manager-row-chevron.expanded {
        transform: rotate(90deg);
      }

      .plugin-manager-row-chevron svg {
        width: 10px;
        height: 10px;
      }

      .plugin-manager-row-body {
        padding: 0 10px 12px 26px;
        min-width: 0;
      }

      .plugin-manager-row-sub {
        font-size: 11px;
        color: var(--fg-dim);
        margin-bottom: 6px;
      }

      .plugin-manager-row-desc {
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 10px;
      }

      /* Just the Remove button now: the enable/disable toggle moved up into the row header itself
         (see .plugin-manager-row-toggle): right-aligned rather than the old space-between (which
         existed to spread a checkbox label and this button apart; with one action left, flex-end
         reads better than a lone button stranded at the left edge). */
      .plugin-manager-row-actions {
        display: flex;
        justify-content: flex-end;
      }

      /* Zeroes the placeholder-era padding/centering once the inspector actually hosts a plugin
         panel: a value editor shouldn't sit inset behind decorative padding. .center-viewport
         doesn't need this toggle any more; it stays padding:0 permanently now that it always
         hosts either .center-viewport-empty or an open file's iframe, same reasoning as
         .console-body below staying padding:0 permanently for the same kind of always-hosts-
         something reason. */
      .side-panel-body.hosts-plugin {
        padding: 0;
        overflow: hidden;
        display: block;
      }

      .console-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      /* The one console tab that isn't plugin-contributed: dev-run and plugin log output. Always
         present, since it's core functionality rather than something a plugin supplies (see the
         "__run" contribute("console", ...) call, order:-10 so it always sorts first). Its own
         is-active never toggles again once set. See showSlotTab()'s per-tab .host-panel-frame
         wrapper, which is what actually governs whether this is visible. */
      #console-run-panel {
        display: none;
        height: 100%;
        overflow: auto;
        padding: 8px 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-dim);
        white-space: pre-wrap;
        box-sizing: border-box;
      }

      #console-run-panel.is-active {
        display: block;
      }

      #console-run-panel .line + .line {
        margin-top: 2px;
      }

      /* ---------- Status bar ---------- */
      .status-bar {
        grid-area: status;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 4px 12px;
        border-top: 1px solid var(--border);
        background: var(--bg-raised);
        font-size: 12px;
        color: var(--fg-dim);
        flex: none;
      }

      .status-bar .status-spacer {
        flex: 1;
      }

      /* The Draft Tool's per-file diff, for whichever file is currently active: pushed by the
         File Explorer plugin (window.lowarc.setDiffStatus, see plugin_assets.rs) whenever its own
         diffCounts changes, and re-shown whenever the active file changes (see showActiveFile in
         tabs-inspector.js). Hidden entirely when the active file has no tracked diff, same
         no-glyphs-just-color convention the file tree's own row-diff decoration uses. */
      .status-draft-diff {
        display: none;
        gap: 6px;
        font-variant-numeric: tabular-nums;
      }
      .status-draft-diff-added {
        color: var(--success);
      }
      .status-draft-diff-removed {
        color: var(--danger);
      }
    </style>
  </head>

      <nav class="rail" id="rail">
        <!-- Panel-switching icons: the shared sidebar-nav/sidebar-tab primitive (see
             primitives.css), same one the Modules/Plugins pages use, not the bespoke .rail-item
             look. Account/settings stay plain .rail-item buttons below: they open flyouts, not
             switch a panel, so they're deliberately not part of this [data-tabs] list.
             Every button here (the two in-editor managers (Modules, Plugins) included), is built
             by renderTabStrip() from the "sidebar" slot registry (see contribute()/getSlot() in
             primitives.js), not hand-authored HTML; this container starts empty and fills once the
             script below runs. The managers are host-owned chrome, not plugin-contributed panels,
             specifically so they can call real Tauri commands (list_installed_plugins/set_plugin_
             enabled/remove_plugin, and the module equivalents) a sandboxed plugin never gets
             access to. See the contribute("sidebar", ...) calls near createManagerPanel(). -->
        <div class="sidebar-nav" data-tabs data-reorderable id="rail-tabs"></div>
        <div class="rail-spacer"></div>

        <!-- Host-owned, not a plugin (Nolan: "the bell shouldn't be a plugin... other plugins are
             going to want to get a slice of the notif-pie"). Sits above Account/Settings, per his
             explicit placement. Opens through the shared .floating-menu overlay too (see
             openNotificationPanel below), same as the two triggers under it. -->
        <button type="button" class="rail-item" id="bell-trigger" data-tooltip="Notifications" aria-label="Notifications">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 1.8c-2 0-3.5 1.6-3.5 3.6v2.1c0 .5-.2 1-.6 1.4l-.7.7c-.5.5-.1 1.4.6 1.4h8.4c.7 0 1.1-.9.6-1.4l-.7-.7c-.4-.4-.6-.9-.6-1.4V5.4c0-2-1.5-3.6-3.5-3.6Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /><path d="M6.5 13.2a1.5 1.5 0 0 0 3 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
          <span class="rail-badge" id="bell-badge" style="display: none"></span>
        </button>

        <!-- Flyouts for both of these render through the shared .floating-menu overlay (see
             openMenuFromTrigger in the script below) rather than a local .menu-dropdown-list: the
             rail sits at the window's far-left edge, exactly the kind of trigger position that used
             to need a bespoke "open rightward, bottom-anchored" CSS override to avoid running off
             the window; the overlay clamps to the real viewport instead, so no override is needed. -->
        <button type="button" class="rail-item" id="account-menu-trigger" data-tooltip="Account" aria-label="Account" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3" /><circle cx="8" cy="6.4" r="2" stroke="currentColor" stroke-width="1.3" /><path d="M3.9 12.3c.7-1.9 2.3-2.9 4.1-2.9s3.4 1 4.1 2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
        </button>

        <button type="button" class="rail-item" id="settings-menu-trigger" data-tooltip="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3" /><path d="M8 1.6v1.6M8 12.8v1.6M14.4 8h-1.6M3.2 8H1.6M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7L3.6 3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
        </button>
      </nav>

      <div class="console-panel">
        <!-- Every tab here (Run included), is built by renderTabStrip() from the "console" slot
             registry (see contribute()/getSlot() in primitives.js), same as the rail's
             sidebar-tabs; this container starts with just its trailing controls, no tab buttons,
             and fills once the script below runs. -->
        <div class="console-tabs" id="console-tabs" data-tabs data-reorderable>
          <div class="console-tabs-spacer"></div>

          <!-- Only shown while a "session": true plugin's tab (Terminal) is active. See
               activateConsoleTab(). New instance (default shell) and "new instance with a specific
               shell" are two different actions, not one dropdown-with-a-default, since the common
               case (default shell) should be a single click, not open-menu-then-pick. -->
          <div class="console-session-controls" id="console-session-controls" style="display: none">
            <button type="button" class="btn btn-icon-only btn-xs btn-ghost-confirm" id="console-new-session" data-tooltip="New Terminal" aria-label="New Terminal">
              <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /></svg>
            </button>
            <!-- Renders through .floating-menu (see openMenuFromTrigger): the console sits at the
                 bottom of the window, another edge that used to need a bespoke "open upward"
                 override; the overlay clamps automatically instead. -->
            <button type="button" class="btn btn-icon-only btn-xs btn-ghost-warning" id="console-session-menu-trigger" data-tooltip="New Terminal With…" aria-label="New Terminal With…" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 16 16" fill="none"><circle cx="3.2" cy="8" r="1.2" fill="currentColor" /><circle cx="8" cy="8" r="1.2" fill="currentColor" /><circle cx="12.8" cy="8" r="1.2" fill="currentColor" /></svg>
            </button>
          </div>

          <!-- Only shown while "__run" (Run) is active. See activateConsoleTab(). Every other
               console tab already owns its own way to clear itself (Debug's own Clear button;
               Terminal is a live shell, not a log, so clearing doesn't apply there at all): this
               is specifically for the one console tab with no plugin/UI of its own to put a Clear
               control in. -->
          <button type="button" class="btn btn-icon-only btn-xs btn-ghost-warning" id="console-clear-run" data-tooltip="Clear" aria-label="Clear" style="display: none">
            <svg viewBox="0 0 16 16" fill="none"><path d="M3 5h10M6.5 5V3.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V5M4.5 5l.5 8a1 1 0 0 0 1 .9h4a1 1 0 0 0 1-.9l.5-8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>

          <div class="console-header-divider"></div>

          <!-- Permanent, like Close: not scoped to any one console tab. -->
          <button type="button" class="btn btn-icon-only btn-xs btn-ghost-info" id="console-expand" data-tooltip="Maximize Console" aria-label="Maximize console">
            <svg viewBox="0 0 16 16" fill="none"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></svg>
          </button>
          <button type="button" class="btn btn-icon-only btn-xs btn-ghost-danger" id="console-close" data-tooltip="Close" aria-label="Close console">
            <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
        </div>
        <div class="console-body" id="console-body">
          <div id="console-run-panel" class="is-active"></div>
        </div>
      </div>

      <div class="status-bar">
        <span id="status-project">No project</span>
        <div class="status-spacer"></div>
        <span class="status-draft-diff" id="status-draft-diff"></span>
        <span>LowArc Studio</span>
      </div>
    </div>

    <!-- A sibling of .shell, not nested inside it. See openMenuOverlay()'s comment for why that
         matters (nothing inside .shell can clip or contain this). -->
    <div class="floating-menu" id="floating-menu">
      <div class="floating-menu-list" id="floating-menu-list"></div>
    </div>

    <!-- Popup Base's stack: a sibling of .shell/.floating-menu for the same reason (nothing can
         clip it). Empty by default; showPopup() (see the script below) creates and removes each
         instance's own .popup-backdrop/.popup on demand, rather than static markup toggled by
         class like the three popups this replaced. -->
    <div class="popup-stack" id="popup-stack"></div>

    <script src="format-shared.js"></script>
    <script src="primitives.js"></script>
    <script src="editor/menus.js"></script>
    <script src="editor/header.js"></script>
    <script src="editor/menu-actions.js"></script>
    <script src="editor/panels.js"></script>
    <script src="editor/plugin-hosting.js"></script>
    <script src="editor/base-slots.js"></script>
    <script src="editor/tabs-inspector.js"></script>
    <script src="editor/split-view.js"></script>
  </body>
</html>
