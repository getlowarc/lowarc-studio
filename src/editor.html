<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Editor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives-shared.css" />
    <link rel="stylesheet" href="primitives.css" />
    <link rel="stylesheet" href="vendor/seti-icons/icons.css" />
    <script src="vendor/seti-icons/icons.js"></script>
    <style>
      /* ---------- Grid shell ---------- */
      /* Vocabulary: "Menu Bar" = the topmost bar (File/Edit/View/Help) — the window runs with
         decorations:false, so this row doubles as the OS caption bar too: app icon and menu on
         the left, transport controls + panel toggles on the right, then the minimize/maximize/
         close buttons, with a draggable strip in between. "Sidebar" = the Rail (icon strip) + the
         left panel together. "Tab Bar" = the center panel's own local header — file tabs only now
         that transport/toggles live in the Menu Bar. Rail/left panel/right panel run the full
         height (Menu Bar down to status bar); the console sits only under the center column. Panel
         sizes are CSS vars so JS can drive both dragging and open/close without rewriting the
         template; divider tracks are real grid cells (not overlaid elements) so they can't drift
         out of sync with what they're resizing. */
      .shell {
        height: 100%;
        display: grid;
        --sidebar-width: 240px;
        --right-width: 260px;
        --console-height: 220px;
        grid-template-columns: 36px var(--sidebar-width) 4px 1fr 4px var(--right-width);
        grid-template-rows: auto 1fr 4px var(--console-height) auto;
        grid-template-areas:
          "menu    menu    menu    menu    menu    menu"
          "rail    left    divL    center  divR    right"
          "rail    left    divL    divC    divR    right"
          "rail    left    divL    console divR    right"
          "status  status  status  status  status  status";
      }

      .shell[data-sidebar-open="false"] {
        --sidebar-width: 0px;
      }
      .shell[data-right-open="false"] {
        --right-width: 0px;
      }
      .shell[data-console-open="false"] {
        --console-height: 0px;
      }

      /* ---------- Menu Bar (also the window's caption row — see the grid-shell note above) ---- */
      .menu-bar {
        grid-area: menu;
        display: flex;
        align-items: stretch;
        height: 34px;
        padding-left: 6px;
        border-bottom: 1px solid var(--border);
        flex: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .menu-bar-left {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }

      .menu-bar-app-icon {
        height: 15px;
        width: auto;
        display: block;
        margin: 0 6px 0 2px;
      }

      .menu-item {
        all: unset;
        font-size: 13px;
        color: var(--fg-dim);
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      .menu-item:hover {
        background: var(--bg-hover);
        color: var(--fg);
      }

      /* Every top-level item is a real dropdown (.menu-dropdown/.menu-dropdown-list/etc. are the
         shared primitive in primitives.css). Items the app can't actually do yet (Edit's
         clipboard/undo commands, anything needing a plugin surface that doesn't exist) render
         disabled rather than being omitted — same placeholder-over-omission approach as the rest
         of the shell. */

      .menu-bar-drag {
        flex: 1;
      }

      /* A button, not a real input — VS Code's Command Center isn't typable in place either, it
         opens a separate overlay. Flanked by two flex:1 drag regions so it centers in whatever
         room is left between the menu and the right-side controls, and empty space on either
         side of it stays draggable. No explicit height — .menu-bar's own align-items:stretch
         fills the full row height, matching every other control in this bar instead of sitting
         inset like a smaller inline widget would. */
      /* A real .searchbar (primitives.css), not a button that opens something else — sized into
         the same slot the old look-alike button sat in, just with a usable min-width instead of
         one that could shrink to icon-only (an actual text input can't collapse to nothing the
         way a button's label could). */
      .menu-bar-search {
        flex: 0 1 320px;
        min-width: 140px;
        max-width: 45%;
        height: 26px;
        align-self: center;
      }

      .menu-bar-search input {
        height: 100%;
        padding-top: 0;
        padding-bottom: 0;
        font-size: 12px;
        border-radius: 5px;
      }

      /* Below this, there isn't room for the full-size bar without crowding the menu/transport
         controls on either side. */
      @media (max-width: 700px) {
        .menu-bar-search {
          flex: 0 1 160px;
          min-width: 90px;
        }
      }

      .menu-bar-right {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
        padding-right: 6px;
      }

      .menu-bar-right .transport-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-right: 6px;
        margin-right: 2px;
        border-right: 1px solid var(--border);
      }

      .menu-bar-icon {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 5px;
        color: var(--fg-dim);
        cursor: pointer;
      }

      .menu-bar-icon svg {
        width: 15px;
        height: 15px;
      }

      /* Every current .menu-bar-icon is a "change the IDE's own layout" control (split/console/
         inspector toggles) — info-blue on hover, same semantic the console header's .btn-ghost-info
         buttons use. .is-active (currently toggled open) reuses the app's one accent color for
         "this is on" everywhere else, deliberately not the hover color — see the .btn-ghost-*
         primitives in primitives.css for the fuller reasoning. */
      .menu-bar-icon:hover {
        background: var(--bg-hover);
        color: var(--info);
      }

      .menu-bar-icon.is-active {
        background: var(--cyan-dim);
        color: var(--cyan);
      }

      /* ---------- Rail ---------- */
      .rail {
        grid-area: rail;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0;
        border-right: 1px solid var(--border);
        background: var(--bg-raised);
      }

      .rail-item {
        all: unset;
        box-sizing: border-box;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        color: var(--fg-dim);
        cursor: pointer;
      }

      .rail-item svg {
        width: 18px;
        height: 18px;
      }

      /* All three current .rail-item buttons (bell/account/settings) open a floating panel of some
         kind — yellow on hover, the "opens a menu" semantic. (No .is-active rule here any more:
         that was left over from before the panel-switching rail icons moved to the shared
         .sidebar-tab primitive — see renderTabStrip's "sidebar" slot below — and nothing has
         toggled .is-active on a .rail-item since.) */
      .rail-item:hover {
        color: var(--yellow);
      }

      /* Unread-notification dot on the bell — position:relative on .rail-item above is what this
         anchors against. */
      .rail-badge {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--danger);
        border: 1.5px solid var(--bg-raised);
      }

      /* ---------- Notification bell panel ---------- */
      /* Renders inside the same shared #floating-menu-list every action menu uses (see
         showFloatingOverlay) — wider and taller than that default, since this is a scrollable
         history list, not a handful of one-line action buttons. */
      .notif-panel-list {
        width: 300px;
        max-height: 420px;
        overflow-y: auto;
        padding: 0;
      }

      .notif-panel-header {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: var(--bg-raised);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .notif-panel-clear {
        all: unset;
        font-size: 11px;
        font-weight: 600;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg-dim);
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
      }

      .notif-panel-clear:hover {
        background: var(--bg-hover);
        color: var(--danger);
      }

      .notif-panel-empty {
        padding: 20px 12px;
        text-align: center;
        font-size: 13px;
        color: var(--fg-dim);
      }

      .notif-row {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }

      .notif-row:last-child {
        border-bottom: none;
      }

      .notif-row-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }

      .notif-row-message {
        font-size: 12px;
        line-height: 1.4;
        color: var(--fg);
        word-break: break-word;
      }

      .notif-row-meta {
        font-size: 11px;
        color: var(--fg-dim);
      }

      /* Same visual language as .notif-panel-clear's own hover (muted -> danger-tinted on hover) —
         hidden until the row is hovered so the list doesn't read as a wall of X's at rest. */
      .notif-row-dismiss {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        flex: none;
        color: var(--fg-dim);
        cursor: pointer;
        border-radius: 4px;
        opacity: 0;
      }

      .notif-row-dismiss svg {
        width: 11px;
        height: 11px;
      }

      .notif-row:hover .notif-row-dismiss {
        opacity: 1;
      }

      .notif-row-dismiss:hover {
        background: var(--bg-hover);
        color: var(--danger);
      }

      /* .sidebar-tab (primitives.css) is shared with the Modules/Plugins pages' wider, labelled
         list — this narrows *only* the rail's own icon-only usage of it, rather than shrinking
         the shared primitive itself and affecting those other, unrelated places too. */
      #rail-tabs.sidebar-nav {
        gap: 2px;
      }
      #rail-tabs .sidebar-tab {
        padding: 7px;
        border-radius: 0 4px 4px 0;
        /* The shared primitive has no justify-content — fine where there's a text label to keep
           left-aligned (Modules/Plugins, the in-editor managers), but a rail icon has nothing else
           in the row to anchor to, so centering it here (icon-only usage, scoped the same way as
           the padding/radius above) is what actually centers it in the rail's own width. Padding
           is symmetric (7px both sides) and the active indicator is an inset box-shadow rather than
           a border (see .sidebar-tab in primitives.css), so nothing here shifts the button's true
           center — this centers on the rail's full width, active or not. */
        justify-content: center;
      }

      .rail-spacer {
        flex: 1;
      }

      /* Account/settings triggers open through .floating-menu (see openMenuFromTrigger in the
         script below), not a local .menu-dropdown — no positioning override needed here any more. */

      /* ---------- Left / right panels ---------- */
      /* Darker than the center panel on purpose — see the background-shade section below. */
      .side-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .left-panel {
        grid-area: left;
        border-right: 1px solid var(--border);
      }

      .right-panel {
        grid-area: right;
        border-left: 1px solid var(--border);
      }

      .side-panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .side-panel-header h2 {
        flex: 1;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-dim);
        margin: 0;
      }

      .side-panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px;
      }

      /* ---------- Dividers ---------- */
      .divider {
        background: transparent;
        position: relative;
      }
      .divider::after {
        content: "";
        position: absolute;
        inset: 0;
      }
      .divider:hover,
      .divider.is-dragging {
        background: var(--cyan-dark);
      }

      .divider-col {
        cursor: col-resize;
      }
      .divider-col::after {
        left: -2px;
        right: -2px;
      }

      .divider-left {
        grid-area: divL;
      }
      .divider-right {
        grid-area: divR;
      }

      .divider-row {
        grid-area: divC;
        cursor: row-resize;
      }
      .divider-row::after {
        top: -2px;
        bottom: -2px;
      }

      /* ---------- Center panel (Tab Bar + viewport, optionally split into two groups) ---------- */
      /* Brightest of the panels — it's the focus. One background on the wrapper so every group's
         Tab Bar and viewport read as one continuous surface instead of needing the shade set per
         group. .center-panel itself is now just a flex row hosting one or two .editor-group
         columns (each the old .center-panel content verbatim) plus the divider between them — the
         outer grid's "center" cell/area is unchanged, split lives entirely inside it. */
      .center-panel {
        grid-area: center;
        display: flex;
        flex-direction: row;
        min-width: 0;
        overflow: hidden;
        background: var(--bg-raised);
      }

      .editor-group {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Off by default — split is a deliberate opt-in (see toggle-split), not a second pane that
         exists but happens to be empty. */
      .editor-group[data-group="1"] {
        display: none;
      }
      .center-panel.is-split .editor-group[data-group="1"] {
        display: flex;
      }

      /* The subtle cue for "new files open here" — otherwise nothing on screen distinguishes which
         of the two groups is the active drop target once both exist. */
      .editor-group.is-active-group .tab-bar {
        background: var(--bg-hover);
      }

      /* Reuses .divider's own hover/hit-region styling (see the Dividers section below) via a
         second class rather than duplicating it — this one just isn't grid-area-positioned, since
         it sits inside the flex-row .center-panel, not as its own grid track. */
      .editor-group-divider {
        flex: none;
        width: 4px;
        display: none;
      }
      .center-panel.is-split .editor-group-divider {
        display: block;
      }

      .tab-bar {
        display: flex;
        align-items: stretch;
        min-height: 34px;
        padding: 0 6px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .tab-bar-tabs {
        display: flex;
        align-items: stretch;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: thin;
      }

      .tab-bar-empty {
        display: flex;
        align-items: center;
        padding: 0 8px;
        font-size: 12px;
        color: var(--fg-dim);
      }

      /* One tab per open file. A div (not a button) because it hosts a real <button> of its own
         (the close control) — buttons can't nest, and a div with role="button" is the correct
         substitute rather than reaching for a click handler on something semantically wrong.
         Status (clean/dirty/missing) is shown as the underline's color, the same "line, not a
         dot" language as the header-tab/console-tab primitives' active-state underline. Unlike
         those two, a clean tab's line only shows when it's also the active one — matching
         header-tab/console-tab's own rule that an unselected tab shows no line at all, transparent
         at rest (Nolan: "tabs, sidebar or header, shouldn't have that border line if they aren't
         selected... if it is not blue and not selected, don't show a line"). Dirty/missing are
         real status signals worth seeing on a background tab too, so those two keep showing
         unconditionally regardless of which tab is active — only "selected and otherwise
         unremarkable" needs the active check. border-box so the border itself doesn't add to the
         tab's height. */
      .file-tab {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px 0 10px;
        font-size: 12px;
        color: var(--fg-dim);
        border-right: 1px solid var(--border);
        border-bottom: 2px solid transparent;
        cursor: pointer;
        flex: none;
        user-select: none;
      }

      .file-tab.is-active.status-clean {
        border-bottom-color: var(--cyan);
      }

      .file-tab.status-dirty {
        border-bottom-color: var(--yellow);
      }

      .file-tab.status-missing {
        border-bottom-color: var(--danger);
      }

      .file-tab:hover {
        color: var(--fg);
      }

      .file-tab.is-active {
        color: var(--fg);
        background: var(--bg-hover);
      }

      .file-tab:focus-visible {
        outline: 1px solid var(--cyan);
        outline-offset: -1px;
      }

      .file-tab-icon {
        flex: none;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Same reasoning as the file explorer's own row-marker sizing — icons.css's default 150% is
         tuned for a bigger surface than a compact tab. */
      .file-tab-icon.file-icon {
        font-size: 20px;
      }

      /* Always present and laid out (never swapped for something a different size) so hovering a
         tab never shifts its width — just invisible and inert until the tab is hovered or active. */
      .file-tab-close {
        display: flex;
        opacity: 0;
        pointer-events: none;
      }

      .file-tab:hover .file-tab-close,
      .file-tab.is-active .file-tab-close {
        opacity: 1;
        pointer-events: auto;
      }

      .center-viewport-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: var(--fg-dim);
        font-size: 13px;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* Always hosts either .center-viewport-empty or one iframe per mounted viewer instance (see
         the tab-bar/open-files JS below — one instance can now show several open files, so this
         isn't one-per-file any more) — never bare text of its own any more, so this stays a plain
         block container; whichever child is actually showing manages its own sizing/centering. */
      .center-viewport {
        flex: 1;
        min-height: 0;
        display: block;
        overflow: hidden;
      }

      /* ---------- Console ---------- */
      /* Same darker shade as the left/right panels — console, sidebar, and inspector are all
         "supporting" surfaces around the bright center focus. */
      .console-panel {
        grid-area: console;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
        min-height: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .console-tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .console-tabs-spacer {
        flex: 1;
      }

      .console-session-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .console-header-divider {
        width: 1px;
        height: 18px;
        margin: 0 6px;
        background: var(--border);
        flex: none;
      }

      /* "New Terminal With…" opens through .floating-menu (see openMenuFromTrigger in the script
         below), not a local .menu-dropdown — no positioning override needed here any more. */


      /* Reinstated for plugin-contributed console tabs (see PanelContribution.location ==
         "console") — same underline pattern as .header-tab, tuned for the console's smaller row. */
      .console-tab {
        all: unset;
        box-sizing: border-box;
        position: relative;
        top: 1px;
        padding: 7px 2px;
        margin: 0 8px;
        font-size: 12px;
        color: var(--fg-dim);
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }

      .console-tab:first-child {
        margin-left: 0;
      }

      .console-tab:hover {
        color: var(--fg);
      }

      .console-tab.is-active {
        color: var(--fg);
        border-bottom-color: var(--cyan);
      }

      .plugin-panel-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
      }

      .plugin-panel-frame.is-active {
        display: block;
      }

      /* Same slot/show-hide convention as .plugin-panel-frame — the per-tab wrapper showSlotTab()
         creates for every "sidebar"/"inspector"/"console" contribution, host or plugin alike (see
         primitives.js's contribute()/getSlot() and renderTabStrip/showSlotTab below). Flex column,
         not block, so a host panel's toolbar-above-a-list layout works; a plugin's plain iframe
         just becomes that column's sole child and fills it the same way. */
      .host-panel-frame {
        width: 100%;
        height: 100%;
        min-width: 0;
        display: none;
        flex-direction: column;
      }

      .host-panel-frame.is-active {
        display: flex;
      }

      /* ---------- In-editor plugin manager ---------- */
      /* Single-column accordion, not the wide two-pane .manage-list/.manage-detail layout the
         standalone Plugins page uses — the sidebar defaults to 240px, the same width .manage-list
         alone takes on that page, nowhere near enough room for a detail pane beside it too. Each
         row expands in place instead of navigating to a separate detail view. */
      .plugin-manager-toolbar {
        flex: none;
        padding: 8px;
        border-bottom: 1px solid var(--border);
      }

      .plugin-manager-list {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
      }

      .plugin-manager-empty {
        padding: 16px 12px;
        font-size: 13px;
        color: var(--fg-dim);
      }

      .plugin-manager-row {
        border-bottom: 1px solid var(--border);
      }

      .plugin-manager-row-header {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }

      .plugin-manager-row-header:hover {
        background: var(--bg-hover);
      }

      .plugin-manager-row-name {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .plugin-manager-row-chevron {
        flex: none;
        display: flex;
        color: var(--fg-dim);
        transform: rotate(0deg);
        transition: transform 0.08s ease;
      }

      .plugin-manager-row-chevron.expanded {
        transform: rotate(90deg);
      }

      .plugin-manager-row-chevron svg {
        width: 10px;
        height: 10px;
      }

      .plugin-manager-row-body {
        padding: 0 10px 12px 26px;
        min-width: 0;
      }

      .plugin-manager-row-sub {
        font-size: 11px;
        color: var(--fg-dim);
        margin-bottom: 6px;
      }

      .plugin-manager-row-desc {
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 10px;
      }

      /* flex-wrap, not a fixed side-by-side layout — the checkbox label plus the Remove button
         don't reliably both fit on one line at the sidebar's narrower widths (confirmed live: they
         were forcing the whole panel wider than the sidebar, spawning a horizontal scrollbar).
         Wrapping the button to its own line costs nothing when there IS room (it still sits on the
         same line then) and just avoids the overflow entirely when there isn't. */
      .plugin-manager-row-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 8px;
      }

      /* Zeroes the placeholder-era padding/centering once the inspector actually hosts a plugin
         panel — a value editor shouldn't sit inset behind decorative padding. .center-viewport
         doesn't need this toggle any more; it stays padding:0 permanently now that it always
         hosts either .center-viewport-empty or an open file's iframe, same reasoning as
         .console-body below staying padding:0 permanently for the same kind of always-hosts-
         something reason. */
      .side-panel-body.hosts-plugin {
        padding: 0;
        overflow: hidden;
        display: block;
      }

      .console-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      /* The one console tab that isn't plugin-contributed — dev-run and plugin log output. Always
         present, since it's core functionality rather than something a plugin supplies (see the
         "__run" contribute("console", ...) call, order:-10 so it always sorts first). Its own
         is-active never toggles again once set — see showSlotTab()'s per-tab .host-panel-frame
         wrapper, which is what actually governs whether this is visible. */
      #console-run-panel {
        display: none;
        height: 100%;
        overflow: auto;
        padding: 8px 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--fg-dim);
        white-space: pre-wrap;
        box-sizing: border-box;
      }

      #console-run-panel.is-active {
        display: block;

      #console-run-panel .line + .line {
        margin-top: 2px;
      }

      /* ---------- Status bar ---------- */
      .status-bar {
        grid-area: status;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 3px 12px;
        border-top: 1px solid var(--border);
        background: var(--bg-raised);
        font-size: 11px;
        color: var(--fg-dim);
        flex: none;
      }

      .status-bar .status-spacer {
        flex: 1;
      }
    </style>
  </head>

    <!-- Popup Base's stack — a sibling of .shell/.floating-menu for the same reason (nothing can
         clip it). Empty by default; showPopup() (see the script below) creates and removes each
         instance's own .popup-backdrop/.popup on demand, rather than static markup toggled by
         class like the three popups this replaced. -->
    <div class="popup-stack" id="popup-stack"></div>

    <script src="primitives.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const projectPath = params.get("project") || "(unknown project)";
      const projectName = projectPath.split(/[\\/]/).pop() || projectPath;
      document.getElementById("status-project").textContent = projectName;

      const { invoke } = window.__TAURI__.core;
      const { open: openDialog, save: saveDialog } = window.__TAURI__.dialog;
      const { openUrl } = window.__TAURI__.opener;

      // Plugin panel/viewer content is hosted on a real loopback HTTP origin, not a Tauri custom
      // URI scheme — on Windows/WebView2, a sub-frame (iframe) navigation to a custom scheme
      // silently never loads at all (confirmed directly: the Rust-side handler was never even
      // invoked). A plain http://127.0.0.1:<port> origin has none of that baggage. The port is
      // ephemeral (OS-assigned at app startup), fetched once here and cached.
      let pluginAssetPortPromise = null;
      function pluginAssetPort() {
        if (!pluginAssetPortPromise) pluginAssetPortPromise = invoke("plugin_asset_port");
        return pluginAssetPortPromise;
      }
      async function pluginAssetUrl(pluginId, relPath, fragment) {
        const port = await pluginAssetPort();
        return `http://127.0.0.1:${port}/${pluginId}/${relPath}${fragment ? `#${fragment}` : ""}`;
      }

      function openEditor(path) {
        window.location.href = `editor.html?project=${encodeURIComponent(path)}`;
      }

      // ---------- Menu bar ----------
      // Every top-bar dropdown shares the same open/close mechanics: click a trigger to open it
      // (closing any other open menu first), click outside/Escape/pick an item to close it, and
      // hovering a different trigger while one is already open switches to it (how a real menu bar
      // behaves) rather than requiring a fresh click. The rail's account/settings flyouts and the
      // console's "New Terminal With…" used to be part of this same MENU_IDS-driven list (each its
      // own local .menu-dropdown) — they've moved to the shared .floating-menu overlay instead (see
      // openMenuFromTrigger below), since all three sit near a window edge that a locally-anchored
      // dropdown could run off of.
      const MENU_IDS = ["file-menu", "edit-menu", "view-menu", "run-menu", "help-menu"];

      function closeAllMenus() {
        MENU_IDS.forEach((id) => {
          document.getElementById(id).classList.remove("is-open");
          document.getElementById(`${id}-trigger`).setAttribute("aria-expanded", "false");
        });
      }

      MENU_IDS.forEach((id) => {
        const menu = document.getElementById(id);
        const trigger = document.getElementById(`${id}-trigger`);

        trigger.addEventListener("click", (e) => {
          e.stopPropagation();
          const opening = !menu.classList.contains("is-open");
          closeAllMenus();
          if (opening) {
            menu.classList.add("is-open");
            trigger.setAttribute("aria-expanded", "true");
          }
        });

        trigger.addEventListener("mouseenter", () => {
          const anyOpen = MENU_IDS.some((mid) => document.getElementById(mid).classList.contains("is-open"));
          if (anyOpen && !menu.classList.contains("is-open")) {
            closeAllMenus();
            menu.classList.add("is-open");
            trigger.setAttribute("aria-expanded", "true");
          }
        });
      });

      document.addEventListener("click", closeAllMenus);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeAllMenus();
          closeFloatingMenu();
        }
      });

      document.querySelectorAll(".menu-dropdown-item:not(:disabled)").forEach((btn) => {
        btn.addEventListener("click", closeAllMenus);
      });

      // ---------- Floating menu (shared overlay — see .floating-menu in primitives.css) ----------
      // A menu rendered here is a sibling of every panel and every iframe (see the HTML above,
      // right after .shell closes), so nothing can clip it and it isn't bound to any one trigger's
      // local DOM position the way .menu-dropdown-list is — it's positioned and clamped to the real
      // window on every open instead. Everything that used to be a local .menu-dropdown near a
      // window edge (the rail's account/settings flyouts, the console's "New Terminal With…") now
      // opens through this; a plugin's own content can ask for one too, via window.lowarc.showMenu
      // (see the "showMenu" branch in the message listener below).
      let floatingMenuResolve = null;

      function closeFloatingMenu(result) {
        if (!floatingMenuResolve) return;
        const resolve = floatingMenuResolve;
        floatingMenuResolve = null;
        document.getElementById("floating-menu").classList.remove("is-open");
        resolve(result === undefined ? null : result);
      }

      // Every "click outside closes it" overlay this document has, called together — not just
      // from an actual outside click, but also (see the iframe "focus" listeners in
      // mountPanelIframe/mountFileInGroup below) whenever focus moves INTO a plugin iframe, since a
      // click that lands inside a sandboxed iframe never bubbles up to this document at all and so
      // never reaches any of these overlays' own individual document-click listeners. Without this,
      // clicking into Monaco (or any other plugin) while a menu was open left it stuck open —
      // reported live, not theoretical.
      function closeAllOverlays() {
        closeAllMenus();
        closeFloatingMenu();
        closeAllDropdowns();
      }

      // Low-level: positions the shared #floating-menu-list at `anchor` ({x, y} in viewport
      // coordinates, the corner it tries to open from — below-right by default, matching where
      // .menu-dropdown-list used to open) and shows the overlay. Callers fill the list's content
      // themselves first — shared by openMenuOverlay (action-menu items) and the notification
      // bell's read-only history panel below, since the actual position/clamp/show mechanics are
      // identical for both; only what's inside, and what happens on close, differs.
      function showFloatingOverlay(anchor) {
        const overlay = document.getElementById("floating-menu");
        const list = document.getElementById("floating-menu-list");

        // Positioned at the naive anchor first, then measured and clamped — the list has to
        // actually exist in the DOM with real content before its own rendered size is knowable.
        list.style.left = `${anchor.x}px`;
        list.style.top = `${anchor.y}px`;
        overlay.classList.add("is-open");

        requestAnimationFrame(() => {
          const rect = list.getBoundingClientRect();
          const margin = 6;
          let left = anchor.x;
          let top = anchor.y;
          if (left + rect.width > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - margin - rect.width);
          if (top + rect.height > window.innerHeight - margin) top = Math.max(margin, anchor.y - rect.height - (anchor.gap || 0));
          if (left < margin) left = margin;
          if (top < margin) top = margin;
          list.style.left = `${left}px`;
          list.style.top = `${top}px`;
        });
      }

      const MENU_CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>';

      // items: [{label, value, disabled, checked}], a divider is {divider: true}. `checked` is
      // optional — only present it for a genuinely checkable menu (see the Rail/Console visibility
      // toggle below); omitting it on every item keeps an ordinary action menu (File/Edit/View, …)
      // looking exactly as it always has, no reserved checkmark gutter. Returns a Promise resolving
      // to the chosen item's value, or null if the menu was dismissed without a choice.
      function openMenuOverlay(items, anchor) {
        closeFloatingMenu();
        return new Promise((resolve) => {
          const list = document.getElementById("floating-menu-list");
          list.innerHTML = "";
          list.classList.remove("notif-panel-list");

          for (const item of items) {
            if (item.divider) {
              const div = document.createElement("div");
              div.className = "menu-dropdown-divider";
              list.appendChild(div);
              continue;
            }
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "menu-dropdown-item";
            if (item.checked !== undefined) {
              const check = document.createElement("span");
              check.className = "menu-dropdown-item-check";
              if (item.checked) check.innerHTML = MENU_CHECK_SVG;
              btn.appendChild(check);
            }
            const label = document.createElement("span");
            label.textContent = item.label;
            btn.appendChild(label);
            btn.disabled = Boolean(item.disabled);
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              closeFloatingMenu(item.value ?? null);
            });
            list.appendChild(btn);
          }

          floatingMenuResolve = resolve;
          showFloatingOverlay(anchor);
        });
      }

      // Convenience for a real trigger element — opens just below it, same default corner
      // .menu-dropdown-list used to, minus the per-trigger CSS overrides that used to be needed
      // for triggers near an edge (openMenuOverlay's own clamping replaces those).
      function openMenuFromTrigger(triggerEl, items) {
        const rect = triggerEl.getBoundingClientRect();
        return openMenuOverlay(items, { x: rect.left, y: rect.bottom + 2, gap: rect.height + 4 });
      }

      // ---------- Popup contributions (host) ----------
      // showPopup()/the "popups" stack itself now lives in primitives.js (promoted there once
      // settings.html/modules.html/plugins.html adopted it too — see the comment on it there for
      // the full mechanics). These are the three popups editor.html used to hand-author as static
      // HTML + openPopup(id)/closePopup(id) (primitives.js's older, simple element-toggle pair —
      // still used as-is by anything that hasn't migrated).

      contribute("popups", {
        id: "new-project",
        sourceType: "host",
        title: "New project name",
        size: 360,
        mount(container, ctx) {
          const body = document.createElement("div");
          body.className = "popup-body";
          const field = document.createElement("div");
          field.className = "field";
          const nameInput = document.createElement("input");
          nameInput.className = "input";
          nameInput.type = "text";
          nameInput.placeholder = "my-game";
          nameInput.autocomplete = "off";
          field.appendChild(nameInput);
          body.appendChild(field);
          const errorEl = document.createElement("div");
          errorEl.className = "field-hint";
          errorEl.style.color = "var(--danger)";
          errorEl.style.minHeight = "16px";
          errorEl.style.marginTop = "6px";
          body.appendChild(errorEl);
          container.appendChild(body);

          const actions = document.createElement("div");
          actions.className = "popup-actions";
          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn btn-md btn-ghost";
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", () => ctx.close(null));
          const createBtn = document.createElement("button");
          createBtn.type = "button";
          createBtn.className = "btn btn-md btn-confirm";
          createBtn.textContent = "Create";
          actions.appendChild(cancelBtn);
          actions.appendChild(createBtn);
          container.appendChild(actions);

          const create = async () => {
            try {
              const path = await invoke("create_project", { parentDir: ctx.target.parentDir, name: nameInput.value });
              ctx.close(path);
            } catch (err) {
              errorEl.textContent = String(err);
            }
          };
          createBtn.addEventListener("click", create);
          nameInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") create();
          });
        },
      });

      contribute("popups", {
        id: "about",
        sourceType: "host",
        title: "About",
        size: 320,
        mount(container, ctx) {
          const body = document.createElement("div");
          body.className = "popup-body";
          body.style.textAlign = "center";
          body.style.padding = "8px 16px 20px";
          const img = document.createElement("img");
          img.src = "la-logo.svg";
          img.alt = "";
          img.style.height = "48px";
          img.style.marginBottom = "12px";
          body.appendChild(img);
          const name = document.createElement("div");
          name.style.fontSize = "15px";
          name.style.fontWeight = "600";
          name.textContent = "LowArc Studio";
          body.appendChild(name);
          const version = document.createElement("div");
          version.className = "field-hint";
          version.style.marginTop = "4px";
          version.textContent = (ctx.target && ctx.target.version) || "";
          body.appendChild(version);
          container.appendChild(body);
        },
      });

      // A plain reference list, not a settings surface — nothing here is configurable yet, so
      // there's no rebinding UI, just what each combination currently does. The Undo/Redo/Cut/
      // Copy/Paste/Find/Replace rows are Monaco's own built-in keybindings (only live while an
      // editor tab has focus); Save/Save As/Command Palette are the host's own, added alongside
      // the matching menu items and working regardless of which panel has focus, EXCEPT while a
      // plugin iframe (an editor tab included) is the one actually focused — a sandboxed iframe's
      // keydown never reaches this document, so the host-level bindings only fire from host chrome
      // (the sidebar, empty space, etc.), a real cross-iframe limitation, not a bug.
      const SHORTCUT_GROUPS = [
        { keys: "Ctrl+S", label: "Save" },
        { keys: "Ctrl+Shift+S", label: "Save As…" },
        { keys: "Ctrl+Shift+P", label: "Command Palette" },
        { keys: "Ctrl+Z", label: "Undo" },
        { keys: "Ctrl+Y", label: "Redo" },
        { keys: "Ctrl+X", label: "Cut" },
        { keys: "Ctrl+C", label: "Copy" },
        { keys: "Ctrl+V", label: "Paste" },
        { keys: "Ctrl+F", label: "Find" },
        { keys: "Ctrl+H", label: "Replace" },
      ];

      contribute("popups", {
        id: "shortcuts",
        sourceType: "host",
        title: "Keyboard Shortcuts",
        size: 340,
        mount(container, ctx) {
          const body = document.createElement("div");
          body.className = "popup-body";
          for (const { keys, label } of SHORTCUT_GROUPS) {
            const row = document.createElement("div");
            row.className = "shortcut-row";
            const labelEl = document.createElement("span");
            labelEl.textContent = label;
            const keysEl = document.createElement("span");
            keysEl.className = "shortcut-keys";
            keysEl.textContent = keys;
            row.appendChild(labelEl);
            row.appendChild(keysEl);
            body.appendChild(row);
          }
          container.appendChild(body);
        },
      });

      // Shared by both in-editor managers (plugin, module) — only one is ever open at a time, and
      // each call just passes its own nounSingular/name as target, so there's no reason for two
      // near-identical contributions.
      contribute("popups", {
        id: "manager-remove",
        sourceType: "host",
        title: (target) => `Remove ${target.nounSingular}?`,
        size: 340,
        mount(container, ctx) {
          const body = document.createElement("div");
          body.className = "popup-body";
          body.textContent = `This deletes "${ctx.target.name}" from disk. This can't be undone.`;
          container.appendChild(body);

          const actions = document.createElement("div");
          actions.className = "popup-actions";
          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn btn-md btn-ghost";
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", () => ctx.close(false));
          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "btn btn-md btn-danger";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", () => ctx.close(true));
          actions.appendChild(cancelBtn);
          actions.appendChild(removeBtn);
          container.appendChild(actions);
        },
      });

      // Gates closeFile() (see the tab-bar/open-files section below) on a real confirmation
      // whenever the file being closed is dirty — target is just { title }, resolves true/false
      // like manager-remove above.
      contribute("popups", {
        id: "confirm-close-dirty",
        sourceType: "host",
        title: "Unsaved changes",
        size: 360,
        mount(container, ctx) {
          const body = document.createElement("div");
          body.className = "popup-body";
          body.textContent = `"${ctx.target.title}" has unsaved changes. Close it anyway?`;
          container.appendChild(body);

          const actions = document.createElement("div");
          actions.className = "popup-actions";
          const cancelBtn = document.createElement("button");
          cancelBtn.type = "button";
          cancelBtn.className = "btn btn-md btn-ghost";
          cancelBtn.textContent = "Cancel";
          cancelBtn.addEventListener("click", () => ctx.close(false));
          const discardBtn = document.createElement("button");
          discardBtn.type = "button";
          discardBtn.className = "btn btn-md btn-danger";
          discardBtn.textContent = "Close Anyway";
          discardBtn.addEventListener("click", () => ctx.close(true));
          actions.appendChild(cancelBtn);
          actions.appendChild(discardBtn);
          container.appendChild(actions);
        },
      });

      // Settings/Modules/Plugins stay their own separate documents (real Tauri API access,
      // multiple entry points already before this) — see contributeIframePopup() in primitives.js.
      // The url passed to each showPopup() call below is what actually varies per trigger (e.g.
      // settings.html's own ?tab=appearance), not the registration itself.
      contributeIframePopup("settings", { title: "Settings" });
      contributeIframePopup("modules", { title: "Modules", forwardEvents: ["install-progress"] });
      contributeIframePopup("plugins", { title: "Plugins", forwardEvents: ["install-progress"] });
      contributeIframePopup("export", { title: "Export", forwardEvents: ["export-log", "export-ended"] });

      // ---------- Header search ----------
      // A real searchbar now, not a button that opens one — types in place, shows matches in the
      // same dropdown popover initSearchbar() already drives everywhere else. Sourced from
      // buildSearchableSettingsList() (primitives.js) plus this file's own command registry below —
      // this bar isn't a "settings search," it's the app's one general search entry point; more
      // sources (open files, whatever comes later) fold into the same options list, not a second
      // search UI.
      //
      // HEADER_SEARCH_CATEGORIES is the fixed, ordered set of result groups this bar knows about —
      // a category with nothing matching a given query just doesn't render its divider (see
      // initSearchbar's `categories` option), so "results" having no source yet today is invisible,
      // not a placeholder gap. "results" (in-open-file text search) is deliberately not built here
      // — that becomes the Monaco plugin's own contribution once it exists, not core's business.
      // "commands" (Command Palette — the term predates VS Code, from Sublime Text, and is the
      // industry-standard name for "searchable list of actions" across editors generally, so it's
      // kept rather than invented fresh) is populated below.
      const HEADER_SEARCH_CATEGORIES = [
        // browsable: false — in-file text search has nothing meaningful to preview with no query
        // typed yet, unlike Settings/Command Palette, which are real fixed lists worth browsing.
        { id: "results", label: "Results", browsable: false },
        { id: "commands", label: "Command Palette" },
        { id: "settings", label: "Settings" },
      ];

      // Command Palette registry, half of it anyway — the host-owned half. Every ENABLED item in
      // the File/Edit/View/Run/Help menu bar is already a real DOM element with a label and a
      // click handler; scanning it rather than hand-maintaining a second list is what keeps this
      // from drifting out of sync with the actual menu the moment someone adds an item and forgets
      // the palette entry. Disabled placeholders (Save, Undo, Command Palette's own menu label
      // wouldn't be one of these anyway) are skipped — nothing to run yet.
      function buildHostMenuCommands() {
        const commands = [
          // Settings has no menu-bar item of its own to scan below — it only lives in the
          // gear icon's own dynamically-built floating menu (openMenuFromTrigger, not a real
          // .menu-dropdown-item at any point), so it's added by hand here instead.
          { id: "command:host:settings", label: "Settings", category: "commands", kind: "command", run: () => showPopup("settings", { url: "settings.html" }) },
        ];
        document.querySelectorAll(".menu-dropdown-item").forEach((btn) => {
          if (btn.disabled) return;
          const label = btn.textContent.trim();
          if (!label) return;
          commands.push({ id: `command:host:${btn.id}`, label, category: "commands", kind: "command", run: () => btn.click() });
        });
        return commands;
      }

      // The other half — plugin-declared. A sandboxed plugin's content can't be introspected the
      // way the host's own menu bar can, so it has to say what it offers itself, via plugin.json's
      // `commands` array (same shape/spirit as `settings` — see PluginCommand in protocol.rs).
      async function buildPluginCommands() {
        let plugins = [];
        try {
          plugins = await invoke("list_installed_plugins");
        } catch (err) {
          return [];
        }
        const commands = [];
        for (const plugin of plugins) {
          for (const cmd of plugin.commands || []) {
            commands.push({
              id: `command:plugin:${plugin.id}:${cmd.id}`,
              label: cmd.label,
              hint: cmd.hint,
              category: "commands",
              kind: "command",
              run: () => runPluginCommand(plugin.id, cmd.id),
            });
          }
        }
        return commands;
      }

      // Opens whichever slot `pluginId` actually contributes (sidebar panel, inspector, or console
      // tab), mounting its iframe fresh if it wasn't already, and resolves once that iframe is
      // genuinely ready to receive a message — not just once the element exists. A freshly-created
      // iframe's own scripts (including whatever registers window.lowarc.on("lowarc:runCommand", ...))
      // haven't run yet the instant mount() returns; waiting for the iframe's `load` event is what
      // actually guarantees the plugin's own listener exists before anything gets sent to it. An
      // already-mounted iframe's `load` already fired in the past, so it's returned immediately —
      // attaching a new `load` listener to it here would just wait forever. Resolves null for a
      // plugin with no panel/console-tab contribution at all (e.g. viewer-only) — nothing to open.
      function ensurePluginMounted(pluginId) {
        for (const [key, entry] of pluginPanels) {
          if (entry.pluginId !== pluginId) continue;
          const wasMounted = Boolean(entry.iframe);
          const location = entry.panel.location; // "sidebar" | "inspector" | undefined (a console tab)

          if (location === "sidebar") {
            showSlotTab("sidebar", "left-panel-body", key);
            setPanelOpen("sidebar", true);
          } else if (location === "inspector") {
            // Inspector's single content slot is mounted once, unconditionally, at startup
            // (renderSingleSlot) — opening it is purely making the panel visible, nothing to mount.
            setPanelOpen("right", true);
          } else {
            setPanelOpen("console", true);
            activateConsoleTab(key);
          }

          if (!entry.iframe) return Promise.resolve(null); // contribution registered but mount() itself failed
          if (wasMounted) return Promise.resolve(entry.iframe);
          return new Promise((resolve) => entry.iframe.addEventListener("load", () => resolve(entry.iframe), { once: true }));
        }
        return Promise.resolve(null);
      }

      // A viewer plugin (Monaco, so far) can have several iframes mounted at once — one per open
      // file, possibly across both split groups — so "the" mounted instance a panel/console-tab
      // plugin has doesn't apply; its commands mean "run this in the file I'm currently looking
      // at." The active file's own iframe is tried first (only really matches a viewer); anything
      // else (Debug, Terminal, file explorer) has no open-file iframe of its own, so this falls
      // through to the existing panel/console-tab path unchanged.
      async function runPluginCommand(pluginId, commandId) {
        const activeFile = openFiles.get(groupActiveFilePath[activeGroupId]);
        if (activeFile && activeFile.pluginId === pluginId && activeFile.iframe) {
          activeFile.iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:runCommand", payload: { commandId } }, "*");
          return;
        }
        const iframe = await ensurePluginMounted(pluginId);
        if (!iframe) {
          showToast({ variant: "error", message: "That plugin has nothing to open — its command can't run." });
          return;
        }
        iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:runCommand", payload: { commandId } }, "*");
      }

      // The live array backing the Command Palette / Settings section of the header search — kept
      // as ONE array object, mutated in place (push/splice, never reassigned), because initSearchbar
      // (primitives.js) closes over whatever array it's handed at init time with no way to hand it
      // a fresh one later. Each entry carries `value` (identical to `id`) purely because that's the
      // field name initSearchbar's own rendering reads — letting `options` below just BE this same
      // array, instead of a separate .map()'d copy that would silently stop tracking it.
      const commandCenterEntries = [];

      // The dynamic counterpart to buildPluginCommands() below — see window.lowarc.setCommands() in
      // plugin_assets.rs. Re-registering (Monaco does this on every editor mount) replaces this
      // plugin's previous set rather than piling up duplicates.
      function setDynamicPluginCommands(pluginId, commands) {
        for (let i = commandCenterEntries.length - 1; i >= 0; i--) {
          if (commandCenterEntries[i].dynamicPluginId === pluginId) commandCenterEntries.splice(i, 1);
        }
        for (const cmd of commands) {
          if (!cmd || typeof cmd.id !== "string" || typeof cmd.label !== "string") continue;
          const id = `command:plugin:${pluginId}:${cmd.id}`;
          commandCenterEntries.push({
            id, value: id, label: cmd.label, hint: cmd.hint, category: "commands", kind: "command",
            dynamicPluginId: pluginId,
            run: () => runPluginCommand(pluginId, cmd.id),
          });
        }
      }

      const commandCenterSearch = document.getElementById("command-center-search");
      const commandCenterInput = commandCenterSearch.querySelector("input");

      Promise.all([buildSearchableSettingsList(), buildPluginCommands()]).then(([settingEntries, pluginCommands]) => {
        commandCenterEntries.push(...settingEntries, ...buildHostMenuCommands(), ...pluginCommands);
        commandCenterEntries.forEach((e) => { e.value = e.id; });
        initSearchbar(commandCenterSearch, {
          options: commandCenterEntries,
          categories: HEADER_SEARCH_CATEGORIES,
          onSelect: (value) => {
            const entry = commandCenterEntries.find((e) => e.id === value);
            commandCenterInput.value = "";
            commandCenterSearch.classList.remove("has-value");
            if (!entry) return;
            if (entry.kind === "command") {
              entry.run();
              return;
            }
            showPopup("settings", { url: `settings.html?search=${encodeURIComponent(entry.label)}&id=${encodeURIComponent(entry.id)}` }).catch(reportError);
          },
        });
      });

      // ---------- Notification bell ----------
      // Reads the exact same history every showToast() call (host chrome's own, and any plugin's
      // via window.lowarc.notify()) already feeds — see primitives.js's toast/notification-history
      // section. This panel is read-only history, not an action menu, so it bypasses
      // openMenuOverlay's items/resolve-a-value shape entirely and builds #floating-menu-list's
      // content by hand instead, reusing only the low-level positioning (showFloatingOverlay).
      let unreadNotifications = 0;

      function updateBellBadge() {
        document.getElementById("bell-badge").style.display = unreadNotifications > 0 ? "block" : "none";
      }

      function formatNotificationTime(ms) {
        const diff = Date.now() - ms;
        if (diff < 60000) return "just now";
        if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
        if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
        return new Date(ms).toLocaleDateString();
      }

      function renderNotificationList(list) {
        list.innerHTML = "";
        const history = getNotificationHistory();

        const header = document.createElement("div");
        header.className = "notif-panel-header";
        const title = document.createElement("span");
        title.textContent = "Notifications";
        header.appendChild(title);
        if (history.length) {
          const clearBtn = document.createElement("button");
          clearBtn.type = "button";
          clearBtn.className = "notif-panel-clear";
          clearBtn.textContent = "Clear";
          clearBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            clearNotificationHistory();
            renderNotificationList(list);
          });
          header.appendChild(clearBtn);
        }
        list.appendChild(header);

        if (!history.length) {
          const empty = document.createElement("div");
          empty.className = "notif-panel-empty";
          empty.textContent = "No notifications yet.";
          list.appendChild(empty);
          return;
        }

        for (const entry of history) {
          const row = document.createElement("div");
          row.className = `notif-row toast-${entry.variant}`;

          const icon = document.createElement("span");
          icon.className = "toast-icon";
          icon.innerHTML = `<svg viewBox="0 0 16 16" fill="none">${TOAST_ICON_PATHS[entry.variant] || TOAST_ICON_PATHS.info}</svg>`;
          row.appendChild(icon);

          const body = document.createElement("span");
          body.className = "notif-row-body";
          const message = document.createElement("span");
          message.className = "notif-row-message";
          message.textContent = entry.message;
          body.appendChild(message);
          const meta = document.createElement("span");
          meta.className = "notif-row-meta";
          meta.textContent = formatNotificationTime(entry.time) + (entry.source ? ` · ${entry.source}` : "");
          body.appendChild(meta);
          row.appendChild(body);

          const dismissBtn = document.createElement("button");
          dismissBtn.type = "button";
          dismissBtn.className = "notif-row-dismiss";
          dismissBtn.setAttribute("aria-label", "Dismiss");
          dismissBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>';
          dismissBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            removeNotificationHistoryEntry(entry.id);
            renderNotificationList(list);
          });
          row.appendChild(dismissBtn);

          list.appendChild(row);
        }
      }

      function openNotificationPanel(triggerEl) {
        closeFloatingMenu();
        const list = document.getElementById("floating-menu-list");
        list.classList.add("notif-panel-list");
        renderNotificationList(list);
        floatingMenuResolve = () => {}; // nothing to resolve — dismissal alone is the only outcome

        unreadNotifications = 0;
        updateBellBadge();

        const rect = triggerEl.getBoundingClientRect();
        showFloatingOverlay({ x: rect.left, y: rect.bottom + 2, gap: rect.height + 4 });
      }

      onNotification(() => {
        unreadNotifications++;
        updateBellBadge();
      });

      document.getElementById("bell-trigger").addEventListener("click", (e) => {
        e.stopPropagation();
        openNotificationPanel(e.currentTarget);
      });

      document.getElementById("floating-menu").addEventListener("click", (e) => {
        if (e.target.id === "floating-menu") closeFloatingMenu();
      });

      // Finds the <iframe> a given window belongs to — lets showMenu() (see the message listener
      // below) translate a plugin's own local click coordinates into host/screen coordinates. Every
      // plugin-hosted iframe (sidebar/inspector/console-tab panels AND open-file viewers, in either
      // editor group) carries this same class, so one query covers all of them without a second map
      // to keep in sync with mountPanelIframe/openFile/closeFile.
      function iframeForWindow(win) {
        for (const iframe of document.querySelectorAll("iframe.plugin-panel-frame")) {
          if (iframe.contentWindow === win) return iframe;
        }
        return null;
      }

      document.getElementById("account-menu-trigger").addEventListener("click", (e) => {
        e.stopPropagation();
        openMenuFromTrigger(e.currentTarget, [
          { label: "Not Signed In", disabled: true },
          { divider: true },
          { label: "Sign In…", disabled: true },
        ]);

      document.getElementById("settings-menu-trigger").addEventListener("click", (e) => {
        e.stopPropagation();
        openMenuFromTrigger(e.currentTarget, [
          { label: "Settings", value: "settings" },
          { label: "Appearance…", value: "appearance" },
          { divider: true },
          { label: "Check for Updates", disabled: true },
        ]).then((value) => {
          if (value === "settings") showPopup("settings", { url: "settings.html" });
          else if (value === "appearance") showPopup("settings", { url: "settings.html?tab=appearance" });
        });

      // ---------- File menu ----------
      document.getElementById("back-to-start").addEventListener("click", () => {
        window.location.href = "index.html";
      });

      document.getElementById("file-modules-item").addEventListener("click", () => {
        showPopup("modules", { url: "modules.html" });
      });

      document.getElementById("file-plugins-item").addEventListener("click", () => {
        showPopup("plugins", { url: "plugins.html" });
      });

      document.getElementById("file-export-item").addEventListener("click", () => {
        showPopup("export", { url: "export.html?project=" + encodeURIComponent(projectPath) });
      });

      document.getElementById("exit-item").addEventListener("click", () => {
        window.__TAURI__.window.getCurrentWindow().close();
      });

      document.getElementById("open-project-item").addEventListener("click", async () => {
        const path = await openDialog({ directory: true, title: "Open Folder" });
        if (!path) return;
        try {
          await invoke("open_project", { path });

        } catch (err) {

        }
      });

      document.getElementById("new-project-item").addEventListener("click", async () => {
        const parentDir = await openDialog({ directory: true, title: "Choose a folder for the new project" });
        if (!parentDir) return;
        const path = await showPopup("new-project", { parentDir });
        if (path) openEditor(path);
      });

      // ---------- File menu: Save / Save As ----------
      // Both route through the active file's own viewer iframe rather than the host reading/
      // writing disk directly — the iframe holds whatever's actually in its buffer (unsaved edits
      // included), the same reasoning moveFileToGroup() already relies on via
      // requestPluginContent(). A viewer with nothing to save (no open file, or a read-only viewer
      // like Media Viewer that never implements lowarc:getContent/requestSave) just does nothing —
      // Save is a silent no-op, Save As surfaces the same "couldn't read content" toast
      // requestPluginContent's null timeout already produces for other callers.
      function activeFileEntry() {
        return openFiles.get(groupActiveFilePath[activeGroupId]) || null;
      }

      document.getElementById("file-save-item").addEventListener("click", () => {
        const file = activeFileEntry();
        if (!file || !file.iframe) return;
        file.iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:requestSave" }, "*");
      });

      document.getElementById("file-save-as-item").addEventListener("click", async () => {
        const path = groupActiveFilePath[activeGroupId];
        const file = path ? openFiles.get(path) : null;
        if (!file || !file.iframe) return;
        const content = await requestPluginContent(file.iframe, path);
        if (content === null) {
          showToast({ variant: "error", message: "Couldn't read this file's current content to save it." });
          return;
        }
        const target = await saveDialog({ defaultPath: path });
        if (!target) return;
        try {
          await invoke("write_text_file", { path: target, contents: content });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }
        openFile(target);
      });

      // ---------- Edit menu ----------
      // Routed to whichever viewer iframe is showing the active file via a small generic "run this
      // editor command" event (lowarc:editorCommand), not the existing lowarc:runCommand — Undo/
      // Redo aren't registered Monaco Actions (only genuine Actions show up via editor.getAction(),
      // see refreshCommands() in monaco.js), so they need editor.trigger() instead, which reaches a
      // command OR an action either way. A viewer that doesn't understand a given command id just
      // ignores the event — nothing to route to for a read-only viewer, same graceful no-op as any
      // other unhandled event in this contract.
      function sendEditorCommand(command) {
        const file = activeFileEntry();
        if (!file || !file.iframe) return;
        file.iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:editorCommand", payload: { command } }, "*");
      }

      document.getElementById("edit-undo-item").addEventListener("click", () => sendEditorCommand("undo"));
      document.getElementById("edit-redo-item").addEventListener("click", () => sendEditorCommand("redo"));
      document.getElementById("edit-cut-item").addEventListener("click", () => sendEditorCommand("editor.action.clipboardCutAction"));
      document.getElementById("edit-copy-item").addEventListener("click", () => sendEditorCommand("editor.action.clipboardCopyAction"));
      document.getElementById("edit-find-item").addEventListener("click", () => sendEditorCommand("actions.find"));
      document.getElementById("edit-replace-item").addEventListener("click", () => sendEditorCommand("editor.action.startFindReplaceAction"));

      // Paste doesn't go through sendEditorCommand/editor.action.clipboardPasteAction like the
      // other six — that action reads via the sandboxed viewer iframe's OWN navigator.clipboard,
      // which Chromium denies clipboard-READ to for an opaque-origin iframe (Cut/Copy's writeText
      // calls aren't subject to the same restriction — confirmed already working from an iframe by
      // the file explorer's existing "Copy Path"). The host document itself has no such
      // restriction, so this reads the OS clipboard here (via tauri-plugin-clipboard-manager, a
      // real Tauri command, not the browser Clipboard API) and hands the text to the active
      // viewer to insert, the same "host holds the privilege, plugin executes the edit" split
      // applyLineEdit already uses for Outline.
      document.getElementById("edit-paste-item").addEventListener("click", async () => {
        const file = activeFileEntry();
        if (!file || !file.iframe) return;
        let text;
        try {
          text = await window.__TAURI__.clipboardManager.readText();
        } catch (err) {
          showToast({ variant: "error", message: "Couldn't read the clipboard." });
          return;
        }
        if (typeof text !== "string" || !text) return;
        file.iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:insertText", payload: { text } }, "*");
      });

      // ---------- View menu ----------
      document.getElementById("view-toggle-sidebar").addEventListener("click", () => togglePanel("sidebar"));
      document.getElementById("view-toggle-console").addEventListener("click", () => togglePanel("console"));
      document.getElementById("view-toggle-right").addEventListener("click", () => togglePanel("right"));

      document.getElementById("view-appearance-item").addEventListener("click", () => {
        showPopup("settings", { url: "settings.html?tab=appearance" });
      });

      document.getElementById("view-reload-item").addEventListener("click", () => {
        window.location.reload();
      });

      document.getElementById("view-fullscreen-item").addEventListener("click", async () => {
        const appWindow = window.__TAURI__.window.getCurrentWindow();
        const isFullscreen = await appWindow.isFullscreen();
        await appWindow.setFullscreen(!isFullscreen);
      });

      // Focusing the input is enough to open it — see initSearchbar's own focus listener
      // (primitives.js), which renders the browsable categories the instant it's non-empty.
      function openCommandPalette() {
        commandCenterInput.focus();
      }

      document.getElementById("view-command-palette-item").addEventListener("click", openCommandPalette);

      // ---------- Run menu ----------
      document.getElementById("run-menu-run").addEventListener("click", startRun);
      document.getElementById("run-menu-pause").addEventListener("click", togglePause);
      document.getElementById("run-menu-stop").addEventListener("click", stopRun);
      document.getElementById("run-menu-restart").addEventListener("click", restartRun);
      document.getElementById("run-menu-set-entry").addEventListener("click", pickAndSetEntry);

      document.getElementById("dev-run-settings-item").addEventListener("click", () => {
        showPopup("settings", { url: "settings.html" });
      });

      // ---------- Help menu ----------
      document.getElementById("help-docs-item").addEventListener("click", () => {
        openUrl("https://lowarc.com");
      });

      document.getElementById("help-shortcuts-item").addEventListener("click", () => {
        showPopup("shortcuts");
      });

      document.getElementById("help-report-issue-item").addEventListener("click", () => {
        openUrl("https://github.com/NolanLT/lowarc-studio/issues");
      });

      async function getAppVersionLabel() {
        try {
          return `Version ${await window.__TAURI__.app.getVersion()}`;
        } catch (err) {
          return "";
        }
      }

      document.getElementById("help-about-item").addEventListener("click", async () => {
        showPopup("about", { version: await getAppVersionLabel() });
      });

      // The logo has no click behavior of its own — this is purely what initTooltips() (below)
      // reads on hover. Starts as just the name (data-tooltip is already set in the markup) and
      // grows a version line once getAppVersionLabel() actually resolves; tooltip content is read
      // live at hover time, not cached at init, so updating the attribute after initTooltips() has
      // already run is enough — no re-init needed.
      getAppVersionLabel().then((version) => {
        const logo = document.getElementById("app-logo-icon");
        if (version) logo.dataset.tooltip = `LowArc Studio — ${version}`;
      });

      // ---------- Global keyboard shortcuts ----------
      // Deliberately small — Ctrl+S/Ctrl+Shift+S/Ctrl+Shift+P mirror the three menu items that had
      // no prior way to invoke them at all (Monaco's own Ctrl+S already exists inside its iframe,
      // but a host-level one is what makes the File > Save menu item actually feel wired rather
      // than mouse-only, and is also what fires while some OTHER panel has focus). NOT extended to
      // Undo/Redo/Cut/Copy/Paste/Find/Replace — Monaco already binds all of those natively inside
      // its own iframe, so a second host-level binding for them would be pure redundancy, not a
      // gap. Like the existing Escape handler above, this only ever fires while the HOST document
      // itself has focus — a sandboxed plugin iframe's keydown (an editor tab included) never
      // reaches here, so these do nothing while you're actually typing in one. See the "shortcuts"
      // popup's own comment for the fuller version of this caveat.
      document.addEventListener("keydown", (e) => {
        const mod = e.ctrlKey || e.metaKey;
        if (!mod || e.altKey) return;
        const key = e.key.toLowerCase();
        if (key === "s") {
          e.preventDefault();
          document.getElementById(e.shiftKey ? "file-save-as-item" : "file-save-item").click();
        } else if (key === "p" && e.shiftKey) {
          e.preventDefault();
          openCommandPalette();
        }
      });

      initTooltips();
      initWindowControls();
      initTabs();

      // Drag-to-reorder — see initReorderable() in primitives.js. Only these four strips opt in
      // (data-reorderable, set on each one's own markup); everything else (the top menu bar, a
      // standalone page's view tabs) is untouched. Safe to call before any of their items exist —
      // the listeners are delegated on the container itself, not attached per-item.
      initReorderable(document.getElementById("rail-tabs"), { axis: "y", onReorder: (order) => saveTabOrder("rail-tabs", order) });
      // Each group names the OTHER as its crossContainer, so a file tab can be dragged freely
      // between them — see initReorderable's crossContainer/onMoveAcross in primitives.js.
      // moveFileToGroup isn't defined yet at this point in the script, but neither closure below
      // calls it until an actual cross-drag completes, by which point it is (function declarations
      // are hoisted, and this only ever fires from later user interaction, never synchronously here).
      initReorderable(document.getElementById("tab-bar-tabs-0"), {
        axis: "x",
        crossContainer: document.getElementById("tab-bar-tabs-1"),
        crossZone: document.getElementById("editor-group-1"),
        onReorder: (order) => saveTabOrder("tab-bar-tabs-0", order),
        onMoveAcross: (path) => moveFileToGroup(path, 1),
      });
      initReorderable(document.getElementById("tab-bar-tabs-1"), {
        axis: "x",
        crossContainer: document.getElementById("tab-bar-tabs-0"),
        crossZone: document.getElementById("editor-group-0"),
        onReorder: (order) => saveTabOrder("tab-bar-tabs-1", order),
        onMoveAcross: (path) => moveFileToGroup(path, 0),
      });
      initReorderable(document.getElementById("console-tabs"), { axis: "x", onReorder: (order) => saveTabOrder("console-tabs", order) });

      // ---------- Transport controls (Run/Pause/Stop) ----------
      // Real now: Run calls start_dev_run, Stop calls stop_dev_run, Pause toggles pause_dev_run/
      // resume_dev_run, and dev-run-log/dev-run-ended/dev-run-frame (see lib.rs) feed the console's
      // Run tab and any plugin listening for lowarc:devRunFrame/lowarc:devRunEnded (the Debugger
      // plugin, so far — see broadcastToPlugins below). isRunning is authoritative from
      // dev-run-ended, not just set optimistically on click — a run can end on its own, not only
      // via Stop. isPaused IS set optimistically on a successful pause/resume call, since unlike
      // starting a run there's no meaningfully different "it didn't actually happen" outcome to
      // wait for — the call either fails outright (already caught) or the flag flips.
      let isRunning = false;
      let isPaused = false;

      function updateTransportButtons() {
        const runBtn = document.getElementById("run-btn");
        const pauseBtn = document.getElementById("pause-btn");
        const stopBtn = document.getElementById("stop-btn");

        runBtn.classList.toggle("btn-main", !isRunning);
        runBtn.classList.toggle("btn-ghost", isRunning);
        runBtn.disabled = isRunning;

        pauseBtn.classList.toggle("btn-warning", isRunning);
        pauseBtn.classList.toggle("btn-ghost", !isRunning);
        pauseBtn.disabled = !isRunning;

        stopBtn.classList.toggle("btn-danger", isRunning);
        stopBtn.classList.toggle("btn-ghost", !isRunning);
        stopBtn.disabled = !isRunning;

        // The Run menu's own items mirror the toolbar's disabled state exactly — "Run" is only
        // meaningful when nothing's running, "Pause"/"Stop"/"Restart" only once something is.
        document.getElementById("run-menu-run").disabled = isRunning;
        document.getElementById("run-menu-pause").disabled = !isRunning;
        document.getElementById("run-menu-stop").disabled = !isRunning;
