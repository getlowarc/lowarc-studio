      // Fetched as raw text over IPC (read_plugin_asset) rather than used as an <img src="..."> —
      // inlining it as a real <svg> lets it inherit currentColor for free, the same as the
      // fallback icon already does, which a rasterized <img> never could.
      async function loadRailIconSvg(pluginId, railIcon) {
        try {
          const text = await invoke("read_plugin_asset", { pluginId, relPath: railIcon });
          const doc = new DOMParser().parseFromString(text, "image/svg+xml");
          if (doc.querySelector("parsererror")) return null;
          const svg = doc.querySelector("svg");
          if (!svg) return null;
          sanitizeSvg(svg);
          return svg;
        } catch (err) {
          return null;
        }
      }

      // "__run" is the one console tab the app itself owns (dev-run + plugin log output) — every
      // other key is a plugin-contributed tab, both registered via contribute("console", ...) and
      // shown through the same showSlotTab() every other tab-strip region uses. activeConsoleTabKey
      // is still tracked separately (rather than always re-querying the DOM for it) since
      // requestNewTerminal() below needs it on every click, not just on activation.
      let activeConsoleTabKey = "__run";

      // Generalizes what activateConsoleTab(btn, key) used to be — takes just the key now (not a
      // button reference) so it can be called both from a real click (via renderTabStrip's
      // onActivate, below) and programmatically (startRun(), which has no click event to hand it).
      // Manually re-toggling is-active here is redundant on the click path (primitives.js's
      // initTabs() already did it, since #console-tabs is a [data-tabs] container) but necessary on
      // the programmatic one — cheap enough either way not to bother with two separate functions.
      function activateConsoleTab(key) {
        document.querySelectorAll("#console-tabs .console-tab").forEach((t) => t.classList.remove("is-active"));
        const btn = document.querySelector(`#console-tabs .console-tab[data-tab-value="${key}"]`);
        if (btn) btn.classList.add("is-active");

        activeConsoleTabKey = key;
        showSlotTab("console", "console-body", key);

        // The new-terminal controls only make sense while a session-mode tab (Terminal) is
        // active — "__run" has no pluginPanels entry at all, so it falls through to hidden too.
        const entry = key !== "__run" ? pluginPanels.get(key) : null;
        document.getElementById("console-session-controls").style.display = entry && entry.session ? "flex" : "none";
      }

      // ---------- Terminal's "new instance" controls (host chrome, not the plugin's own UI —
      // see the console header comment) ----------
      // Both just ask whichever session-mode tab is currently active to open another instance —
      // the plugin itself (Terminal) owns creating the session and adding it to its own sidebar,
      // this is only ever "tell the active session-mode iframe a new-instance request happened".
      function requestNewTerminal(shell) {
        const entry = pluginPanels.get(activeConsoleTabKey);
        if (entry && entry.iframe) {
          entry.iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:newTerminal", payload: { shell } }, "*");
        }
      }

      document.getElementById("console-new-session").addEventListener("click", () => requestNewTerminal(null));

      const CONSOLE_SESSION_SHELL_OPTIONS = [
        { value: "__default", label: "Default" },
        { value: "powershell", label: "PowerShell" },
        { value: "pwsh", label: "PowerShell 7 (pwsh)" },
        { value: "cmd", label: "Command Prompt" },
        { value: "bash", label: "Bash" },
        { value: "zsh", label: "Zsh" },
      ];
      document.getElementById("console-session-menu-trigger").addEventListener("click", (e) => {
        e.stopPropagation();
        openMenuFromTrigger(e.currentTarget, CONSOLE_SESSION_SHELL_OPTIONS).then((value) => {
          if (value) requestNewTerminal(value === "__default" ? null : value);
        });
      });

      // ---------- Maximize console (permanent, like Close — not scoped to any one tab) ----------
      let consoleMaximized = false;
      function setConsoleMaximized(maximized) {
        consoleMaximized = maximized;
        document.getElementById("console-expand").classList.toggle("is-active", maximized);
        if (maximized) {
          // Not calc(100vh - Npx) — CSS Grid doesn't shrink the *other* explicit/auto rows to
          // make room for one row that would overflow the container, it just lets the grid
          // overflow instead (confirmed live: the CSS var applied correctly but nothing visually
          // grew). Computing the real leftover pixels here, from the shell's own actual height
          // minus what the menu bar/status bar/divider genuinely take up, is what actually
          // collapses the center row to ~0 instead of merely overflowing past it.
          const shellHeight = shell.getBoundingClientRect().height;
          const menuHeight = document.querySelector(".menu-bar").getBoundingClientRect().height;
          const statusHeight = document.querySelector(".status-bar").getBoundingClientRect().height;
          const dividerHeight = 4; // the fixed 4px row between the center view and the console
          const available = shellHeight - menuHeight - statusHeight - dividerHeight;
          shell.style.setProperty("--console-height", `${Math.max(PANELS.console.min, available)}px`);
        } else {
          applyPanel("console"); // restores the normal, persisted (draggable) size
        }
      }
      document.getElementById("console-expand").addEventListener("click", () => setConsoleMaximized(!consoleMaximized));

      function appendConsoleLine(level, message) {
        const panel = document.getElementById("console-run-panel");
        const line = document.createElement("div");
        line.className = "line";
        line.textContent = message;
        if (level === "error") line.style.color = "var(--danger)";
        else if (level === "warn" || level === "warning") line.style.color = "var(--yellow)";
        panel.appendChild(line);
        panel.scrollTop = panel.scrollHeight;
      }

      // order:-10 so Run always sorts first, matching its old fixed "always first" position in the
      // static HTML. closeable:false — nothing currently renders a per-tab close control for ANY
      // console tab (Terminal manages closing its own sessions through its own UI, not a host-drawn
      // X), so this is forward-looking metadata, not something consumed yet. mount(el) just
      // re-parents the one #console-run-panel element that already exists and that
      // appendConsoleLine() already writes into regardless of migration — its own "is-active" class
      // (already set in its static HTML) is left untouched and permanent, exactly like a plugin
      // sidebar iframe's is-active is (see showSlotTab's wrapper comment); the WRAPPER's is-active
      // is what actually governs visibility once mounted.
      contribute("console", {
        id: "__run",
        sourceType: "host",
        label: "Run",
        order: -10,
        closeable: false,
        mount(el) {
          el.appendChild(document.getElementById("console-run-panel"));
        },
      });

      // ---------- Base system: shared region renderers ----------
      // Built on primitives.js's contribute()/getSlot() registry.

      // For a region with no tab strip at all — just one contribution shown, full-size (Inspector,
      // today). Same "first wins, a second is logged and otherwise ignored" rule the viewport used
      // to follow too, before it became the tab-bar/open-files system below (arbitrated per file by
      // extension, not one plugin claiming the whole slot forever — Inspector still claims it
      // forever, since nothing there is keyed by anything a user picks). A contribution's mount()
      // runs once, the first time this slot is actually rendered — calling renderSingleSlot again
      // (e.g. loadPluginContributions() re-running) is a no-op for whichever contribution already
      // won it.
      const singleSlotMounted = new Map(); // slot id -> the contribution id already mounted into it

      function renderSingleSlot(container, slot) {
        const contributions = getSlot(slot);
        if (!contributions.length) return;
        const [contribution, ...rest] = contributions;
        if (rest.length) {
          console.warn(`[base] "${slot}" is single-slot — "${contribution.id}" claimed it; ignoring ${rest.map((c) => `"${c.id}"`).join(", ")}.`);
        }
        if (singleSlotMounted.get(slot) === contribution.id) return;
        singleSlotMounted.set(slot, contribution.id);
        container.classList.add("hosts-plugin");
        try {
          contribution.mount(container);
        } catch (err) {
          const errorEl = document.createElement("div");
          errorEl.style.color = "var(--danger)";
          errorEl.style.padding = "12px";
          errorEl.textContent = `This panel failed to load: ${err}`;
          container.appendChild(errorEl);
          showToast({ variant: "error", message: `"${slot}" panel failed to render: ${err}`, source: contribution.pluginId || null });
        }
      }

      // For a region with a tab strip — (re)builds a button per contribution in `slot`, into
      // `container` (already wired as a [data-tabs] strip by primitives.js's initTabs(), and —
      // separately — by whichever initReorderable(...) call already covers this container, see the
      // "Drag-to-reorder" block above; this only builds the buttons and their activate/close
      // behavior on top of both, it doesn't reimplement either). Safe to call repeatedly — every
      // call clears and rebuilds just the tab elements (and the empty-state placeholder, if any) it
      // itself owns, the same "rebuild from scratch on every relevant change" shape renderTabBar()
      // already used before this existed; listener wiring (tab-change/click) only happens once per
      // container, guarded below, so repeated calls don't stack duplicate listeners.
      //
      // opts: { itemClass, anchorEl (a trailing non-item child tabs must stay before — the
      // console's own "+"/spacer controls; omit if there's none), iconBased (default true — rail
      // tabs are icon-only with a tooltip for the label, matching addSidebarRailIcon's old
      // convention; pass false for a text-label strip like the console's/a file tab's), emptyText
      // (shown in the strip itself when the slot has no contributions — omit for a strip that's
      // fine looking merely empty, like the rail), onActivate(contribution) (a tab just became the
      // active one), onToggleClose(contribution, btn) (optional — clicking the ALREADY-active tab
      // calls this INSTEAD of onActivate; return false to leave it active and let the click fall
      // through as normal), onClose(contribution) (optional — only takes effect on a contribution
      // whose own closeable is exactly true, e.g. a file tab; renders a close button and routes it
      // here instead of onActivate/onToggleClose), decorate(contribution, tabEl) (optional — called
      // for every tab element right after it's built, so a caller can apply status classes it reads
      // from ITS OWN live state rather than the contribution, which is meant to stay a fairly static
      // declaration — see renderTabBar()'s dirty/missing classes for the motivating case). An
      // icon-based contribution's icon is either static (iconHtml, shown immediately) or resolved
      // async (resolveIcon(), a plugin's own railIcon fetched over IPC — shown once it resolves,
      // FALLBACK_RAIL_ICON_SVG until then), matching how addSidebarRailIcon used to load one.
      function renderTabStrip(container, slot, opts) {
        const { itemClass = "sidebar-tab", anchorEl = null, iconBased = true, emptyText = null, onActivate, onToggleClose, onClose, decorate } = opts;

        container.querySelectorAll("[data-tab-value], .tab-bar-empty").forEach((el) => el.remove());

        const contributions = getSlot(slot);

        if (!contributions.length && emptyText) {
          const empty = document.createElement("div");
          empty.className = "tab-bar-empty";
          empty.textContent = emptyText;
          container.insertBefore(empty, anchorEl);
        }

        for (const contribution of contributions) {
          const closeable = contribution.closeable === true;
          // A closeable tab hosts a real nested <button> (the close control) — buttons can't nest,
          // so it's a div standing in for one (role/tabindex/keydown-triggers-click), the same shape
          // file-tabs already used before this existed. A non-closeable tab stays a real <button>.
          const tab = document.createElement(closeable ? "div" : "button");
          tab.className = itemClass;
          tab.dataset.tabValue = contribution.id;

          if (closeable) {
            tab.setAttribute("role", "button");
            tab.tabIndex = 0;
            tab.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                tab.click();
              }
            });
          } else {
            tab.type = "button";
          }

          if (iconBased) {
            tab.dataset.tooltip = contribution.label;
            tab.setAttribute("aria-label", contribution.label);
            tab.innerHTML = contribution.iconHtml || FALLBACK_RAIL_ICON_SVG;
            if (contribution.resolveIcon) {
              contribution.resolveIcon().then((svg) => {
                if (!svg) return;
                svg.setAttribute("width", "16");
                svg.setAttribute("height", "16");
                tab.innerHTML = "";
                tab.appendChild(svg);
              });
            }
          } else if (closeable) {
            const label = document.createElement("span");
            label.textContent = contribution.label;
            tab.appendChild(label);
          } else {
            tab.textContent = contribution.label;
          }

          if (closeable) {
            const close = document.createElement("button");
            close.type = "button";
            close.className = "btn btn-icon-only btn-xs btn-ghost-danger file-tab-close";
            close.setAttribute("aria-label", `Close ${contribution.label}`);
            close.innerHTML =
              '<svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>';
            close.addEventListener("click", (e) => {
              // Without this, the click bubbles up to the tab bar and the primitive's own
              // delegation would treat it as "activate this tab" too, right as it's closing.
              e.stopPropagation();
              if (onClose) onClose(contribution);
            });
            tab.appendChild(close);
          }

          if (decorate) decorate(contribution, tab);
          container.insertBefore(tab, anchorEl);
        }

        applySavedOrder(container, "[data-tab-value]", "tabValue", anchorEl);
        initTooltips();

        if (container.dataset.tabStripWired) return;
        container.dataset.tabStripWired = "true";

        if (onActivate) {
          container.addEventListener("tab-change", (e) => {
            const contribution = getSlot(slot).find((c) => c.id === e.detail.value);
            if (contribution) onActivate(contribution);
          });
        }

        // Toggle-close-on-reclick — generic here instead of hand-wired per region. This is the
        // actual payoff of unifying: the behavior used to only exist for plugin-added rail icons
        // (wired inside addSidebarRailIcon() itself) until the two host-added manager icons — added
        // a different way — needed a second, separate fix. Capture phase: observes pre-click state
        // before [data-tabs]' own bubble-phase handler (primitives.js's initTabs()) mutates
        // is-active, and — only once onToggleClose actually handles it — stops that handler from
        // also firing and immediately reopening what this just closed.
        if (onToggleClose) {
          container.addEventListener(
            "click",
            (e) => {
              const btn = e.target.closest("[data-tab-value]");
              if (!btn || !btn.classList.contains("is-active")) return;
              const contribution = getSlot(slot).find((c) => c.id === btn.dataset.tabValue);
              if (!contribution) return;
              if (onToggleClose(contribution, btn) !== false) e.stopPropagation();
            },
            true,
          );
        }
      }

      // extension (lowercase, dot-included) -> { pluginId, viewer }. Same "first wins, no silent
      // override" rule as renderSingleSlot, for the same reason — two viewers silently fighting
      // over one file type would be worse than an honest, logged "already taken".
      const viewersByExtension = new Map();

      function registerViewer(pluginId, viewer) {
        for (const ext of viewer.extensions || []) {
          const key = ext.toLowerCase();
          if (viewersByExtension.has(key)) {
            console.warn(`[plugins] "${key}" is already viewed by "${viewersByExtension.get(key).pluginId}" — ignoring the same contribution from "${pluginId}".`);
            continue;
          }
          viewersByExtension.set(key, { pluginId, viewer });
        }
      }

      async function loadPluginContributions() {
        let plugins = [];
        try {
          plugins = await invoke("list_installed_plugins");
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }

        for (const plugin of plugins) {
          if (plugin.disabled || !plugin.contributes) continue;

          for (const panel of plugin.contributes.panels || []) {
            const key = panelKey(plugin.id, panel.id);
            pluginPanels.set(key, { pluginId: plugin.id, panel, iframe: null, session: plugin.session });
            if (panel.location === "sidebar") {
              contribute("sidebar", {
                id: key,
                sourceType: "plugin",
                pluginId: plugin.id,
                label: panel.title,
                resolveIcon: panel.railIcon ? () => loadRailIconSvg(plugin.id, panel.railIcon) : undefined,
                mount(container) {
                  mountPanelIframe(key, container).classList.add("is-active");
                },
              });
            } else if (panel.location === "inspector") {
              contribute("inspector", {
                id: key,
                sourceType: "plugin",
                pluginId: plugin.id,
                mount(container) {
                  mountPanelIframe(key, container).classList.add("is-active");
                },
              });
            }
          }

          for (const tab of plugin.contributes.consoleTabs || []) {
            const key = panelKey(plugin.id, tab.id);
            pluginPanels.set(key, { pluginId: plugin.id, panel: tab, iframe: null, session: plugin.session });
            contribute("console", {
              id: key,
              sourceType: "plugin",
              pluginId: plugin.id,
              label: tab.title,
              mount(el) {
                mountPanelIframe(key, el).classList.add("is-active");
              },
            });
          }

          for (const viewer of plugin.contributes.viewers || []) {
            registerViewer(plugin.id, viewer);
          }
        }

        // Mounted eagerly here (matching the old claimSingleSlot's timing) rather than lazily on
        // first open — Inspector's own open/close is a pure CSS-width toggle (see PANELS.right),
        // independent of whether anything is mounted inside it, so waiting for "first shown" would
        // actually be waiting for an event that doesn't exist yet.
        renderSingleSlot(document.getElementById("right-panel-body"), "inspector");

        // Built once, here, from everything contribute("sidebar", ...) registered above (both
        // managers, registered earlier at top-level script scope, plus whatever this loop just
        // added) — applySavedOrder's drag-order pass happens inside renderTabStrip itself, so it
        // only needs applying once, now that every icon that could be in it actually exists.
        renderTabStrip(document.getElementById("rail-tabs"), "sidebar", {
          itemClass: "sidebar-tab",
          onActivate: (contribution) => {
            showSlotTab("sidebar", "left-panel-body", contribution.id);
            setPanelOpen("sidebar", true);
          },
          onToggleClose: (contribution, btn) => {
            if (!PANELS.sidebar.open) return false;
            btn.classList.remove("is-active");
            setPanelOpen("sidebar", false);
          },
        });

        // Same "built once, from the registry" shape as the rail above, just text-labeled
        // (iconBased: false) and anchored before .console-tabs-spacer instead of nothing, since
        // this container also holds the maximize/close/new-terminal controls after its tabs.
        renderTabStrip(document.getElementById("console-tabs"), "console", {
          itemClass: "console-tab",
          iconBased: false,
          anchorEl: document.querySelector(".console-tabs-spacer"),
          onActivate: (contribution) => activateConsoleTab(contribution.id),
        });

        // [data-tabs] only marks .is-active in response to a real click (see initTabs() in
        // primitives.js) — it doesn't know about restoredSidebarActiveKey, the tab that was active
        // when this layout was last saved (see savePanelLayout/loadPanelLayout). Re-activate that
        // same rail icon now that the icons actually exist, so a session that closed with a rail
        // tab selected reopens showing that same panel instead of an empty one.
        const restoredBtn = restoredSidebarActiveKey && document.querySelector(`#rail-tabs .sidebar-tab[data-tab-value="${restoredSidebarActiveKey}"]`);
        if (restoredBtn) {
          restoredBtn.classList.add("is-active");
          showSlotTab("sidebar", "left-panel-body", restoredSidebarActiveKey);
        }

        // Whether or not that restore succeeded (the saved key might belong to a plugin that's no
        // longer installed), PANELS.sidebar.open can still be stale — it's restored from settings
        // independently of whether any rail tab ended up active. A panel claiming "open" with no
        // active tab behind it is a blank strip that looks broken, the same failure shape as the
        // console-maximize/xterm bugs already fixed this session. Force it shut if that's the state.
        if (PANELS.sidebar.open && !document.querySelector("#rail-tabs .sidebar-tab.is-active")) {
          setPanelOpen("sidebar", false);
        }
      }

      // ---------- Tab bar / open files (one or two editor groups — see toggleSplit below) ----------
      // openFiles: absolute path -> { title, dirty, missing, hasErrors, pluginId, iframe, groupId }.
      // One iframe per open file (not one shared iframe told "now show a different file") so
      // switching tabs preserves each file's own scroll position/undo history in the background,
      // the same reason VS Code keeps backgrounded editors alive rather than tearing them down.
      // Unlike VS Code, a file isn't shared across groups here — there's no shared document model
      // between two separate sandboxed iframes to split — so a path can only be open in ONE group
      // at a time; opening an already-open file just activates it wherever it already is.
      const openFiles = new Map();
      const windowToFilePath = new Map();
      const groupActiveFilePath = { 0: null, 1: null };
      let activeGroupId = 0;

      function groupEls(id) {
        return {
          tabBar: document.getElementById(`tab-bar-tabs-${id}`),
          viewport: document.getElementById(`center-viewport-${id}`),
          empty: document.getElementById(`center-viewport-empty-${id}`),
        };
      }

      // Tracks which group new files open into and which group's tab bar gets the "active" shade
      // (see .editor-group.is-active-group in the CSS above) — updated on any real interaction
      // with a group: clicking one of its tabs (via the per-group tab-change listener below),
      // clicking anywhere else in its chrome (this listener), or a viewer iframe inside it
      // receiving focus (see the iframe "focus" listener in openFile()).
      function setActiveGroup(id) {
        activeGroupId = id;
        document.getElementById("editor-group-0").classList.toggle("is-active-group", id === 0);
        document.getElementById("editor-group-1").classList.toggle("is-active-group", id === 1);
      }
      for (const id of [0, 1]) {
        document.getElementById(`editor-group-${id}`).addEventListener("mousedown", () => setActiveGroup(id));
      }

      // Pushed to every currently-mounted plugin iframe (sidebar/inspector panels *and* open-file
      // viewers, in either group) whenever anything about openFiles changes — the file explorer is
      // the reason this exists (so it can decorate its own tree rows with the same dirty/error
      // status the tab bar shows), but it's not addressed to any one plugin, since anything
      // sidebar-hosted might reasonably want it later. Sent as a full snapshot rather than a
      // delta: simpler, and cheap at the scale of "files a person has open in one project."
      function broadcastFileStatus() {
        const status = {};
        for (const [path, file] of openFiles) {
          status[path] = { dirty: file.dirty, missing: file.missing, hasErrors: file.hasErrors };
        }
        const payload = { type: "emit", event: "lowarc:fileStatus", payload: status };
        for (const entry of pluginPanels.values()) {
          if (entry.iframe) entry.iframe.contentWindow.postMessage(payload, "*");
        }
        for (const file of openFiles.values()) {
          file.iframe.contentWindow.postMessage(payload, "*");
        }
      }

      function fileTitle(path) {
        return path.split(/[\\/]/).pop() || path;
      }

      function fileExtension(path) {
        const name = fileTitle(path);
        const dot = name.lastIndexOf(".");
        return dot === -1 ? "" : name.slice(dot).toLowerCase();
      }

      // #tab-bar-tabs-0/#tab-bar-tabs-1 are each their own "center-0"/"center-1" slot (see
      // contribute()/getSlot() in primitives.js) — a file's contribution is registered in
      // openFile() and removed in closeFile()/setSplitOpen(), both alongside (not instead of) the
      // matching openFiles.set()/delete(), since openFiles stays the authoritative store for the
      // MUTABLE per-file state (dirty/missing/hasErrors) a contribution deliberately doesn't carry
      // — decorate() below reads that live, straight from openFiles, on every render. groupId
      // selects which group's tab bar (and slot) to render; renderTabStrip is what actually builds
      // the tab elements, close buttons included (contribution.closeable:true is what triggers
      // those — see openFile()'s contribute() call).
      function renderTabBar(groupId) {
        const container = groupEls(groupId).tabBar;
        renderTabStrip(container, `center-${groupId}`, {
          itemClass: "file-tab",
          iconBased: false,
          emptyText: "No files open",
          decorate: (contribution, tab) => {
            const file = openFiles.get(contribution.id);
            if (!file) return;
            tab.title = contribution.id;
            tab.classList.toggle("is-active", contribution.id === groupActiveFilePath[groupId]);
            tab.classList.add(file.missing ? "status-missing" : file.dirty ? "status-dirty" : "status-clean");
          },
          onActivate: (contribution) => {
            groupActiveFilePath[groupId] = contribution.id;
            setActiveGroup(groupId);
            showActiveFile(groupId);
          },
          onClose: (contribution) => closeFile(contribution.id),
        });
      }

      function showActiveFile(groupId) {
        const { viewport, empty } = groupEls(groupId);
        viewport.querySelectorAll(".plugin-panel-frame").forEach((f) => f.classList.remove("is-active"));

        const path = groupActiveFilePath[groupId];
        const file = path ? openFiles.get(path) : null;
        empty.style.display = file ? "none" : "flex";
        if (file && file.iframe) file.iframe.classList.add("is-active");
      }

      // Only for switching TO an already-rendered tab (a re-open, or right after openFile() has
      // just rendered a new one) — clicks the real DOM element so it goes through the exact same
      // primitive-delegated path a user's own click would, rather than a second way to activate.
      function activateFile(path) {
        const file = openFiles.get(path);
        if (!file) return;
        const tab = document.querySelector(`#tab-bar-tabs-${file.groupId} [data-tab-value="${CSS.escape(path)}"]`);
        if (tab) tab.click();
      }

      // Closing isn't a primitive-mediated user click on a tab — it's host logic deciding what
      // the next active tab should be, so this sets groupActiveFilePath directly rather than
      // simulating a click on whatever's chosen. Async because a dirty file gates on the popup
      // below — every caller (the close button, requestClose) already treats this as fire-and-
      // forget, so nothing needed to change at the call sites for that.
      async function closeFile(path) {
        const file = openFiles.get(path);
        if (!file) return;

        if (file.dirty) {
          const confirmed = await showPopup("confirm-close-dirty", { title: file.title });
          if (!confirmed) return;
          // The confirm popup is itself async — the file could have been closed some other way
          // (e.g. its own plugin calling requestClose after a successful save) while it was open.
          if (!openFiles.has(path)) return;
        }

        const groupId = file.groupId;

        if (file.iframe) {
          windowToFilePath.delete(file.iframe.contentWindow);
          windowToPlugin.delete(file.iframe.contentWindow);
          file.iframe.remove();
        }
        openFiles.delete(path);
        removeContribution(`center-${groupId}`, path);

        if (groupActiveFilePath[groupId] === path) {
          const remaining = Array.from(openFiles.entries()).filter(([, f]) => f.groupId === groupId).map(([p]) => p);
          groupActiveFilePath[groupId] = remaining.length ? remaining[remaining.length - 1] : null;
        }

        renderTabBar(groupId);
        showActiveFile(groupId);
        broadcastFileStatus();
      }

      // Moves an ALREADY-open file into a different group — re-parents the same iframe node (not
      // a close+reopen, so scroll position/undo history survive, same reasoning as setSplitOpen's
      // own group-0 merge) and moves its slot registration to match. Unlike setSplitOpen's bulk
      // merge (which deliberately leaves whichever tab was already active in the destination group
      // alone), this is always a direct response to the user acting on this ONE file — dragging its
      // tab across, or "Open in Split View" — so it always becomes the active tab in its new group.
      function moveFileToGroup(path, targetGroupId) {
        const file = openFiles.get(path);
        if (!file || file.groupId === targetGroupId) return;
        const fromGroupId = file.groupId;

        removeContribution(`center-${fromGroupId}`, path);
        file.groupId = targetGroupId;
        groupEls(targetGroupId).viewport.appendChild(file.iframe);
        contribute(`center-${targetGroupId}`, { id: path, sourceType: "plugin", pluginId: file.pluginId, label: file.title, closeable: true });

        if (groupActiveFilePath[fromGroupId] === path) {
          const remaining = Array.from(openFiles.entries()).filter(([, f]) => f.groupId === fromGroupId).map(([p]) => p);
          groupActiveFilePath[fromGroupId] = remaining.length ? remaining[remaining.length - 1] : null;
        }
        groupActiveFilePath[targetGroupId] = path;

        renderTabBar(fromGroupId);
        renderTabBar(targetGroupId);
        showActiveFile(fromGroupId);
        showActiveFile(targetGroupId);
        setActiveGroup(targetGroupId);
        broadcastFileStatus();
      }

      // opts.openInSplit: true forces this file into group 1, opening the split first if it isn't
      // already — the file-explorer's "Open in Split View" context-menu item (see window.lowarc.
      // openFile()'s new second argument in plugin_assets.rs) and, later, a cross-group tab drag
      // land here too, moving an already-open file rather than re-opening it.
      async function openFile(path, opts = {}) {
        const targetGroupId = opts.openInSplit ? 1 : activeGroupId;
        if (opts.openInSplit && !splitOpen) setSplitOpen(true);

        const existing = openFiles.get(path);
        if (existing) {
          if (existing.groupId !== targetGroupId && opts.openInSplit) {
            moveFileToGroup(path, targetGroupId);
          } else {
            setActiveGroup(existing.groupId);
            activateFile(path);
          }
          return;
        }

        const ext = fileExtension(path);
        const viewer = viewersByExtension.get(ext);
        if (!viewer) {
          showToast({ variant: "error", message: `No installed plugin can open "${fileTitle(path)}"${ext ? ` (${ext})` : ""}.` });
          return;
        }

        let contents;
        try {
          contents = await invoke("read_text_file", { path });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }

        // Opens into whichever group was last interacted with, unless opts.openInSplit forced it —
        // there's no OTHER per-open group picker, matching the toolbar-level (not per-tab) split
        // button this pairs with.
        const groupId = targetGroupId;
        const iframe = document.createElement("iframe");
        iframe.className = "plugin-panel-frame";
        iframe.setAttribute("sandbox", "allow-scripts");
        iframe.src = await pluginAssetUrl(viewer.pluginId, viewer.viewer.entry, `path=${encodeURIComponent(path)}`);
        // A click inside a sandboxed iframe never bubbles to the parent document, so the
        // mousedown-based group-activation listener above can't see it — this is the
        // supplementary signal for "the user is now working in this group" once its content
        // actually takes focus (Monaco, e.g., calls focus() on the editor surface).
        iframe.addEventListener("focus", () => setActiveGroup(groupId));
        groupEls(groupId).viewport.appendChild(iframe);
        windowToFilePath.set(iframe.contentWindow, path);
        windowToPlugin.set(iframe.contentWindow, viewer.pluginId);

        // The viewer's own iframe has no filesystem access (sandboxed, connect-src 'none') — the
        // host already read the file above, so it pushes the content in once the iframe's own
        // script has had a chance to call lowarc.on("lowarc:openFile", ...) and start listening.
        iframe.addEventListener("load", () => {
          iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:openFile", payload: { path, contents } }, "*");
          broadcastFileStatus();
        });

        openFiles.set(path, { title: fileTitle(path), dirty: false, missing: false, hasErrors: false, pluginId: viewer.pluginId, iframe, groupId });
        contribute(`center-${groupId}`, { id: path, sourceType: "plugin", pluginId: viewer.pluginId, label: fileTitle(path), closeable: true });
        renderTabBar(groupId);
        activateFile(path);
      }

      document.getElementById("open-file-item").addEventListener("click", async () => {
        const picked = await openDialog({ title: "Open File", defaultPath: projectPath });
        if (picked) openFile(picked);
      });

      // ---------- Split editor ----------
      function applySplitRatio() {
        const group0 = document.getElementById("editor-group-0");
        group0.style.flex = splitOpen ? `0 0 ${splitRatio * 100}%` : "";
      }

      function setSplitOpen(open) {
        if (splitOpen === open) return;
        splitOpen = open;
        document.getElementById("center-panel").classList.toggle("is-split", open);
        document.getElementById("toggle-split").classList.toggle("is-active", open);
        applySplitRatio();

        if (!open) {
          // Closing the split is a layout change, not "discard everything in the second group" —
          // move its files back into group 0 (re-parenting the same iframe nodes, not recreating
          // them, so scroll position/undo history survive) rather than closing them.
          const toMove = Array.from(openFiles.entries()).filter(([, f]) => f.groupId === 1);
          for (const [path, file] of toMove) {
            removeContribution("center-1", path);
            file.groupId = 0;
            groupEls(0).viewport.appendChild(file.iframe);
            contribute("center-0", { id: path, sourceType: "plugin", pluginId: file.pluginId, label: file.title, closeable: true });
          }
          groupActiveFilePath[1] = null;
          renderTabBar(1);
          renderTabBar(0);
          showActiveFile(0);
          setActiveGroup(0);
        }

        savePanelLayout();
      }

      function toggleSplit() {
        setSplitOpen(!splitOpen);
      }

      document.getElementById("toggle-split").addEventListener("click", toggleSplit);
      document.getElementById("view-toggle-split").addEventListener("click", toggleSplit);

      // Same Pointer Capture reasoning as initDividerDrag below — this divider sits directly
      // beside a group that can hold a sandboxed iframe (Monaco, most often), and a plain
      // document-level mousemove would stop responding the instant the drag crosses into one.
      function initSplitDividerDrag() {
        const el = document.getElementById("editor-group-divider");
        const group0 = document.getElementById("editor-group-0");
        const centerPanel = document.getElementById("center-panel");
        const minPx = 160;

        el.addEventListener("pointerdown", (e) => {
          if (!splitOpen) return;
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          const startX = e.clientX;
          const totalWidth = centerPanel.getBoundingClientRect().width;
          const startWidth = group0.getBoundingClientRect().width;

          el.classList.add("is-dragging");
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";

          const onMove = (moveEvent) => {
            const delta = moveEvent.clientX - startX;
            const rawWidth = Math.max(minPx, Math.min(totalWidth - minPx, startWidth + delta));
            splitRatio = rawWidth / totalWidth;
            group0.style.flex = `0 0 ${splitRatio * 100}%`;
          };

          const onUp = (upEvent) => {
            el.releasePointerCapture(upEvent.pointerId);
            el.classList.remove("is-dragging");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            el.removeEventListener("pointermove", onMove);
            el.removeEventListener("pointerup", onUp);
            savePanelLayout();
          };

          el.addEventListener("pointermove", onMove);
          el.addEventListener("pointerup", onUp);
        });
      }
      initSplitDividerDrag();

      // Relays a plugin's own webview content calling lowarc.call(method, params) (see the
      // __lowarc.js harness served by plugin_assets.rs) into that exact plugin's process via
      // invoke_plugin, and the reply back. Trust comes from windowToPlugin — event.source is the
      // actual sending window, not something a message can lie about — never from anything the
      // message payload itself claims. A second branch below handles "host" messages
      // (lowarc.markDirty/requestClose) the same way, just routed to a tab instead of a process.
      //
      // The harness's own postMessage calls all target "*" (window.parent's exact origin isn't
      // something a sandboxed iframe — no allow-same-origin — can read to specify it precisely,
      // and guessing Tauri's own webview origin wrong here would silently break every plugin
      // interaction rather than fail loudly). This is the other side of that: reject anything NOT
      // actually from the plugin asset server's own origin before trusting it at all, on top of
      // (not instead of) windowToPlugin's per-message identity check below. event.origin is a
      // browser-enforced property a sending page's own JS cannot spoof, regardless of what target
      // origin it specified when it sent the message.
      const pluginOriginPromise = pluginAssetPort().then((port) => `http://127.0.0.1:${port}`);
      window.addEventListener("message", async (event) => {
        const data = event.data;
        if (!data || typeof data !== "object") return;
        if (event.origin !== (await pluginOriginPromise)) return;

        if (data.type === "host") {
          // openFile isn't "about" a file that's already open the way markDirty/requestClose
          // are, so it doesn't route through windowToFilePath — any tracked plugin iframe (a
          // sidebar panel like the file explorer, not just a viewer) can ask the host to add a
          // path to the open-files list. windowToPlugin is still the trust check: only a real,
          // currently-mounted plugin iframe can trigger it, never an arbitrary postMessage.
          if (data.action === "openFile") {
            if (windowToPlugin.get(event.source) && typeof data.path === "string" && data.path) {
              openFile(data.path, { openInSplit: Boolean(data.openInSplit) });
            }
            return;
          }

          // window.lowarc.notify() — routes into the exact same showToast() every host-chrome
          // error/confirmation already goes through (see primitives.js's toast/notification-
          // history section), tagged with which plugin it came from so the bell's history can
          // attribute it. Not routed through windowToFilePath/windowToPlugin's file-specific
          // lookups — any tracked plugin iframe can raise one, not just a file viewer.
          if (data.action === "notify") {
            const pluginId = windowToPlugin.get(event.source);
            if (pluginId && typeof data.message === "string" && data.message) {
              const variant = ["info", "warning", "success", "error"].includes(data.variant) ? data.variant : "info";
              showToast({ variant, message: data.message, source: pluginId });
            }
            return;
          }

          // Same trust/routing shape as openFile — these come from whatever plugin performed the
          // filesystem operation (the file explorer, today), not from the affected file's own
          // viewer iframe, so they're keyed by windowToPlugin and an explicit path lookup rather
          // than windowToFilePath. Only exact-path matches are handled: a folder rename/move/
          // delete doesn't currently cascade to mark every open file underneath it — a deliberate
          // scope cut, not an oversight.
          if (data.action === "notifyPathDeleted") {
            if (windowToPlugin.get(event.source) && typeof data.path === "string") {
              const file = openFiles.get(data.path);
              if (file) {
                file.missing = true;
                renderTabBar(file.groupId);
                broadcastFileStatus();
              }
            }
            return;
          }
          if (data.action === "notifyPathRenamed") {
            if (windowToPlugin.get(event.source) && typeof data.oldPath === "string") {
              const file = openFiles.get(data.oldPath);
              if (file) {
                file.missing = true;
                renderTabBar(file.groupId);
                broadcastFileStatus();
              }
            }
            return;
          }
          // All three routed by windowToPlugin, not windowToFilePath — a session-mode plugin's UI
          // (a console-tab panel, not a file viewer) manages its own instances, each identified by
          // a sessionId it minted itself; the host just needs to know which plugin's files/backend
          // that id belongs to, the same trust boundary as everything else here.
          if (data.action === "startSession") {
            const pluginId = windowToPlugin.get(event.source);
            if (pluginId && typeof data.sessionId === "string") {
              invoke("start_plugin_session", { id: pluginId, sessionId: data.sessionId, shell: data.shell ?? null }).catch((err) => {
                showToast({ variant: "error", message: String(err) });
              });
            }
            return;
          }
          if (data.action === "sendSession") {
            if (windowToPlugin.get(event.source) && typeof data.sessionId === "string") {
              invoke("send_to_plugin_session", { sessionId: data.sessionId, message: data.message ?? null });
            }
            return;
          }
          if (data.action === "stopSession") {
            if (windowToPlugin.get(event.source) && typeof data.sessionId === "string") {
              invoke("stop_plugin_session", { sessionId: data.sessionId });
            }
            return;
          }
          // window.lowarc.showMenu() — see plugin_assets.rs's harness. data.x/data.y are in the
          // calling iframe's OWN document coordinates (typically a right-click's clientX/clientY);
          // this iframe could be mounted in either editor group's viewport, a sidebar/inspector
          // panel, or a console tab, so its screen position isn't fixed — iframeForWindow() finds
          // the actual element and its current getBoundingClientRect() gives the real offset to
          // add. Trust is windowToPlugin, same as every other action here: only a real, currently-
          // mounted plugin iframe can trigger this.
          if (data.action === "showMenu") {
            if (windowToPlugin.get(event.source) && Array.isArray(data.items)) {
              const iframeEl = iframeForWindow(event.source);
              const rect = iframeEl ? iframeEl.getBoundingClientRect() : { left: 0, top: 0 };
              const anchor = { x: rect.left + (Number(data.x) || 0), y: rect.top + (Number(data.y) || 0) };
              openMenuOverlay(data.items, anchor).then((value) => {
                event.source.postMessage({ type: "reply", id: data.id, ok: true, result: value }, "*");
              });
            }
            return;
          }
          // window.lowarc.openPopup() — see plugin_assets.rs's harness. Unlike showMenu, a popup
          // is always centered on the real window rather than anchored to the calling iframe, so
          // there's no position to translate here. popupId must name a popup some contribution
          // already registered via contribute("popups", ...) — no plugin declares one yet, so this
          // is proven the same way notify() was: real, but unexercised until one has a reason to.
          // Same trust (windowToPlugin) and reply-routing (event.source, never broadcast) as every
          // other action here — the result goes back to the exact iframe that asked.
          if (data.action === "openPopup") {
            if (windowToPlugin.get(event.source) && typeof data.popupId === "string") {
              showPopup(data.popupId, data.target)
                .then((result) => event.source.postMessage({ type: "reply", id: data.id, ok: true, result }, "*"))
                .catch((err) => event.source.postMessage({ type: "reply", id: data.id, ok: false, error: String(err) }, "*"));
            }
            return;
          }
          // window.lowarc.getSettings() — see plugin_assets.rs's harness. windowToPlugin is the
          // trust boundary: a plugin only ever gets ITS OWN saved settings back, since pluginId
          // here comes from the map this iframe was mounted under, never from the message itself.
          if (data.action === "getSettings") {
            const pluginId = windowToPlugin.get(event.source);
            if (pluginId) {
              invoke("get_plugin_settings", { id: pluginId })
                .then((result) => event.source.postMessage({ type: "reply", id: data.id, ok: true, result }, "*"))
                .catch((err) => event.source.postMessage({ type: "reply", id: data.id, ok: false, error: String(err) }, "*"));
            }
            return;
          }

          const path = windowToFilePath.get(event.source);
          if (!path) return;
          if (data.action === "markDirty") {
            const file = openFiles.get(path);
            if (file) {
              file.dirty = Boolean(data.dirty);
              renderTabBar(file.groupId);
              broadcastFileStatus();
            }
          } else if (data.action === "markErrors") {
            const file = openFiles.get(path);
            if (file) {
              file.hasErrors = Boolean(data.hasErrors);
              broadcastFileStatus();
            }
          } else if (data.action === "requestClose") {
            closeFile(path);
          } else if (data.action === "saveFile") {
            // Unlike markDirty/requestClose, this one owes the caller a reply (see saveFile()'s
            // own comment in __lowarc.js) — a write can fail, and the plugin needs to know before
            // it clears its own dirty state. data.path must match the path this iframe was
            // actually opened for, same trust boundary as everything else routed through
            // windowToFilePath — a viewer only gets to save the one file it owns.
            if (data.path !== path) return;
            try {
              await invoke("write_text_file", { path, contents: String(data.contents ?? "") });
              const file = openFiles.get(path);
              if (file) {
                // A successful write also clears "missing" — saving recreates the file at this
                // exact path if it had been deleted, which is a legitimate recovery, not a no-op.
                file.dirty = false;
                file.missing = false;
                renderTabBar(file.groupId);
                broadcastFileStatus();
              }
              event.source.postMessage({ type: "reply", id: data.id, ok: true }, "*");
            } catch (err) {
              showToast({ variant: "error", message: String(err) });
              event.source.postMessage({ type: "reply", id: data.id, ok: false, error: String(err) }, "*");
            }
          }
          return;
        }

        const pluginId = windowToPlugin.get(event.source);
        if (!pluginId || data.type !== "call") return;

        let reply;
        try {
          const result = await invoke("invoke_plugin", { id: pluginId, method: data.method, params: data.params ?? null });
          reply = { type: "reply", id: data.id, ok: true, result };
        } catch (err) {
          reply = { type: "reply", id: data.id, ok: false, error: String(err) };
        }
        event.source.postMessage(reply, "*");
      });

      // Plugins are invoked per call now, not kept running (see plugin_host/protocol.rs) — a
      // backend can't push something unprompted at some arbitrary later time any more, since
      // nothing persists between calls. It CAN still ride an "emit" along on a call's own reply
      // though (invoke_plugin in lib.rs re-fires it as this event), so a plugin can tell its own
      // other panels/viewers "something changed" as a side effect of whatever it was just asked
      // to do — still call-triggered, just not truly live.
      window.__TAURI__.event.listen("plugin-emit", (event) => {
        const { pluginId, event: eventName, payload } = event.payload;
        for (const entry of pluginPanels.values()) {
          if (entry.pluginId === pluginId && entry.iframe) {
            entry.iframe.contentWindow.postMessage({ type: "emit", event: eventName, payload }, "*");
          }
        }
        for (const file of openFiles.values()) {
          if (file.pluginId === pluginId && file.iframe) {
            file.iframe.contentWindow.postMessage({ type: "emit", event: eventName, payload }, "*");
          }
        }
      });

      renderTabBar(0);
      renderTabBar(1);
      loadPluginContributions();

      // ---------- Drag-to-resize, with VS Code's two-stage close ----------
      // Dragging past the minimum doesn't close the panel right away — it sticks at the minimum
      // size (a dead zone) until the drag reaches a second, closer-to-the-edge threshold
      // (closeAt), only then does it actually collapse. Below closeAt, the panel goes visually
      // closed (0) but stays "live" — dragging back out past closeAt reopens it pinned at the
      // minimum, no need to release and start a new drag. While fully closed, the remembered size
      // is left untouched, so reopening later (via the header icon or the rail) restores the size
      // from before the drag, not 0 or whatever the mouse last happened to be at.

      // Pointer Capture, not plain mousedown/mousemove/mouseup on document — every panel this
      // resizes sits right next to a sandboxed iframe (the file explorer, Monaco, Terminal...),
      // and a plain document-level mousemove listener stops receiving events the instant the
      // cursor crosses into one, since the iframe has its own separate document/event target.
      // Confirmed live: dragging past an iframe's edge would just silently stop responding,
      // making a panel impossible to shrink whenever the mouse happened to cross one — a
      // pointerdown that setPointerCapture()s on the divider itself keeps *all* subsequent
      // pointer events routed to that element regardless of what's visually underneath the
      // cursor, iframe or not, which is exactly the guarantee this needs.
      function initDividerDrag(el, key, axis, invert, sizeEl) {
        const p = PANELS[key];

        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          const startPos = axis === "x" ? e.clientX : e.clientY;
          const startRect = sizeEl.getBoundingClientRect();
          const startSize = p.open ? (axis === "x" ? startRect.width : startRect.height) : 0;

          el.classList.add("is-dragging");
          document.body.style.cursor = axis === "x" ? "col-resize" : "row-resize";
          document.body.style.userSelect = "none";

          const onMove = (moveEvent) => {
            const pos = axis === "x" ? moveEvent.clientX : moveEvent.clientY;
            const delta = (pos - startPos) * (invert ? -1 : 1);
            const raw = Math.max(0, Math.min(p.max, startSize + delta));

            if (raw < p.closeAt) {
              p.open = false;
            } else if (raw < p.min) {
              p.open = true;
              p.size = p.min;
            } else {
              p.open = true;
              p.size = raw;
            }
            applyPanel(key);
            syncToggleUI();
          };

          const onUp = (upEvent) => {
            el.releasePointerCapture(upEvent.pointerId);
            el.classList.remove("is-dragging");
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            el.removeEventListener("pointermove", onMove);
            el.removeEventListener("pointerup", onUp);
            savePanelLayout();
          };

          el.addEventListener("pointermove", onMove);
          el.addEventListener("pointerup", onUp);
        });
      }

      initDividerDrag(document.querySelector(".divider-left"), "sidebar", "x", false, document.querySelector(".left-panel"));
      initDividerDrag(document.querySelector(".divider-right"), "right", "x", true, document.querySelector(".right-panel"));
      initDividerDrag(document.querySelector(".divider-console"), "console", "y", true, document.querySelector(".console-panel"));
    </script>
  </body>
</html>
