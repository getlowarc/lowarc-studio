<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio — Editor</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      /* ---------- Grid shell ---------- */
      /* Vocabulary: "Menu Bar" = the topmost bar (File/Edit/View/Help) — the window runs with
         decorations:false, so this row doubles as the OS caption bar too: app icon and menu on
         the left, transport controls + panel toggles on the right, then the minimize/maximize/
         close buttons, with a draggable strip in between. "Sidebar" = the Rail (icon strip) + the
         left panel together. "Tab Bar" = the center panel's own local header — file tabs only now
         that transport/toggles live in the Menu Bar. Rail/left panel/right panel run the full
         height (Menu Bar down to status bar); the console sits only under the center column. Panel
         sizes are CSS vars so JS can drive both dragging and open/close without rewriting the
         template; divider tracks are real grid cells (not overlaid elements) so they can't drift
         out of sync with what they're resizing. */
      .shell {
        height: 100%;
        display: grid;
        --sidebar-width: 240px;
        --right-width: 260px;
        --console-height: 220px;
        grid-template-columns: 36px var(--sidebar-width) 4px 1fr 4px var(--right-width);
        grid-template-rows: auto 1fr 4px var(--console-height) auto;
        grid-template-areas:
          "menu    menu    menu    menu    menu    menu"
          "rail    left    divL    center  divR    right"
          "rail    left    divL    divC    divR    right"
          "rail    left    divL    console divR    right"
          "status  status  status  status  status  status";
      }

      .shell[data-sidebar-open="false"] {
        --sidebar-width: 0px;
      }
      .shell[data-right-open="false"] {
        --right-width: 0px;
      }
      .shell[data-console-open="false"] {
        --console-height: 0px;
      }

      /* ---------- Menu Bar (also the window's caption row — see the grid-shell note above) ---- */
      .menu-bar {
        grid-area: menu;
        display: flex;
        align-items: stretch;
        height: 34px;
        padding-left: 6px;
        border-bottom: 1px solid var(--border);
        flex: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .menu-bar-left {
        display: flex;
        align-items: center;
        gap: 2px;
        flex: none;
      }

      .menu-bar-app-icon {
        height: 15px;
        width: auto;
        display: block;
        margin: 0 6px 0 2px;
      }

      .menu-item {
        all: unset;
        font-size: 13px;
        color: var(--fg-dim);
        padding: 5px 10px;
        border-radius: 4px;
        cursor: pointer;
      }

      .menu-item:hover {
        background: var(--bg-hover);
        color: var(--fg);
      }

      /* Every top-level item is a real dropdown (.menu-dropdown/.menu-dropdown-list/etc. are the
         shared primitive in primitives.css). Items the app can't actually do yet (Edit's
         clipboard/undo commands, anything needing a plugin surface that doesn't exist) render
         disabled rather than being omitted — same placeholder-over-omission approach as the rest
         of the shell. */

      .menu-bar-drag {
        flex: 1;
      }

      /* A button, not a real input — VS Code's Command Center isn't typable in place either, it
         opens a separate overlay. Flanked by two flex:1 drag regions so it centers in whatever
         room is left between the menu and the right-side controls, and empty space on either
         side of it stays draggable. No explicit height — .menu-bar's own align-items:stretch
         fills the full row height, matching every other control in this bar instead of sitting
         inset like a smaller inline widget would. */
      /* A real .searchbar (primitives.css), not a button that opens something else — sized into
         the same slot the old look-alike button sat in, just with a usable min-width instead of
         one that could shrink to icon-only (an actual text input can't collapse to nothing the
         way a button's label could). */
      .menu-bar-search {
        flex: 0 1 320px;
        min-width: 140px;
        max-width: 45%;
        height: 26px;
        align-self: center;
      }

      .menu-bar-search input {
        height: 100%;
        padding-top: 0;
        padding-bottom: 0;
        font-size: 12px;
        border-radius: 5px;
      }

      /* Below this, there isn't room for the full-size bar without crowding the menu/transport
         controls on either side. */
      @media (max-width: 700px) {
        .menu-bar-search {
          flex: 0 1 160px;
          min-width: 90px;
        }
      }

      .menu-bar-right {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
        padding-right: 6px;
      }

      .menu-bar-right .transport-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        padding-right: 6px;
        margin-right: 2px;
        border-right: 1px solid var(--border);
      }

      .menu-bar-icon {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 5px;
        color: var(--fg-dim);
        cursor: pointer;
      }

      .menu-bar-icon svg {
        width: 15px;
        height: 15px;
      }

      /* Every current .menu-bar-icon is a "change the IDE's own layout" control (split/console/
         inspector toggles) — info-blue on hover, same semantic the console header's .btn-ghost-info
         buttons use. .is-active (currently toggled open) reuses the app's one accent color for
         "this is on" everywhere else, deliberately not the hover color — see the .btn-ghost-*
         primitives in primitives.css for the fuller reasoning. */
      .menu-bar-icon:hover {
        background: var(--bg-hover);
        color: var(--info);
      }

      .menu-bar-icon.is-active {
        background: var(--cyan-dim);
        color: var(--cyan);
      }

      /* ---------- Rail ---------- */
      .rail {
        grid-area: rail;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0;
        border-right: 1px solid var(--border);
        background: var(--bg-raised);
      }

      .rail-item {
        all: unset;
        box-sizing: border-box;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        color: var(--fg-dim);
        cursor: pointer;
      }

      .rail-item svg {
        width: 18px;
        height: 18px;
      }

      /* All three current .rail-item buttons (bell/account/settings) open a floating panel of some
         kind — yellow on hover, the "opens a menu" semantic. (No .is-active rule here any more:
         that was left over from before the panel-switching rail icons moved to the shared
         .sidebar-tab primitive — see renderTabStrip's "sidebar" slot below — and nothing has
         toggled .is-active on a .rail-item since.) */
      .rail-item:hover {
        color: var(--yellow);
      }

      /* Unread-notification dot on the bell — position:relative on .rail-item above is what this
         anchors against. */
      .rail-badge {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--danger);
        border: 1.5px solid var(--bg-raised);
      }

      /* ---------- Notification bell panel ---------- */
      /* Renders inside the same shared #floating-menu-list every action menu uses (see
         showFloatingOverlay) — wider and taller than that default, since this is a scrollable
         history list, not a handful of one-line action buttons. */
      .notif-panel-list {
        width: 300px;
        max-height: 420px;
        overflow-y: auto;
        padding: 0;
      }

      .notif-panel-header {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        background: var(--bg-raised);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .notif-panel-clear {
        all: unset;
        font-size: 11px;
        font-weight: 600;
        text-transform: none;
        letter-spacing: normal;
        color: var(--fg-dim);
        cursor: pointer;
        padding: 2px 4px;
        border-radius: 3px;
      }

      .notif-panel-clear:hover {
        background: var(--bg-hover);
        color: var(--danger);
      }

      .notif-panel-empty {
        padding: 20px 12px;
        text-align: center;
        font-size: 13px;
        color: var(--fg-dim);
      }

      .notif-row {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
      }

      .notif-row:last-child {
        border-bottom: none;
      }

      .notif-row-body {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1;
      }

      .notif-row-message {
        font-size: 12px;
        line-height: 1.4;
        color: var(--fg);
        word-break: break-word;
      }

      .notif-row-meta {
        font-size: 11px;
        color: var(--fg-dim);
      }

      /* Same visual language as .notif-panel-clear's own hover (muted -> danger-tinted on hover) —
         hidden until the row is hovered so the list doesn't read as a wall of X's at rest. */
      .notif-row-dismiss {
        all: unset;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        flex: none;
        color: var(--fg-dim);
        cursor: pointer;
        border-radius: 4px;
        opacity: 0;
      }

      .notif-row-dismiss svg {
        width: 11px;
        height: 11px;
      }

      .notif-row:hover .notif-row-dismiss {
        opacity: 1;
      }

      .notif-row-dismiss:hover {
        background: var(--bg-hover);
        color: var(--danger);
      }

      /* .sidebar-tab (primitives.css) is shared with the Modules/Plugins pages' wider, labelled
         list — this narrows *only* the rail's own icon-only usage of it, rather than shrinking
         the shared primitive itself and affecting those other, unrelated places too. */
      #rail-tabs.sidebar-nav {
        gap: 2px;
      }
      #rail-tabs .sidebar-tab {
        padding: 7px;
        border-radius: 0 4px 4px 0;
        /* The shared primitive has no justify-content — fine where there's a text label to keep
           left-aligned (Modules/Plugins, the in-editor managers), but a rail icon has nothing else
           in the row to anchor to, so centering it here (icon-only usage, scoped the same way as
           the padding/radius above) is what actually centers it in the rail's own width. Padding
           is symmetric (7px both sides) and the active indicator is an inset box-shadow rather than
           a border (see .sidebar-tab in primitives.css), so nothing here shifts the button's true
           center — this centers on the rail's full width, active or not. */
        justify-content: center;
      }

      .rail-spacer {
        flex: 1;
      }

      /* Account/settings triggers open through .floating-menu (see openMenuFromTrigger in the
         script below), not a local .menu-dropdown — no positioning override needed here any more. */

      /* ---------- Left / right panels ---------- */
      /* Darker than the center panel on purpose — see the background-shade section below. */
      .side-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .left-panel {
        grid-area: left;
        border-right: 1px solid var(--border);
      }

      .right-panel {
        grid-area: right;
        border-left: 1px solid var(--border);
      }

      .side-panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .side-panel-header h2 {
        flex: 1;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-dim);
        margin: 0;
      }

      .side-panel-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 14px;
      }

      /* ---------- Dividers ---------- */
      .divider {
        background: transparent;
        position: relative;
      }
      .divider::after {
        content: "";
        position: absolute;
        inset: 0;
      }
      .divider:hover,
      .divider.is-dragging {
        background: var(--cyan-dark);
      }

      .divider-col {
        cursor: col-resize;
      }
      .divider-col::after {
        left: -2px;
        right: -2px;
      }

      .divider-left {
        grid-area: divL;
      }
      .divider-right {
        grid-area: divR;
      }

      .divider-row {
        grid-area: divC;
        cursor: row-resize;
      }
      .divider-row::after {
        top: -2px;
        bottom: -2px;
      }

      /* ---------- Center panel (Tab Bar + viewport, optionally split into two groups) ---------- */
      /* Brightest of the panels — it's the focus. One background on the wrapper so every group's
         Tab Bar and viewport read as one continuous surface instead of needing the shade set per
         group. .center-panel itself is now just a flex row hosting one or two .editor-group
         columns (each the old .center-panel content verbatim) plus the divider between them — the
         outer grid's "center" cell/area is unchanged, split lives entirely inside it. */
      .center-panel {
        grid-area: center;
        display: flex;
        flex-direction: row;
        min-width: 0;
        overflow: hidden;
        background: var(--bg-raised);
      }

      .editor-group {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Off by default — split is a deliberate opt-in (see toggle-split), not a second pane that
         exists but happens to be empty. */
      .editor-group[data-group="1"] {
        display: none;
      }
      .center-panel.is-split .editor-group[data-group="1"] {
        display: flex;
      }

      /* The subtle cue for "new files open here" — otherwise nothing on screen distinguishes which
         of the two groups is the active drop target once both exist. */
      .editor-group.is-active-group .tab-bar {
        background: var(--bg-hover);
      }

      /* Reuses .divider's own hover/hit-region styling (see the Dividers section below) via a
         second class rather than duplicating it — this one just isn't grid-area-positioned, since
         it sits inside the flex-row .center-panel, not as its own grid track. */
      .editor-group-divider {
        flex: none;
        width: 4px;
        display: none;
      }
      .center-panel.is-split .editor-group-divider {
        display: block;
      }

      .tab-bar {
        display: flex;
        align-items: stretch;
        min-height: 34px;
        padding: 0 6px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .tab-bar-tabs {
        display: flex;
        align-items: stretch;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        scrollbar-width: thin;
      }

      .tab-bar-empty {
        display: flex;
        align-items: center;
        padding: 0 8px;
        font-size: 12px;
        color: var(--fg-dim);
      }

      /* One tab per open file. A div (not a button) because it hosts a real <button> of its own
         (the close control) — buttons can't nest, and a div with role="button" is the correct
         substitute rather than reaching for a click handler on something semantically wrong.
         Status (clean/dirty/missing) is shown as the underline's color, the same "line, not a
         dot" language as the header-tab/console-tab primitives' active-state underline. Unlike
         those two, a clean tab's line only shows when it's also the active one — matching
         header-tab/console-tab's own rule that an unselected tab shows no line at all, transparent
         at rest (Nolan: "tabs, sidebar or header, shouldn't have that border line if they aren't
         selected... if it is not blue and not selected, don't show a line"). Dirty/missing are
         real status signals worth seeing on a background tab too, so those two keep showing
         unconditionally regardless of which tab is active — only "selected and otherwise
         unremarkable" needs the active check. border-box so the border itself doesn't add to the
         tab's height. */
      .file-tab {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px 0 10px;
        font-size: 12px;
        color: var(--fg-dim);
        border-right: 1px solid var(--border);
        border-bottom: 2px solid transparent;
        cursor: pointer;
        flex: none;
        user-select: none;
      }

      .file-tab.is-active.status-clean {
        border-bottom-color: var(--cyan);
      }

      .file-tab.status-dirty {
        border-bottom-color: var(--yellow);
      }

      .file-tab.status-missing {
        border-bottom-color: var(--danger);
      }

      .file-tab:hover {
        color: var(--fg);
      }

      .file-tab.is-active {
        color: var(--fg);
        background: var(--bg-hover);
      }

      .file-tab:focus-visible {
        outline: 1px solid var(--cyan);
        outline-offset: -1px;
      }

      /* Always present and laid out (never swapped for something a different size) so hovering a
         tab never shifts its width — just invisible and inert until the tab is hovered or active. */
      .file-tab-close {
        display: flex;
        opacity: 0;
        pointer-events: none;
      }

      .file-tab:hover .file-tab-close,
      .file-tab.is-active .file-tab-close {
        opacity: 1;
        pointer-events: auto;
      }

      .center-viewport-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        color: var(--fg-dim);
        font-size: 13px;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      /* Always hosts either .center-viewport-empty or one iframe per open file (see the tab-bar/
         open-files JS below) — never bare text of its own any more, so this stays a plain block
         container; whichever child is actually showing manages its own sizing/centering. */
      .center-viewport {
        flex: 1;
        min-height: 0;
        display: block;
        overflow: hidden;
      }

      /* ---------- Console ---------- */
      /* Same darker shade as the left/right panels — console, sidebar, and inspector are all
         "supporting" surfaces around the bright center focus. */
      .console-panel {
        grid-area: console;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
        min-height: 0;
        overflow: hidden;
        background: var(--bg);
      }

      .console-tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        border-bottom: 1px solid var(--border);
        flex: none;
      }

      .console-tabs-spacer {
        flex: 1;
      }

      .console-session-controls {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .console-header-divider {
        width: 1px;
        height: 18px;
        margin: 0 6px;
        background: var(--border);
        flex: none;
      }

      /* "New Terminal With…" opens through .floating-menu (see openMenuFromTrigger in the script
         below), not a local .menu-dropdown — no positioning override needed here any more. */


      /* Reinstated for plugin-contributed console tabs (see PanelContribution.location ==
         "console") — same underline pattern as .header-tab, tuned for the console's smaller row. */
      .console-tab {
        all: unset;
        box-sizing: border-box;
        position: relative;
        top: 1px;
        padding: 7px 2px;
        margin: 0 8px;
        font-size: 12px;
        color: var(--fg-dim);
        border-bottom: 2px solid transparent;
        cursor: pointer;
      }

      .console-tab:first-child {
        margin-left: 0;
      }

      .console-tab:hover {
        color: var(--fg);
      }

      .console-tab.is-active {
        color: var(--fg);
        border-bottom-color: var(--cyan);
      }

      .plugin-panel-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
      }

      .plugin-panel-frame.is-active {
        display: block;
      }

      /* Same slot/show-hide convention as .plugin-panel-frame — the per-tab wrapper showSlotTab()
         creates for every "sidebar"/"inspector"/"console" contribution, host or plugin alike (see
         primitives.js's contribute()/getSlot() and renderTabStrip/showSlotTab below). Flex column,
         not block, so a host panel's toolbar-above-a-list layout works; a plugin's plain iframe
         just becomes that column's sole child and fills it the same way. */
      .host-panel-frame {
        width: 100%;
        height: 100%;
        min-width: 0;
        display: none;
        flex-direction: column;
      }

      .host-panel-frame.is-active {
        display: flex;
      }

      /* ---------- In-editor plugin manager ---------- */
      /* Single-column accordion, not the wide two-pane .manage-list/.manage-detail layout the
         standalone Plugins page uses — the sidebar defaults to 240px, the same width .manage-list
         alone takes on that page, nowhere near enough room for a detail pane beside it too. Each
         row expands in place instead of navigating to a separate detail view. */
      .plugin-manager-toolbar {
        flex: none;
        padding: 8px;
        border-bottom: 1px solid var(--border);
      }

      .plugin-manager-list {
        flex: 1;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
      }

      .plugin-manager-empty {
        padding: 16px 12px;
        font-size: 13px;
        color: var(--fg-dim);
      }

      .plugin-manager-row {
        border-bottom: 1px solid var(--border);
      }

      .plugin-manager-row-header {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }

      .plugin-manager-row-header:hover {
        background: var(--bg-hover);
      }

      .plugin-manager-row-name {
        flex: 1;
        min-width: 0;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .plugin-manager-row-chevron {
        flex: none;
        display: flex;
        color: var(--fg-dim);
        transform: rotate(0deg);
        transition: transform 0.08s ease;
      }

      .plugin-manager-row-chevron.expanded {
        transform: rotate(90deg);
      }

      .plugin-manager-row-chevron svg {
        width: 10px;
        height: 10px;
      }

      .plugin-manager-row-body {
        padding: 0 10px 12px 26px;
        min-width: 0;
      }

      .plugin-manager-row-sub {
        font-size: 11px;
        color: var(--fg-dim);
        margin-bottom: 6px;
      }

      .plugin-manager-row-desc {
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 10px;
      }

      /* flex-wrap, not a fixed side-by-side layout — the checkbox label plus the Remove button
         don't reliably both fit on one line at the sidebar's narrower widths (confirmed live: they
         were forcing the whole panel wider than the sidebar, spawning a horizontal scrollbar).
         Wrapping the button to its own line costs nothing when there IS room (it still sits on the
         same line then) and just avoids the overflow entirely when there isn't. */
      .plugin-manager-row-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 8px;
      }

      /* Zeroes the placeholder-era padding/centering once the inspector actually hosts a plugin
         panel — a value editor shouldn't sit inset behind decorative padding. .center-viewport
         doesn't need this toggle any more; it stays padding:0 permanently now that it always
         hosts either .center-viewport-empty or an open file's iframe, same reasoning as
         .console-body below staying padding:0 permanently for the same kind of always-hosts-
         something reason. */
      .side-panel-body.hosts-plugin {
        padding: 0;
        overflow: hidden;
        display: block;
      }

      .console-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }

      /* The one console tab that isn't plugin-contributed — dev-run and plugin log output. Always
         present, since it's core functionality rather than something a plugin supplies (see the
         "__run" contribute("console", ...) call, order:-10 so it always sorts first). Its own
         is-active never toggles again once set — see showSlotTab()'s per-tab .host-panel-frame
         wrapper, which is what actually governs whether this is visible. */
      #console-run-panel {
        display: none;
        height: 100%;
        overflow: auto;
        padding: 8px 12px;

        color: var(--fg-dim);
        flex: none;
      }

      .status-bar .status-spacer {
        flex: 1;
      }
    </style>
  </head>

    <!-- A sibling of .shell, not nested inside it — see openMenuOverlay()'s comment for why that
         matters (nothing inside .shell can clip or contain this). -->
    <div class="floating-menu" id="floating-menu">

    <!-- Popup Base's stack — a sibling of .shell/.floating-menu for the same reason (nothing can
         clip it). Empty by default; showPopup() (see the script below) creates and removes each
         instance's own .popup-backdrop/.popup on demand, rather than static markup toggled by
         class like the three popups this replaced. -->
    <div class="popup-stack" id="popup-stack"></div>

    <script src="primitives.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const projectPath = params.get("project") || "(unknown project)";
      const projectName = projectPath.split(/[\\/]/).pop() || projectPath;
      document.getElementById("status-project").textContent = projectName;

      const { invoke } = window.__TAURI__.core;
      const { open: openDialog } = window.__TAURI__.dialog;
      const { openUrl } = window.__TAURI__.opener;

      // Plugin panel/viewer content is hosted on a real loopback HTTP origin, not a Tauri custom
      // URI scheme — on Windows/WebView2, a sub-frame (iframe) navigation to a custom scheme
      // silently never loads at all (confirmed directly: the Rust-side handler was never even
      // invoked). A plain http://127.0.0.1:<port> origin has none of that baggage. The port is
      // ephemeral (OS-assigned at app startup), fetched once here and cached.
      let pluginAssetPortPromise = null;
      function pluginAssetPort() {
        if (!pluginAssetPortPromise) pluginAssetPortPromise = invoke("plugin_asset_port");
        return pluginAssetPortPromise;
      }
      async function pluginAssetUrl(pluginId, relPath, fragment) {
        const port = await pluginAssetPort();
        return `http://127.0.0.1:${port}/${pluginId}/${relPath}${fragment ? `#${fragment}` : ""}`;
      }

      function openEditor(path) {
        window.location.href = `editor.html?project=${encodeURIComponent(path)}`;
      }

      // ---------- Menu bar ----------
      // Every top-bar dropdown shares the same open/close mechanics: click a trigger to open it
      // (closing any other open menu first), click outside/Escape/pick an item to close it, and
      // hovering a different trigger while one is already open switches to it (how a real menu bar
      // behaves) rather than requiring a fresh click. The rail's account/settings flyouts and the
      // console's "New Terminal With…" used to be part of this same MENU_IDS-driven list (each its
      // own local .menu-dropdown) — they've moved to the shared .floating-menu overlay instead (see
      // openMenuFromTrigger below), since all three sit near a window edge that a locally-anchored
      // dropdown could run off of.
      const MENU_IDS = ["file-menu", "edit-menu", "view-menu", "run-menu", "help-menu"];

      function closeAllMenus() {
        MENU_IDS.forEach((id) => {
          document.getElementById(id).classList.remove("is-open");
          document.getElementById(`${id}-trigger`).setAttribute("aria-expanded", "false");
        });
      }

      MENU_IDS.forEach((id) => {
        const menu = document.getElementById(id);
        const trigger = document.getElementById(`${id}-trigger`);

        trigger.addEventListener("click", (e) => {
          e.stopPropagation();
          const opening = !menu.classList.contains("is-open");
          closeAllMenus();
          if (opening) {
            menu.classList.add("is-open");
            trigger.setAttribute("aria-expanded", "true");
          }
        });

        trigger.addEventListener("mouseenter", () => {
          const anyOpen = MENU_IDS.some((mid) => document.getElementById(mid).classList.contains("is-open"));
          if (anyOpen && !menu.classList.contains("is-open")) {
            closeAllMenus();
            menu.classList.add("is-open");
            trigger.setAttribute("aria-expanded", "true");
          }
        });
      });

      document.addEventListener("click", closeAllMenus);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeAllMenus();
          closeFloatingMenu();
        }
      });

      document.querySelectorAll(".menu-dropdown-item:not(:disabled)").forEach((btn) => {
        btn.addEventListener("click", closeAllMenus);
      });

      // ---------- Floating menu (shared overlay — see .floating-menu in primitives.css) ----------
      // A menu rendered here is a sibling of every panel and every iframe (see the HTML above,
      // right after .shell closes), so nothing can clip it and it isn't bound to any one trigger's
      // local DOM position the way .menu-dropdown-list is — it's positioned and clamped to the real
      // window on every open instead. Everything that used to be a local .menu-dropdown near a
      // window edge (the rail's account/settings flyouts, the console's "New Terminal With…") now
      // opens through this; a plugin's own content can ask for one too, via window.lowarc.showMenu
      // (see the "showMenu" branch in the message listener below).
      let floatingMenuResolve = null;

      function closeFloatingMenu(result) {
        if (!floatingMenuResolve) return;
        const resolve = floatingMenuResolve;
        floatingMenuResolve = null;
        document.getElementById("floating-menu").classList.remove("is-open");
        resolve(result === undefined ? null : result);
      }

      // Low-level: positions the shared #floating-menu-list at `anchor` ({x, y} in viewport
      // coordinates, the corner it tries to open from — below-right by default, matching where
      // .menu-dropdown-list used to open) and shows the overlay. Callers fill the list's content
      // themselves first — shared by openMenuOverlay (action-menu items) and the notification
      // bell's read-only history panel below, since the actual position/clamp/show mechanics are
      // identical for both; only what's inside, and what happens on close, differs.
      function showFloatingOverlay(anchor) {
        const overlay = document.getElementById("floating-menu");
        const list = document.getElementById("floating-menu-list");

        // Positioned at the naive anchor first, then measured and clamped — the list has to
        // actually exist in the DOM with real content before its own rendered size is knowable.
        list.style.left = `${anchor.x}px`;
        list.style.top = `${anchor.y}px`;
        overlay.classList.add("is-open");

        requestAnimationFrame(() => {
          const rect = list.getBoundingClientRect();
          const margin = 6;
          let left = anchor.x;
          let top = anchor.y;
          if (left + rect.width > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - margin - rect.width);
          if (top + rect.height > window.innerHeight - margin) top = Math.max(margin, anchor.y - rect.height - (anchor.gap || 0));
          if (left < margin) left = margin;
          if (top < margin) top = margin;
          list.style.left = `${left}px`;
          list.style.top = `${top}px`;
        });
      }

      // items: [{label, value, disabled}], a divider is {divider: true}. Returns a Promise
      // resolving to the chosen item's value, or null if the menu was dismissed without a choice.
      function openMenuOverlay(items, anchor) {
        closeFloatingMenu();
        return new Promise((resolve) => {
          const list = document.getElementById("floating-menu-list");
          list.innerHTML = "";
          list.classList.remove("notif-panel-list");

          for (const item of items) {
            if (item.divider) {
              const div = document.createElement("div");
              div.className = "menu-dropdown-divider";
              list.appendChild(div);
              continue;
            }
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "menu-dropdown-item";
            btn.textContent = item.label;
            btn.disabled = Boolean(item.disabled);
            btn.addEventListener("click", (e) => {
              e.stopPropagation();
              closeFloatingMenu(item.value ?? null);
            });
            list.appendChild(btn);
          }

          floatingMenuResolve = resolve;
          showFloatingOverlay(anchor);
        });
      }

      // Convenience for a real trigger element — opens just below it, same default corner
      // .menu-dropdown-list used to, minus the per-trigger CSS overrides that used to be needed
      // for triggers near an edge (openMenuOverlay's own clamping replaces those).
      function openMenuFromTrigger(triggerEl, items) {
        const rect = triggerEl.getBoundingClientRect();
        return openMenuOverlay(items, { x: rect.left, y: rect.bottom + 2, gap: rect.height + 4 });
      }

      // ---------- Popup contributions (host) ----------

      // Settings/Modules/Plugins stay their own separate documents (real Tauri API access,

      contributeIframePopup("modules", { title: "Modules", forwardEvents: ["install-progress"] });
      contributeIframePopup("plugins", { title: "Plugins", forwardEvents: ["install-progress"] });

      // ---------- Header search ----------
      // A real searchbar now, not a button that opens one — types in place, shows matches in the
      // same dropdown popover initSearchbar() already drives everywhere else. Sourced from
      // buildSearchableSettingsList() (primitives.js) — right now that only covers settings, but
      // this bar itself isn't a "settings search," it's the app's one general search entry point;
      // more sources (open files, commands, whatever comes later) fold into the same options list
      // this passes to initSearchbar, not a second search UI.
      //
      // HEADER_SEARCH_CATEGORIES is the fixed, ordered set of result groups this bar knows about —
      // a category with nothing matching a given query just doesn't render its divider (see
      // initSearchbar's `categories` option), so "results"/"commands" having no source yet today is
      // invisible, not a placeholder gap. "results" (in-open-file text search) is deliberately not
      // built here — that becomes the Monaco plugin's own contribution once it exists, not core's
      // business. "commands" (Command Palette — the term predates VS Code, from Sublime Text, and
      // is the industry-standard name for "searchable list of actions" across editors generally, so
      // it's kept rather than invented fresh) has no registry to search yet either — only "settings"
      // actually has entries right now.
      const HEADER_SEARCH_CATEGORIES = [
        // browsable: false — in-file text search has nothing meaningful to preview with no query
        // typed yet, unlike Settings/Command Palette, which are real fixed lists worth browsing.
        { id: "results", label: "Results", browsable: false },
        { id: "commands", label: "Command Palette" },
        { id: "settings", label: "Settings" },
      ];

      const commandCenterSearch = document.getElementById("command-center-search");
      const commandCenterInput = commandCenterSearch.querySelector("input");

      buildSearchableSettingsList().then((entries) => {
        initSearchbar(commandCenterSearch, {
          options: entries.map((e) => ({ value: e.id, label: e.label, category: e.category })),
          categories: HEADER_SEARCH_CATEGORIES,
          onSelect: (value) => {
            const entry = entries.find((e) => e.id === value);
            commandCenterInput.value = "";
            commandCenterSearch.classList.remove("has-value");
            if (!entry) return;
            showPopup("settings", { url: `settings.html?search=${encodeURIComponent(entry.label)}&id=${encodeURIComponent(entry.id)}` }).catch(reportError);
          },
        });
      });

      // ---------- Notification bell ----------
      // Reads the exact same history every showToast() call (host chrome's own, and any plugin's
      // via window.lowarc.notify()) already feeds — see primitives.js's toast/notification-history
      // section. This panel is read-only history, not an action menu, so it bypasses
      // openMenuOverlay's items/resolve-a-value shape entirely and builds #floating-menu-list's
      // content by hand instead, reusing only the low-level positioning (showFloatingOverlay).
      let unreadNotifications = 0;

      function updateBellBadge() {
        document.getElementById("bell-badge").style.display = unreadNotifications > 0 ? "block" : "none";
      }

      function formatNotificationTime(ms) {
        const diff = Date.now() - ms;
        if (diff < 60000) return "just now";
        if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
        if (diff < 86400000) return `${Math.floor(diff / 3600000)}h ago`;
        return new Date(ms).toLocaleDateString();
      }

      function renderNotificationList(list) {
        list.innerHTML = "";
        const history = getNotificationHistory();

        const header = document.createElement("div");
        header.className = "notif-panel-header";
        const title = document.createElement("span");
        title.textContent = "Notifications";
        header.appendChild(title);
        if (history.length) {
          const clearBtn = document.createElement("button");
          clearBtn.type = "button";
          clearBtn.className = "notif-panel-clear";
          clearBtn.textContent = "Clear";
          clearBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            clearNotificationHistory();
            renderNotificationList(list);
          });
          header.appendChild(clearBtn);
        }
        list.appendChild(header);

        if (!history.length) {
          const empty = document.createElement("div");
          empty.className = "notif-panel-empty";
          empty.textContent = "No notifications yet.";
          list.appendChild(empty);
          return;
        }

        for (const entry of history) {
          const row = document.createElement("div");
          row.className = `notif-row toast-${entry.variant}`;

          const icon = document.createElement("span");
          icon.className = "toast-icon";
          icon.innerHTML = `<svg viewBox="0 0 16 16" fill="none">${TOAST_ICON_PATHS[entry.variant] || TOAST_ICON_PATHS.info}</svg>`;
          row.appendChild(icon);

          const body = document.createElement("span");
          body.className = "notif-row-body";
          const message = document.createElement("span");
          message.className = "notif-row-message";
          message.textContent = entry.message;
          body.appendChild(message);
          const meta = document.createElement("span");
          meta.className = "notif-row-meta";
          meta.textContent = formatNotificationTime(entry.time) + (entry.source ? ` · ${entry.source}` : "");
          body.appendChild(meta);
          row.appendChild(body);

          const dismissBtn = document.createElement("button");
          dismissBtn.type = "button";
          dismissBtn.className = "notif-row-dismiss";
          dismissBtn.setAttribute("aria-label", "Dismiss");
          dismissBtn.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>';
          dismissBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            removeNotificationHistoryEntry(entry.id);
            renderNotificationList(list);
          });
          row.appendChild(dismissBtn);

          list.appendChild(row);
        }
      }

      function openNotificationPanel(triggerEl) {
        closeFloatingMenu();
        const list = document.getElementById("floating-menu-list");
        list.classList.add("notif-panel-list");
        renderNotificationList(list);
        floatingMenuResolve = () => {}; // nothing to resolve — dismissal alone is the only outcome

        unreadNotifications = 0;
        updateBellBadge();

        const rect = triggerEl.getBoundingClientRect();
        showFloatingOverlay({ x: rect.left, y: rect.bottom + 2, gap: rect.height + 4 });
      }

      onNotification(() => {
        unreadNotifications++;
        updateBellBadge();
      });

      document.getElementById("bell-trigger").addEventListener("click", (e) => {
        e.stopPropagation();
        openNotificationPanel(e.currentTarget);
      });

      document.getElementById("floating-menu").addEventListener("click", (e) => {

      // Finds the <iframe> a given window belongs to — lets showMenu() (see the message listener
      // below) translate a plugin's own local click coordinates into host/screen coordinates. Every
      // plugin-hosted iframe (sidebar/inspector/console-tab panels AND open-file viewers, in either
      // editor group) carries this same class, so one query covers all of them without a second map
      // to keep in sync with mountPanelIframe/openFile/closeFile.
      function iframeForWindow(win) {
        for (const iframe of document.querySelectorAll("iframe.plugin-panel-frame")) {
          if (iframe.contentWindow === win) return iframe;
        }
        return null;
      }

      document.getElementById("account-menu-trigger").addEventListener("click", (e) => {

          { label: "Settings", value: "settings" },

        ]).then((value) => {
          if (value === "settings") showPopup("settings", { url: "settings.html" });
          else if (value === "appearance") showPopup("settings", { url: "settings.html?tab=appearance" });
        });

      // ---------- File menu ----------
      document.getElementById("back-to-start").addEventListener("click", () => {

      document.getElementById("open-project-item").addEventListener("click", async () => {

      // ---------- Edit menu ---------- (every item is disabled — nothing to route to yet)

      // ---------- View menu ----------
      document.getElementById("view-toggle-sidebar").addEventListener("click", () => togglePanel("sidebar"));
      document.getElementById("view-toggle-console").addEventListener("click", () => togglePanel("console"));
      document.getElementById("view-toggle-right").addEventListener("click", () => togglePanel("right"));

      document.getElementById("view-fullscreen-item").addEventListener("click", async () => {
        const appWindow = window.__TAURI__.window.getCurrentWindow();

      // ---------- Run menu ----------
      document.getElementById("run-menu-run").addEventListener("click", startRun);

      document.getElementById("dev-run-settings-item").addEventListener("click", () => {

      });

      // ---------- Help menu ----------
      document.getElementById("help-docs-item").addEventListener("click", () => {
        openUrl("https://lowarc.com");
      });

      document.getElementById("help-about-item").addEventListener("click", async () => {
        let version = "";
        try {
          version = `Version ${await window.__TAURI__.app.getVersion()}`;
        } catch (err) {
          version = "";
        }
        showPopup("about", { version });
      });

      initTooltips();
      initWindowControls();
      initTabs();

      // Drag-to-reorder — see initReorderable() in primitives.js. Only these four strips opt in
      // (data-reorderable, set on each one's own markup); everything else (the top menu bar, a
      // standalone page's view tabs) is untouched. Safe to call before any of their items exist —
      // the listeners are delegated on the container itself, not attached per-item.
      initReorderable(document.getElementById("rail-tabs"), { axis: "y", onReorder: (order) => saveTabOrder("rail-tabs", order) });
      // Each group names the OTHER as its crossContainer, so a file tab can be dragged freely
      // between them — see initReorderable's crossContainer/onMoveAcross in primitives.js.
      // moveFileToGroup isn't defined yet at this point in the script, but neither closure below
      // calls it until an actual cross-drag completes, by which point it is (function declarations
      // are hoisted, and this only ever fires from later user interaction, never synchronously here).
      initReorderable(document.getElementById("tab-bar-tabs-0"), {
        axis: "x",
        crossContainer: document.getElementById("tab-bar-tabs-1"),
        crossZone: document.getElementById("editor-group-1"),
        onReorder: (order) => saveTabOrder("tab-bar-tabs-0", order),
        onMoveAcross: (path) => moveFileToGroup(path, 1),
      });
      initReorderable(document.getElementById("tab-bar-tabs-1"), {
        axis: "x",
        crossContainer: document.getElementById("tab-bar-tabs-0"),
        crossZone: document.getElementById("editor-group-0"),
        onReorder: (order) => saveTabOrder("tab-bar-tabs-1", order),
        onMoveAcross: (path) => moveFileToGroup(path, 0),
      });
      initReorderable(document.getElementById("console-tabs"), { axis: "x", onReorder: (order) => saveTabOrder("console-tabs", order) });

      // ---------- Transport controls (Run/Pause/Stop) ----------
      // Real now: Run calls start_dev_run, Stop calls stop_dev_run, and dev-run-log/dev-run-ended
      // (see lib.rs) feed the console's Run tab. isRunning is authoritative from dev-run-ended,
      // not just set optimistically on click — a run can end on its own, not only via Stop.
      // Pause has no backend counterpart at all (the runtime has no pause concept, just
      // start/frame/stop) so it stays a toast — there's nothing dishonest to wire it to.
      let isRunning = false;

      function updateTransportButtons() {
        const runBtn = document.getElementById("run-btn");
        const pauseBtn = document.getElementById("pause-btn");
        const stopBtn = document.getElementById("stop-btn");

        runBtn.classList.toggle("btn-main", !isRunning);
        runBtn.classList.toggle("btn-ghost", isRunning);
        runBtn.disabled = isRunning;

        pauseBtn.classList.toggle("btn-warning", isRunning);
        pauseBtn.classList.toggle("btn-ghost", !isRunning);
        pauseBtn.disabled = !isRunning;

        stopBtn.classList.toggle("btn-danger", isRunning);
        stopBtn.classList.toggle("btn-ghost", !isRunning);
        stopBtn.disabled = !isRunning;
      }

      // Opens the native file picker for the project's entry file and persists whatever gets
      // picked. Shared by the menu item (change it any time) and ensureEntrySet (prompt only when
      // Run actually needs one) — both just need "ask, save, tell the user", nothing else differs.
      async function pickAndSetEntry() {
        const picked = await openDialog({ title: "Choose the project's entry file", defaultPath: projectPath });
        if (!picked) return null;
        try {
          const entry = await invoke("set_project_entry", { projectDir: projectPath, absoluteEntryPath: picked });
          showToast({ variant: "success", message: `Entry file set to ${entry}.` });
          return entry;
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return null;
        }
      }

      // Returns a project-relative entry path that's actually there on disk, prompting the picker
      // if none is set yet or if the one that was set has since moved/been deleted — same dialog
      // either way, since from the user's side "never set" and "no longer valid" look identical.
      async function ensureEntrySet(preset) {
        let entry = preset.entry && preset.entry.trim() ? preset.entry.trim() : null;
        if (entry && !(await invoke("entry_file_exists", { projectDir: projectPath, entry }))) {
          entry = null;
        }
        return entry || pickAndSetEntry();
      }

      async function startRun() {
        if (isRunning) return;

        let preset;
        try {
          preset = await invoke("get_project_preset", { projectDir: projectPath });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }

        const entry = await ensureEntrySet(preset);
        if (!entry) return; // picker was cancelled, or setting it failed (already toasted)

        try {
          await invoke("start_dev_run", { entryFile: entry, projectDir: projectPath });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }

        isRunning = true;
        updateTransportButtons();
        appendConsoleLine("info", `Run started (entry: ${entry}).`);
        activateConsoleTab("__run");
        setPanelOpen("console", true);
      }

      function stopRun() {
        invoke("stop_dev_run").catch((err) => showToast({ variant: "error", message: String(err) }));
      }

      document.getElementById("run-btn").addEventListener("click", startRun);
      document.getElementById("stop-btn").addEventListener("click", stopRun);
      document.getElementById("pause-btn").addEventListener("click", () => {
        showToast({ variant: "info", message: "Pausing isn't something the runtime can do — it only has start/stop." });
      });

      window.__TAURI__.event.listen("dev-run-log", (event) => {
        appendConsoleLine(event.payload.level, event.payload.message);
      });

      window.__TAURI__.event.listen("dev-run-ended", (event) => {
        isRunning = false;
        updateTransportButtons();
        if (event.payload.ok) {
          appendConsoleLine("info", "Run ended.");
        } else {
          (event.payload.errors || []).forEach((e) => appendConsoleLine("error", e));
          showToast({ variant: "error", message: "Run failed — see the Run tab." });
        }
      });

      // Plugin log lines share the same Run tab — one place to look for anything the app or
      // an installed plugin has to say, rather than needing per-plugin console real estate for it.
      window.__TAURI__.event.listen("plugin-log", (event) => {
        appendConsoleLine(event.payload.level, event.payload.message);
      });

      updateTransportButtons();

      // ---------- Unified panel state ----------
      // One place tracking each resizable panel's open/closed flag and its remembered size, so
      // the close (X) button, the header toggle icon, and dragging the divider past its minimum
      // all stay in sync instead of three separate ad-hoc mechanisms. Persisted globally in
      // settings.json's editorPanels (loaded below, saved on every toggle/close and on drag-end —
      // never on every drag tick, see initDividerDrag's onUp).

      const shell = document.getElementById("shell");

      // min/closeAt are shared across all three panels on purpose — different thresholds per
      // panel read as visually inconsistent (a sidebar and an inspector at different minimum
      // widths looks like a mistake, not a design choice).
      const PANELS = {
        sidebar: { open: false, size: 240, min: 160, closeAt: 50, max: 560, cssVar: "--sidebar-width", dataAttr: "sidebarOpen" },
        right: { open: false, size: 260, min: 160, closeAt: 50, max: 560, cssVar: "--right-width", dataAttr: "rightOpen" },
        console: { open: false, size: 220, min: 160, closeAt: 50, max: 640, cssVar: "--console-height", dataAttr: "consoleOpen" },
      };

      // Split-editor state lives outside PANELS on purpose — it isn't a grid-track toggle (no
      // cssVar/dataAttr, doesn't collapse to 0 on close), it's a flex ratio *inside* the "center"
      // grid area. See the Tab bar/open files section below for the group machinery this drives.
      let splitOpen = false;
      let splitRatio = 0.5;

      function applyPanel(key) {
        const p = PANELS[key];
        shell.style.setProperty(p.cssVar, `${p.open ? p.size : 0}px`);
        shell.dataset[p.dataAttr] = p.open ? "true" : "false";
      }

      // Read-modify-write helper — every save* function below goes through this rather than
      // spreading the cached loadedSettings directly. Real bug hit and fixed live: set_plugin_
      // enabled/set_module_enabled/install_*/remove_* all write Settings straight from a *fresh*
      // settings::load() on the Rust side, without loadedSettings (a plain JS variable, never
      // pushed to from those other commands) ever finding out — so a later save*() spreading the
      // stale cache would silently clobber whatever one of those had just written. Concretely:
      // toggling Terminal's Enabled checkbox back on in the plugin manager, then later dragging a
      // rail icon (triggering saveTabOrder), re-disabled Terminal — the drag's own save spread a
      // loadedSettings snapshot captured before the enable toggle. Always re-fetching here instead
      // of trusting the cache costs one extra IPC round-trip per save (infrequent, user-initiated
      // actions, not a hot path) and closes the whole class of bug at once rather than patching
      // each caller that happens to race with one of those other commands.
      let loadedSettings = null;
      let restoredSidebarActiveKey = null;

      // buildPatch is either a plain object (merged as-is) or a function receiving the just-
      // fetched fresh settings and returning the patch to merge — the function form is for a
      // caller that needs to merge against a sub-object (tabOrder) rather than replace it wholesale,
      // so two different containers' saves in quick succession don't stomp on each other either.
      async function updateSettings(buildPatch) {
        const fresh = await invoke("get_settings");
        const patch = typeof buildPatch === "function" ? buildPatch(fresh) : buildPatch;
        const settings = { ...fresh, ...patch };
        await invoke("save_settings", { settings });
        loadedSettings = settings;
        return settings;
      }

      async function savePanelLayout() {
        try {
          await updateSettings({
            editorPanels: {
              sidebarOpen: PANELS.sidebar.open,
              sidebarSize: PANELS.sidebar.size,
              sidebarActiveKey: document.querySelector("#rail-tabs .sidebar-tab.is-active")?.dataset.tabValue || null,
              rightOpen: PANELS.right.open,
              rightSize: PANELS.right.size,
              consoleOpen: PANELS.console.open,
              consoleSize: PANELS.console.size,
              splitOpen,
              splitRatio,
            },
          });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      // ---------- Reorderable tab/rail strip order (Settings.tabOrder) ----------
      // containerId is the strip's own DOM id ("rail-tabs", "tab-bar-tabs-0", "console-tabs").
      async function saveTabOrder(containerId, order) {
        try {
          await updateSettings((fresh) => ({ tabOrder: { ...fresh.tabOrder, [containerId]: order } }));
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      // Applies a saved order to whatever's already in the DOM — called once per renderTabStrip()
      // call (see there), whether that strip is built once and never re-rendered (the rail, the
      // console tabs) or rebuilt on every change (the file tab bars, whose contribution order
      // otherwise reverts to plain open-order — natural registry insertion order — on the very
      // next status change after a drag). anchorEl, if given, is a trailing non-item child items
      // must stay before (the console's tabs-spacer, ahead of its own "+"/"..." controls) —
      // container.insertBefore(el, null) already behaves like appendChild, so omitting it for the
      // rail/file-tab-bar case (nothing trails there) needs no special case.
      function applySavedOrder(container, itemSelector, keyAttr, anchorEl) {
        const order = loadedSettings?.tabOrder?.[container.id];
        if (!order || !order.length) return;
        const byKey = new Map(Array.from(container.querySelectorAll(itemSelector)).map((el) => [el.dataset[keyAttr], el]));
        for (const key of order) {
          const el = byKey.get(key);
          if (el) container.insertBefore(el, anchorEl || null);
        }
      }

      function setPanelOpen(key, open) {
        PANELS[key].open = open;
        applyPanel(key);
        syncToggleUI();
        savePanelLayout();
      }

      function togglePanel(key) {
        setPanelOpen(key, !PANELS[key].open);
      }

      function syncToggleUI() {
        document.getElementById("toggle-console").classList.toggle("is-active", PANELS.console.open);
        document.getElementById("toggle-right").classList.toggle("is-active", PANELS.right.open);
      }

      document.getElementById("console-close").addEventListener("click", () => setPanelOpen("console", false));
      document.getElementById("right-panel-close").addEventListener("click", () => setPanelOpen("right", false));
      document.getElementById("toggle-console").addEventListener("click", () => togglePanel("console"));
      document.getElementById("toggle-right").addEventListener("click", () => togglePanel("right"));

      async function loadPanelLayout() {
        try {
          loadedSettings = await invoke("get_settings");
          const ep = loadedSettings.editorPanels;
          if (ep) {
            PANELS.sidebar.open = ep.sidebarOpen;
            PANELS.sidebar.size = ep.sidebarSize;
            restoredSidebarActiveKey = ep.sidebarActiveKey || null;
            PANELS.right.open = ep.rightOpen;
            PANELS.right.size = ep.rightSize;
            PANELS.console.open = ep.consoleOpen;
            PANELS.console.size = ep.consoleSize;
            splitOpen = Boolean(ep.splitOpen);
            splitRatio = typeof ep.splitRatio === "number" ? ep.splitRatio : 0.5;
          }
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
        applyPanel("sidebar");
        applyPanel("right");
        applyPanel("console");
        syncToggleUI();
        // Split has no mounted files to restore (open files never persist across restart, split
        // or not — see the Tab bar/open files section), just the layout shell itself: whether the
        // second group is visible, and at what width.
        document.getElementById("center-panel").classList.toggle("is-split", splitOpen);
        document.getElementById("toggle-split").classList.toggle("is-active", splitOpen);
        applySplitRatio();
      }

      loadPanelLayout();

      // ---------- Plugin UI hosting ----------
      // A plugin declares its panels statically (PluginDescriptor.contributes, read at scan time
      // by list_installed_plugins) — the shell builds rail icons/console tabs straight from that,
      // eagerly, whether or not the plugin has actually finished starting yet. Panel *content*
      // (the iframe) is mounted lazily, the first time it's actually shown — the plugin process is
      // already started at app launch (setup() in lib.rs) by the time anyone could click a rail
      // icon, so there's no real need to gate on the live registerPanel confirmation as well; that
      // event is still listened for below, just for visibility/logging rather than as a gate.
      //
      // pluginPanels: "pluginId::panelId" -> { pluginId, panel: {id,title,entry,...}, iframe }
      // windowToPlugin: an iframe's contentWindow -> pluginId, so the message-relay listener below
      // can trust *which* plugin a postMessage actually came from instead of the message's own
      // (self-reported, therefore untrustworthy) claim. Open-file viewer iframes (see the
      // tab-bar/open-files block further down) register in this same map — one trust mechanism,
      // shared by both kinds of plugin-hosted iframe.
      const pluginPanels = new Map();
      const windowToPlugin = new Map();

      function panelKey(pluginId, panelId) {
        return `${pluginId}::${panelId}`;
      }

      function mountPanelIframe(key, container) {
        const entry = pluginPanels.get(key);
        if (!entry) return null;
        if (!entry.iframe) {
          const iframe = document.createElement("iframe");
          iframe.className = "plugin-panel-frame";
          iframe.setAttribute("sandbox", "allow-scripts");
          container.appendChild(iframe);
          entry.iframe = iframe;
          windowToPlugin.set(iframe.contentWindow, entry.pluginId);
          // Session-mode plugins (Terminal, so far — plugin.json's "session": true) start their
          // own sessions on demand (window.lowarc.startSession(), see plugin_session.rs) — one
          // per instance it wants running, not one the host auto-starts at mount time. Terminal
          // requests its first instance itself, the moment its own script runs, the exact same
          // way it requests every instance after that.
          // A panel has no filesystem access of its own, so if it needs to know the project root
          // (a file explorer does; most panels won't care) it's a URL fragment, not a postMessage
          // pushed after load (synchronous and readable the instant the plugin's own script
          // starts — no push-arrival-timing race to get wrong). Src is assigned once the
          // (cached, near-instant) plugin asset port is known — callers here get the iframe
          // element back synchronously to toggle classes on; they don't need the navigation
          // itself to have started yet.
          pluginAssetUrl(entry.pluginId, entry.panel.entry, `project=${encodeURIComponent(projectPath)}`).then((url) => {
            iframe.src = url;
          });
          // So a freshly-mounted panel (the file explorer, most importantly) gets the current
          // dirty/error/missing snapshot right away instead of waiting for the next change.
          iframe.addEventListener("load", () => broadcastFileStatus());
        }
        return entry.iframe;
      }

      // Generalizes what showSidebarPanel used to be into something any tab-strip region can use
      // (console joins in Phase 4) — shows contribution `id` from `slot` inside the element with id
      // `containerId`, mounting it (once, ever — cached below, regardless of source) the first time
      // it's actually shown. Host and plugin content are treated identically here: every
      // contribution gets the same reused per-tab wrapper (.host-panel-frame's existing show/hide
      // convention — flex column, 100%/100%, toggled via .is-active — not a new class just for
      // this), and mount(el) is free to build whatever it wants inside it, including delegating
      // straight to mountPanelIframe() the way a plugin adapter's mount() does; a plain iframe as
      // that wrapper's sole flex child fills it exactly the same as a host panel's own toolbar+list
      // markup does today.
      const slotTabMounted = new Map(); // "slot::id" -> the wrapper element already mounted for it

      function showSlotTab(slot, containerId, id) {
        const container = document.getElementById(containerId);
        container.classList.add("hosts-plugin");
        // Only the per-tab WRAPPER's own is-active is cleared here — never a mounted plugin
        // iframe's own .plugin-panel-frame.is-active nested inside one, which mount() sets exactly
        // once and never touches again (see the wrapper comment above). Clearing it here too would
        // un-set it permanently, since nothing would ever re-add it on a later show (mount() only
        // runs the first time) — the panel would come back empty on the second visit.
        container.querySelectorAll(".host-panel-frame").forEach((f) => f.classList.remove("is-active"));

        const contribution = getSlot(slot).find((c) => c.id === id);
        if (!contribution) return;

        const mountKey = `${slot}::${id}`;
        let el = slotTabMounted.get(mountKey);
        if (!el) {
          el = document.createElement("div");
          el.className = "host-panel-frame";
          container.appendChild(el);
          try {
            contribution.mount(el);
          } catch (err) {
            const errorEl = document.createElement("div");
            errorEl.style.color = "var(--danger)";
            errorEl.style.padding = "12px";
            errorEl.textContent = `This panel failed to load: ${err}`;
            el.appendChild(errorEl);
            showToast({ variant: "error", message: `"${id}" failed to render: ${err}`, source: contribution.pluginId || null });
          }
          slotTabMounted.set(mountKey, el);
        }
        el.classList.add("is-active");
        if (contribution.onShow) contribution.onShow();
      }

      // ---------- In-editor managers (host sidebar panels: __module-manager, __plugin-manager) ---
      // A quality-of-life alternative to the standalone Modules/Plugins pages (see file-modules-item/
      // file-plugins-item below) that never leaves the editor — deliberately separate surfaces, not
      // one replacing the other (Nolan: "those will be separate things"). Both wrap the exact same
      // Tauri commands the standalone pages already use — nothing new on the backend, just a
      // narrower-sidebar-shaped front end (single-column accordion instead of those pages' wide
      // two-pane list+detail layout, which needs more width than the sidebar's 240px default has).
      // One factory instead of two near-duplicate blocks, since a module manager and a plugin
      // manager are the same shape apart from which commands they call and which extra fields a
      // row shows — config.extraFields(item) is the only part that actually differs between them.
      function createManagerPanel(config) {
        const CHEVRON_SVG = '<svg viewBox="0 0 10 10" fill="none"><path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>';

        let items = [];
        let expandedId = null;
        let listEl = null;

        async function load() {
          try {
            items = await invoke(config.listCommand);
          } catch (err) {
            showToast({ variant: "error", message: String(err) });
            items = [];
          }
          if (!items.some((i) => i.id === expandedId)) expandedId = null;
          render();
        }

        function render() {
          listEl.innerHTML = "";
          if (items.length === 0) {
            const empty = document.createElement("div");
            empty.className = "plugin-manager-empty";
            empty.textContent = `No ${config.nounPlural} installed.`;
            listEl.appendChild(empty);
            return;
          }
          for (const item of items) listEl.appendChild(renderRow(item));
        }

        function renderRow(item) {
          const row = document.createElement("div");
          row.className = "plugin-manager-row";

          const header = document.createElement("button");
          header.type = "button";
          header.className = "plugin-manager-row-header";

          const dot = document.createElement("span");
          dot.className = "status-dot" + (item.disabled ? "" : " is-enabled");
          dot.dataset.tooltip = item.disabled ? "Disabled" : "Enabled";
          header.appendChild(dot);

          const name = document.createElement("span");
          name.className = "plugin-manager-row-name";
          name.textContent = item.name;
          header.appendChild(name);

          const chevron = document.createElement("span");
          chevron.className = "plugin-manager-row-chevron" + (expandedId === item.id ? " expanded" : "");
          chevron.innerHTML = CHEVRON_SVG;
          header.appendChild(chevron);

          header.addEventListener("click", () => {
            expandedId = expandedId === item.id ? null : item.id;
            render();
          });
          row.appendChild(header);

          if (expandedId === item.id) row.appendChild(renderRowBody(item));
          return row;
        }

        function renderRowBody(item) {
          const body = document.createElement("div");
          body.className = "plugin-manager-row-body";

          const sub = document.createElement("div");
          sub.className = "plugin-manager-row-sub";
          sub.textContent = item.id + (item.version ? ` · v${item.version}` : "");
          body.appendChild(sub);

          for (const field of config.extraFields(item)) {
            const fieldEl = document.createElement("div");
            fieldEl.className = "plugin-manager-row-desc";
            fieldEl.textContent = field.label ? `${field.label}: ${field.value}` : field.value;
            body.appendChild(fieldEl);
          }

          const actions = document.createElement("div");
          actions.className = "plugin-manager-row-actions";

          const enabledLabel = document.createElement("label");
          enabledLabel.className = "checkbox-row";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !item.disabled;
          const box = document.createElement("span");
          box.className = "checkbox-box";
          box.innerHTML = CHECK_SVG;
          const enabledText = document.createElement("span");
          enabledText.textContent = "Enabled";
          enabledLabel.appendChild(checkbox);
          enabledLabel.appendChild(box);
          enabledLabel.appendChild(enabledText);
          checkbox.addEventListener("change", async () => {
            try {
              await invoke(config.enableCommand, { id: item.id, enabled: checkbox.checked });
              await load();
            } catch (err) {
              showToast({ variant: "error", message: String(err) });
            }
          });
          actions.appendChild(enabledLabel);

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "btn btn-xs btn-danger";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", async () => {
            const confirmed = await showPopup("manager-remove", { nounSingular: config.nounSingular, name: item.name });
            if (!confirmed) return;
            try {
              await invoke(config.removeCommand, { id: item.id });
              expandedId = null;
              await load();
            } catch (err) {
              showToast({ variant: "error", message: String(err) });
            }
          });
          actions.appendChild(removeBtn);

          body.appendChild(actions);
          return body;
        }

        function mount(el) {
          const toolbar = document.createElement("div");
          toolbar.className = "plugin-manager-toolbar";
          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "btn btn-sm btn-outline";
          addBtn.innerHTML = `<svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg> Add ${config.nounSingular}…`;

          const progressEl = document.createElement("div");
          progressEl.className = "progress";
          progressEl.style.flex = "1";
          progressEl.style.display = "none";
          progressEl.innerHTML = '<div class="progress-fill"></div>';

          // This panel lives in editor.html's own top-level document (not an iframe, unlike the
          // standalone Modules/Plugins pages), so listening for the raw Tauri event directly here
          // is the proven pattern — no postMessage relay needed, same as dev-run-log/dev-run-ended.
          window.__TAURI__.event.listen("install-progress", (event) => {
            if (event.payload.kind !== config.nounSingular.toLowerCase()) return;
            setProgress(progressEl, event.payload.totalBytes ? event.payload.bytesDone / event.payload.totalBytes : 0);
          });

          addBtn.addEventListener("click", async () => {
            const sourceDir = await openDialog({ directory: true, title: `Choose a ${config.nounSingular.toLowerCase()} folder to install` });
            if (!sourceDir) return;

            addBtn.disabled = true;
            progressEl.style.display = "";
            setProgress(progressEl, 0);

            try {
              const id = await invoke(config.installCommand, { sourceDir });
              showToast({ variant: "success", message: `Installed "${id}".` });
              expandedId = id;
              await load();
            } catch (err) {
              showToast({ variant: "error", message: String(err) });
            } finally {
              addBtn.disabled = false;
              progressEl.style.display = "none";
            }
          });
          toolbar.appendChild(addBtn);
          toolbar.appendChild(progressEl);
          el.appendChild(toolbar);

          listEl = document.createElement("div");
          listEl.className = "plugin-manager-list";
          el.appendChild(listEl);

          initTooltips();
        }

        return { mount, onShow: load };
      }

      // Keyed with no "::" so a reserved id can never collide with panelKey()'s "pluginId::panelId"
      // shape. order is negative so both managers sort ahead of any plugin-contributed icon (which
      // defaults to order 0) regardless of how many plugins are installed — matching the fixed
      // "Modules, then Plugins, then everything else" position this HTML used to hard-code.
      const pluginManagerPanel = createManagerPanel({
        listCommand: "list_installed_plugins",
        enableCommand: "set_plugin_enabled",
        removeCommand: "remove_plugin",
        installCommand: "install_plugin",
        nounSingular: "Plugin",
        nounPlural: "plugins",
        extraFields: (item) => [{ value: item.description || "No description." }, { label: "Command", value: item.command }],
      });
      contribute("sidebar", {
        id: "__plugin-manager",
        sourceType: "host",
        label: "Plugins",
        order: -10,
        iconHtml:
          '<svg viewBox="0 0 16 16" fill="none"><path d="M5.5 2v3M10.5 2v3M4 5h8v2a4 4 0 0 1-4 4 4 4 0 0 1-4-4V5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M8 11v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>',
        mount: pluginManagerPanel.mount,
        onShow: pluginManagerPanel.onShow,
      });

      const moduleManagerPanel = createManagerPanel({
        listCommand: "list_installed_modules",
        enableCommand: "set_module_enabled",
        removeCommand: "remove_module",
        installCommand: "install_module",
        nounSingular: "Module",
        nounPlural: "modules",
        extraFields: (item) => [
          { value: item.description || "No description." },
          { label: "Load order", value: String(item.loadOrder) },
          { label: "Requires", value: item.requires.length ? item.requires.join(", ") : "Nothing." },
        ],
      });
      contribute("sidebar", {
        id: "__module-manager",
        sourceType: "host",
        label: "Modules",
        order: -20,
        iconHtml:
          '<svg viewBox="0 0 16 16" fill="none"><path d="M8 2l5.5 3.2v5.6L8 14l-5.5-3.2V5.2L8 2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /><path d="M8 8v6M8 8L2.5 4.8M8 8l5.5-3.2" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /></svg>',
        mount: moduleManagerPanel.mount,
        onShow: moduleManagerPanel.onShow,
      });

      const FALLBACK_RAIL_ICON_SVG = '<svg viewBox="0 0 16 16" fill="none"><rect x="3" y="3" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.3" /></svg>';

      // Strips anything that could execute if this SVG ends up in the HOST's own document (the
      // rail lives in editor.html itself, not a sandboxed iframe — unlike a plugin's panel
      // content, this has real Tauri access, so a plugin-supplied icon can't be trusted blindly).
      // innerHTML already never runs a <script> tag it inserts, but inline event-handler
      // attributes (onclick=, etc.) DO fire — those are the actual thing this strips.
      function sanitizeSvg(root) {
        root.querySelectorAll("script").forEach((el) => el.remove());
        root.querySelectorAll("*").forEach((el) => {
          for (const attr of Array.from(el.attributes)) {
            const name = attr.name.toLowerCase();
            if (name.startsWith("on") || (name === "href" && attr.value.trim().toLowerCase().startsWith("javascript:"))) {
              el.removeAttribute(attr.name);
            }
          }
        });
      }
