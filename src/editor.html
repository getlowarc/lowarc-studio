        document.getElementById("run-menu-restart").disabled = !isRunning;
      }

      // Opens the native file picker for the project's entry file and persists whatever gets
      // picked. Shared by the menu item (change it any time) and ensureEntrySet (prompt only when
      // Run actually needs one) — both just need "ask, save, tell the user", nothing else differs.
      async function pickAndSetEntry() {
        const picked = await openDialog({ title: "Choose the project's entry file", defaultPath: projectPath });
        if (!picked) return null;
        try {
          const entry = await invoke("set_project_entry", { projectDir: projectPath, absoluteEntryPath: picked });
          showToast({ variant: "success", message: `Entry file set to ${entry}.` });
          return entry;
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return null;
        }
      }

      // Returns a project-relative entry path that's actually there on disk, prompting the picker
      // if none is set yet or if the one that was set has since moved/been deleted — same dialog
      // either way, since from the user's side "never set" and "no longer valid" look identical.
      async function ensureEntrySet(preset) {
        let entry = preset.entry && preset.entry.trim() ? preset.entry.trim() : null;
        if (entry && !(await invoke("entry_file_exists", { projectDir: projectPath, entry }))) {
          entry = null;
        }
        return entry || pickAndSetEntry();
      }

      async function startRun() {
        if (isRunning) return;

        let preset;
        try {
          preset = await invoke("get_project_preset", { projectDir: projectPath });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }

        const entry = await ensureEntrySet(preset);
        if (!entry) return; // picker was cancelled, or setting it failed (already toasted)

        try {
          await invoke("start_dev_run", { entryFile: entry, projectDir: projectPath });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }

        isRunning = true;
        isPaused = false;
        updateTransportButtons();
        appendConsoleLine("info", `Run started (entry: ${entry}).`);
        activateConsoleTab("__run");
        setPanelOpen("console", true);
        broadcastRunState();
      }

      function stopRun() {
        invoke("stop_dev_run").catch((err) => showToast({ variant: "error", message: String(err) }));
      }

      // Stop, then start again once the backend has actually confirmed the run is over (the
      // dev-run-ended event, the same one the permanent listener below reacts to) — not just
      // fire-and-forget stop_dev_run immediately followed by start_dev_run, since the backend can't
      // usefully begin a new run while it still considers the old one active.
      async function restartRun() {
        if (!isRunning) return;
        await window.__TAURI__.event.once("dev-run-ended", () => startRun());
        stopRun();
      }

      // The single place isPaused actually changes and gets announced — called after EITHER the
      // toolbar's own Pause button or a plugin's pauseRun()/resumeRun() successfully flips the
      // backend flag, so a plugin's own displayed state (the Debug plugin, so far) stays accurate
      // no matter which control was actually used. `log` is false for a plugin-triggered change
      // only to avoid double-logging when the plugin itself might want to say something more
      // specific than a generic line — today nothing does, but the option costs nothing to keep.
      function setRunPaused(paused, { log = true } = {}) {
        isPaused = paused;
        if (log) appendConsoleLine("info", paused ? "Run paused." : "Run resumed.");
        broadcastRunState();
      }

      function togglePause() {
        if (!isRunning) return;
        invoke(isPaused ? "resume_dev_run" : "pause_dev_run")
          .then(() => setRunPaused(!isPaused))
          .catch((err) => showToast({ variant: "error", message: String(err) }));
      }

      // Pushed to every mounted plugin any time isRunning/isPaused actually changes (run start,
      // either Pause control, run end) — see broadcastToPlugins below. Lets a plugin's own status
      // display (e.g. the Debug plugin's toolbar text) stay correct even when it had nothing to do
      // with causing the change itself, the same reasoning lowarc:fileStatus already follows for
      // dirty/error state.
      function broadcastRunState() {
        broadcastToPlugins("lowarc:devRunState", { running: isRunning, paused: isPaused });
      }

      document.getElementById("run-btn").addEventListener("click", startRun);
      document.getElementById("stop-btn").addEventListener("click", stopRun);
      document.getElementById("pause-btn").addEventListener("click", togglePause);

      // Broadcasts one event into every currently-mounted plugin iframe — same shape as
      // broadcastFileStatus(), just generalized into its own helper since dev-run-frame/
      // dev-run-ended both need the exact same "every mounted panel, not just one" relay.
      function broadcastToPlugins(event, payload) {
        const message = { type: "emit", event, payload };
        for (const entry of pluginPanels.values()) {
          if (entry.iframe) entry.iframe.contentWindow.postMessage(message, "*");
        }
      }

      window.__TAURI__.event.listen("dev-run-log", (event) => {
        appendConsoleLine(event.payload.level, event.payload.message);
      });

      // Never fired during a normal free-running loop (see spawn_and_run's on_frame gate in
      // process_module.rs) — only while paused, stepping, or right as a breakpoint fires — so this
      // is safe to relay unthrottled; it's already rare by construction, not something that needs
      // debouncing here too.
      window.__TAURI__.event.listen("dev-run-frame", (event) => {
        broadcastToPlugins("lowarc:devRunFrame", event.payload);
      });

      window.__TAURI__.event.listen("dev-run-ended", (event) => {
        isRunning = false;
        isPaused = false;
        updateTransportButtons();
        broadcastToPlugins("lowarc:devRunEnded", event.payload);
        broadcastRunState();
        if (event.payload.ok) {
          appendConsoleLine("info", "Run ended.");
        } else {
          (event.payload.errors || []).forEach((e) => appendConsoleLine("error", e));
          showToast({ variant: "error", message: "Run failed — see the Run tab." });
        }
      });

      // Plugin log lines share the same Run tab — one place to look for anything the app or
      // an installed plugin has to say, rather than needing per-plugin console real estate for it.
      window.__TAURI__.event.listen("plugin-log", (event) => {
        appendConsoleLine(event.payload.level, event.payload.message);
      });

      updateTransportButtons();

      // ---------- Unified panel state ----------
      // One place tracking each resizable panel's open/closed flag and its remembered size, so
      // the close (X) button, the header toggle icon, and dragging the divider past its minimum
      // all stay in sync instead of three separate ad-hoc mechanisms. Persisted globally in
      // settings.json's editorPanels (loaded below, saved on every toggle/close and on drag-end —
      // never on every drag tick, see initDividerDrag's onUp).

      const shell = document.getElementById("shell");

      // min/closeAt are shared across all three panels on purpose — different thresholds per
      // panel read as visually inconsistent (a sidebar and an inspector at different minimum
      // widths looks like a mistake, not a design choice).
      const PANELS = {
        sidebar: { open: false, size: 240, min: 160, closeAt: 50, max: 560, cssVar: "--sidebar-width", dataAttr: "sidebarOpen" },
        right: { open: false, size: 260, min: 160, closeAt: 50, max: 560, cssVar: "--right-width", dataAttr: "rightOpen" },
        console: { open: false, size: 220, min: 160, closeAt: 50, max: 640, cssVar: "--console-height", dataAttr: "consoleOpen" },
      };

      // Split-editor state lives outside PANELS on purpose — it isn't a grid-track toggle (no
      // cssVar/dataAttr, doesn't collapse to 0 on close), it's a flex ratio *inside* the "center"
      // grid area. See the Tab bar/open files section below for the group machinery this drives.
      let splitOpen = false;
      let splitRatio = 0.5;

      function applyPanel(key) {
        const p = PANELS[key];
        shell.style.setProperty(p.cssVar, `${p.open ? p.size : 0}px`);
        shell.dataset[p.dataAttr] = p.open ? "true" : "false";
      }

      // Read-modify-write helper — every save* function below goes through this rather than
      // spreading the cached loadedSettings directly. Real bug hit and fixed live: set_plugin_
      // enabled/set_module_enabled/install_*/remove_* all write Settings straight from a *fresh*
      // settings::load() on the Rust side, without loadedSettings (a plain JS variable, never
      // pushed to from those other commands) ever finding out — so a later save*() spreading the
      // stale cache would silently clobber whatever one of those had just written. Concretely:
      // toggling Terminal's Enabled checkbox back on in the plugin manager, then later dragging a
      // rail icon (triggering saveTabOrder), re-disabled Terminal — the drag's own save spread a
      // loadedSettings snapshot captured before the enable toggle. Always re-fetching here instead
      // of trusting the cache costs one extra IPC round-trip per save (infrequent, user-initiated
      // actions, not a hot path) and closes the whole class of bug at once rather than patching
      // each caller that happens to race with one of those other commands.
      let loadedSettings = null;
      let restoredSidebarActiveKey = null;

      // buildPatch is either a plain object (merged as-is) or a function receiving the just-
      // fetched fresh settings and returning the patch to merge — the function form is for a
      // caller that needs to merge against a sub-object (tabOrder) rather than replace it wholesale,
      // so two different containers' saves in quick succession don't stomp on each other either.
      async function updateSettings(buildPatch) {
        const fresh = await invoke("get_settings");
        const patch = typeof buildPatch === "function" ? buildPatch(fresh) : buildPatch;
        const settings = { ...fresh, ...patch };
        await invoke("save_settings", { settings });
        loadedSettings = settings;
        return settings;
      }

      async function savePanelLayout() {
        try {
          await updateSettings({
            editorPanels: {
              sidebarOpen: PANELS.sidebar.open,
              sidebarSize: PANELS.sidebar.size,
              sidebarActiveKey: document.querySelector("#rail-tabs .sidebar-tab.is-active")?.dataset.tabValue || null,
              rightOpen: PANELS.right.open,
              rightSize: PANELS.right.size,
              consoleOpen: PANELS.console.open,
              consoleSize: PANELS.console.size,
              splitOpen,
              splitRatio,
            },
          });
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      // ---------- Reorderable tab/rail strip order (Settings.tabOrder) ----------
      // containerId is the strip's own DOM id ("rail-tabs", "tab-bar-tabs-0", "console-tabs").
      async function saveTabOrder(containerId, order) {
        try {
          await updateSettings((fresh) => ({ tabOrder: { ...fresh.tabOrder, [containerId]: order } }));
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
      }

      // Applies a saved order to whatever's already in the DOM — called once per renderTabStrip()
      // call (see there), whether that strip is built once and never re-rendered (the rail, the
      // console tabs) or rebuilt on every change (the file tab bars, whose contribution order
      // otherwise reverts to plain open-order — natural registry insertion order — on the very
      // next status change after a drag). anchorEl, if given, is a trailing non-item child items
      // must stay before (the console's tabs-spacer, ahead of its own "+"/"..." controls) —
      // container.insertBefore(el, null) already behaves like appendChild, so omitting it for the
      // rail/file-tab-bar case (nothing trails there) needs no special case.
      function applySavedOrder(container, itemSelector, keyAttr, anchorEl) {
        const order = loadedSettings?.tabOrder?.[container.id];
        if (!order || !order.length) return;
        const byKey = new Map(Array.from(container.querySelectorAll(itemSelector)).map((el) => [el.dataset[keyAttr], el]));
        for (const key of order) {
          const el = byKey.get(key);
          if (el) container.insertBefore(el, anchorEl || null);
        }
      }

      function setPanelOpen(key, open) {
        PANELS[key].open = open;
        applyPanel(key);
        syncToggleUI();
        savePanelLayout();
      }

      function togglePanel(key) {
        setPanelOpen(key, !PANELS[key].open);
      }

      function syncToggleUI() {
        document.getElementById("toggle-console").classList.toggle("is-active", PANELS.console.open);
        document.getElementById("toggle-right").classList.toggle("is-active", PANELS.right.open);
      }

      document.getElementById("console-close").addEventListener("click", () => setPanelOpen("console", false));
      document.getElementById("console-clear-run").addEventListener("click", () => {
        document.getElementById("console-run-panel").querySelectorAll(".line").forEach((el) => el.remove());
      });
      document.getElementById("right-panel-close").addEventListener("click", () => setPanelOpen("right", false));
      document.getElementById("toggle-console").addEventListener("click", () => togglePanel("console"));
      document.getElementById("toggle-right").addEventListener("click", () => togglePanel("right"));

      async function loadPanelLayout() {
        try {
          loadedSettings = await invoke("get_settings");
          const ep = loadedSettings.editorPanels;
          if (ep) {
            PANELS.sidebar.open = ep.sidebarOpen;
            PANELS.sidebar.size = ep.sidebarSize;
            restoredSidebarActiveKey = ep.sidebarActiveKey || null;
            PANELS.right.open = ep.rightOpen;
            PANELS.right.size = ep.rightSize;
            PANELS.console.open = ep.consoleOpen;
            PANELS.console.size = ep.consoleSize;
            splitOpen = Boolean(ep.splitOpen);
            splitRatio = typeof ep.splitRatio === "number" ? ep.splitRatio : 0.5;
          }
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
        }
        applyPanel("sidebar");
        applyPanel("right");
        applyPanel("console");
        syncToggleUI();
        // Split has no mounted files to restore (open files never persist across restart, split
        // or not — see the Tab bar/open files section), just the layout shell itself: whether the
        // second group is visible, and at what width.
        document.getElementById("center-panel").classList.toggle("is-split", splitOpen);
        document.getElementById("toggle-split").classList.toggle("is-active", splitOpen);
        applySplitRatio();
      }

      loadPanelLayout();

      // ---------- Plugin UI hosting ----------
      // A plugin declares its panels statically (PluginDescriptor.contributes, read at scan time
      // by list_installed_plugins) — the shell builds rail icons/console tabs straight from that,
      // eagerly, whether or not the plugin has actually finished starting yet. Panel *content*
      // (the iframe) is mounted lazily, the first time it's actually shown — the plugin process is
      // already started at app launch (setup() in lib.rs) by the time anyone could click a rail
      // icon, so there's no real need to gate on the live registerPanel confirmation as well; that
      // event is still listened for below, just for visibility/logging rather than as a gate.
      //
      // pluginPanels: "pluginId::panelId" -> { pluginId, panel: {id,title,entry,...}, iframe }
      // windowToPlugin: an iframe's contentWindow -> pluginId, so the message-relay listener below
      // can trust *which* plugin a postMessage actually came from instead of the message's own
      // (self-reported, therefore untrustworthy) claim. Open-file viewer iframes (see the
      // tab-bar/open-files block further down) register in this same map — one trust mechanism,
      // shared by both kinds of plugin-hosted iframe.
      const pluginPanels = new Map();
      const windowToPlugin = new Map();

      function panelKey(pluginId, panelId) {
        return `${pluginId}::${panelId}`;
      }

      function mountPanelIframe(key, container) {
        const entry = pluginPanels.get(key);
        if (!entry) return null;
        if (!entry.iframe) {
          const iframe = document.createElement("iframe");
          iframe.className = "plugin-panel-frame";
          iframe.dataset.pluginId = entry.pluginId; // lets a command look up this plugin's own mounted iframe by id, see runCommand()
          iframe.setAttribute("sandbox", "allow-scripts");
          container.appendChild(iframe);
          entry.iframe = iframe;
          windowToPlugin.set(iframe.contentWindow, entry.pluginId);
          // Session-mode plugins (Terminal, so far — plugin.json's "session": true) start their
          // own sessions on demand (window.lowarc.startSession(), see plugin_session.rs) — one
          // per instance it wants running, not one the host auto-starts at mount time. Terminal
          // requests its first instance itself, the moment its own script runs, the exact same
          // way it requests every instance after that.
          // A panel has no filesystem access of its own, so if it needs to know the project root
          // (a file explorer does; most panels won't care) it's a URL fragment, not a postMessage
          // pushed after load (synchronous and readable the instant the plugin's own script
          // starts — no push-arrival-timing race to get wrong). Src is assigned once the
          // (cached, near-instant) plugin asset port is known — callers here get the iframe
          // element back synchronously to toggle classes on; they don't need the navigation
          // itself to have started yet.
          pluginAssetUrl(entry.pluginId, entry.panel.entry, `project=${encodeURIComponent(projectPath)}`).then((url) => {
            iframe.src = url;
          });
          // So a freshly-mounted panel (the file explorer, most importantly) gets the current
          // dirty/error/missing snapshot right away instead of waiting for the next change.
          iframe.addEventListener("load", () => broadcastFileStatus());
          // Same cross-iframe click reasoning as the viewer iframes' own focus listener (see
          // mountFileInGroup) — a click landing inside this panel never bubbles up to this
          // document, so any open menu/dropdown would otherwise stay stuck open.
          iframe.addEventListener("focus", () => closeAllOverlays());
        }
        return entry.iframe;
      }

      // Generalizes what showSidebarPanel used to be into something any tab-strip region can use
      // (console joins in Phase 4) — shows contribution `id` from `slot` inside the element with id
      // `containerId`, mounting it (once, ever — cached below, regardless of source) the first time
      // it's actually shown. Host and plugin content are treated identically here: every
      // contribution gets the same reused per-tab wrapper (.host-panel-frame's existing show/hide
      // convention — flex column, 100%/100%, toggled via .is-active — not a new class just for
      // this), and mount(el) is free to build whatever it wants inside it, including delegating
      // straight to mountPanelIframe() the way a plugin adapter's mount() does; a plain iframe as
      // that wrapper's sole flex child fills it exactly the same as a host panel's own toolbar+list
      // markup does today.
      const slotTabMounted = new Map(); // "slot::id" -> the wrapper element already mounted for it

      function showSlotTab(slot, containerId, id) {
        const container = document.getElementById(containerId);
        container.classList.add("hosts-plugin");
        // Only the per-tab WRAPPER's own is-active is cleared here — never a mounted plugin
        // iframe's own .plugin-panel-frame.is-active nested inside one, which mount() sets exactly
        // once and never touches again (see the wrapper comment above). Clearing it here too would
        // un-set it permanently, since nothing would ever re-add it on a later show (mount() only
        // runs the first time) — the panel would come back empty on the second visit.
        container.querySelectorAll(".host-panel-frame").forEach((f) => f.classList.remove("is-active"));

        const contribution = getSlot(slot).find((c) => c.id === id);
        if (!contribution) return;

        const mountKey = `${slot}::${id}`;
        let el = slotTabMounted.get(mountKey);
        if (!el) {
          el = document.createElement("div");
          el.className = "host-panel-frame";
          container.appendChild(el);
          try {
            contribution.mount(el);
          } catch (err) {
            const errorEl = document.createElement("div");
            errorEl.style.color = "var(--danger)";
            errorEl.style.padding = "12px";
            errorEl.textContent = `This panel failed to load: ${err}`;
            el.appendChild(errorEl);
            showToast({ variant: "error", message: `"${id}" failed to render: ${err}`, source: contribution.pluginId || null });
          }
          slotTabMounted.set(mountKey, el);
        }
        el.classList.add("is-active");
        if (contribution.onShow) contribution.onShow();
      }

      // ---------- In-editor managers (host sidebar panels: __module-manager, __plugin-manager) ---
      // A quality-of-life alternative to the standalone Modules/Plugins pages (see file-modules-item/
      // file-plugins-item below) that never leaves the editor — deliberately separate surfaces, not
      // one replacing the other (Nolan: "those will be separate things"). Both wrap the exact same
      // Tauri commands the standalone pages already use — nothing new on the backend, just a
      // narrower-sidebar-shaped front end (single-column accordion instead of those pages' wide
      // two-pane list+detail layout, which needs more width than the sidebar's 240px default has).
      // One factory instead of two near-duplicate blocks, since a module manager and a plugin
      // manager are the same shape apart from which commands they call and which extra fields a
      // row shows — config.extraFields(item) is the only part that actually differs between them.
      function createManagerPanel(config) {
        const CHEVRON_SVG = '<svg viewBox="0 0 10 10" fill="none"><path d="M3 1l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8l3.5 3.5L13 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>';

        let items = [];
        let expandedId = null;
        let listEl = null;

        async function load() {
          try {
            items = await invoke(config.listCommand);
          } catch (err) {
            showToast({ variant: "error", message: String(err) });
            items = [];
          }
          if (!items.some((i) => i.id === expandedId)) expandedId = null;
          render();
        }

        function render() {
          listEl.innerHTML = "";
          if (items.length === 0) {
            const empty = document.createElement("div");
            empty.className = "plugin-manager-empty";
            empty.textContent = `No ${config.nounPlural} installed.`;
            listEl.appendChild(empty);
            return;
          }
          for (const item of items) listEl.appendChild(renderRow(item));
        }

        function renderRow(item) {
          const row = document.createElement("div");
          row.className = "plugin-manager-row";

          const header = document.createElement("button");
          header.type = "button";
          header.className = "plugin-manager-row-header";

          const dot = document.createElement("span");
          dot.className = "status-dot" + (item.disabled ? "" : " is-enabled");
          dot.dataset.tooltip = item.disabled ? "Disabled" : "Enabled";
          header.appendChild(dot);

          const name = document.createElement("span");
          name.className = "plugin-manager-row-name";
          name.textContent = item.name;
          header.appendChild(name);

          const chevron = document.createElement("span");
          chevron.className = "plugin-manager-row-chevron" + (expandedId === item.id ? " expanded" : "");
          chevron.innerHTML = CHEVRON_SVG;
          header.appendChild(chevron);

          header.addEventListener("click", () => {
            expandedId = expandedId === item.id ? null : item.id;
            render();
          });
          row.appendChild(header);

          if (expandedId === item.id) row.appendChild(renderRowBody(item));
          return row;
        }

        function renderRowBody(item) {
          const body = document.createElement("div");
          body.className = "plugin-manager-row-body";

          const sub = document.createElement("div");
          sub.className = "plugin-manager-row-sub";
          sub.textContent = item.id + (item.version ? ` · v${item.version}` : "");
          body.appendChild(sub);

          for (const field of config.extraFields(item)) {
            const fieldEl = document.createElement("div");
            fieldEl.className = "plugin-manager-row-desc";
            fieldEl.textContent = field.label ? `${field.label}: ${field.value}` : field.value;
            body.appendChild(fieldEl);
          }

          const actions = document.createElement("div");
          actions.className = "plugin-manager-row-actions";

          const enabledLabel = document.createElement("label");
          enabledLabel.className = "checkbox-row";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = !item.disabled;
          const box = document.createElement("span");
          box.className = "checkbox-box";
          box.innerHTML = CHECK_SVG;
          const enabledText = document.createElement("span");
          enabledText.textContent = "Enabled";
          enabledLabel.appendChild(checkbox);
          enabledLabel.appendChild(box);
          enabledLabel.appendChild(enabledText);
          checkbox.addEventListener("change", async () => {
            try {
              await invoke(config.enableCommand, { id: item.id, enabled: checkbox.checked });
              await load();
            } catch (err) {
              showToast({ variant: "error", message: String(err) });
            }
          });
          actions.appendChild(enabledLabel);

          const removeBtn = document.createElement("button");
          removeBtn.type = "button";
          removeBtn.className = "btn btn-xs btn-danger";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", async () => {
            const confirmed = await showPopup("manager-remove", { nounSingular: config.nounSingular, name: item.name });
            if (!confirmed) return;
            try {
              await invoke(config.removeCommand, { id: item.id });
              expandedId = null;
              await load();
            } catch (err) {
              showToast({ variant: "error", message: String(err) });
            }
          });
          actions.appendChild(removeBtn);

          body.appendChild(actions);
          return body;
        }

        function mount(el) {
          const toolbar = document.createElement("div");
          toolbar.className = "plugin-manager-toolbar";
          const addBtn = document.createElement("button");
          addBtn.type = "button";
          addBtn.className = "btn btn-sm btn-outline";
          addBtn.innerHTML = `<svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg> Add ${config.nounSingular}…`;

          const progressEl = document.createElement("div");
          progressEl.className = "progress";
          progressEl.style.flex = "1";
          progressEl.style.display = "none";
          progressEl.innerHTML = '<div class="progress-fill"></div>';

          // This panel lives in editor.html's own top-level document (not an iframe, unlike the
          // standalone Modules/Plugins pages), so listening for the raw Tauri event directly here
          // is the proven pattern — no postMessage relay needed, same as dev-run-log/dev-run-ended.
          window.__TAURI__.event.listen("install-progress", (event) => {
            if (event.payload.kind !== config.nounSingular.toLowerCase()) return;
            setProgress(progressEl, event.payload.totalBytes ? event.payload.bytesDone / event.payload.totalBytes : 0);
          });

          addBtn.addEventListener("click", async () => {
            const sourceDir = await openDialog({ directory: true, title: `Choose a ${config.nounSingular.toLowerCase()} folder to install` });
            if (!sourceDir) return;

            addBtn.disabled = true;
            progressEl.style.display = "";
            setProgress(progressEl, 0);

            try {
              const id = await invoke(config.installCommand, { sourceDir });
              showToast({ variant: "success", message: `Installed "${id}".` });
              expandedId = id;
              await load();
            } catch (err) {
              showToast({ variant: "error", message: String(err) });
            } finally {
              addBtn.disabled = false;
              progressEl.style.display = "none";
            }
          });
          toolbar.appendChild(addBtn);
          toolbar.appendChild(progressEl);
          el.appendChild(toolbar);

          listEl = document.createElement("div");
          listEl.className = "plugin-manager-list";
          el.appendChild(listEl);

          initTooltips();
        }

        return { mount, onShow: load };
      }

      // Keyed with no "::" so a reserved id can never collide with panelKey()'s "pluginId::panelId"
      // shape. order is negative so both managers sort ahead of any plugin-contributed icon (which
      // defaults to order 0) regardless of how many plugins are installed — matching the fixed
      // "Modules, then Plugins, then everything else" position this HTML used to hard-code.
      const pluginManagerPanel = createManagerPanel({
        listCommand: "list_installed_plugins",
        enableCommand: "set_plugin_enabled",
        removeCommand: "remove_plugin",
        installCommand: "install_plugin",
        nounSingular: "Plugin",
        nounPlural: "plugins",
        extraFields: (item) => [{ value: item.description || "No description." }, { label: "Command", value: item.command }],
      });
      contribute("sidebar", {
        id: "__plugin-manager",
        sourceType: "host",
        label: "Plugins",
        order: -10,
        iconHtml:
          '<svg viewBox="0 0 16 16" fill="none"><path d="M5.5 2v3M10.5 2v3M4 5h8v2a4 4 0 0 1-4 4 4 4 0 0 1-4-4V5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M8 11v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>',
        mount: pluginManagerPanel.mount,
        onShow: pluginManagerPanel.onShow,
      });

      const moduleManagerPanel = createManagerPanel({
        listCommand: "list_installed_modules",
        enableCommand: "set_module_enabled",
        removeCommand: "remove_module",
        installCommand: "install_module",
        nounSingular: "Module",
        nounPlural: "modules",
        extraFields: (item) => [
          { value: item.description || "No description." },
          { label: "Load order", value: String(item.loadOrder) },
          { label: "Requires", value: item.requires.length ? item.requires.join(", ") : "Nothing." },
        ],
      });
      contribute("sidebar", {
        id: "__module-manager",
        sourceType: "host",
        label: "Modules",
        order: -20,
        iconHtml:
          '<svg viewBox="0 0 16 16" fill="none"><path d="M8 2l5.5 3.2v5.6L8 14l-5.5-3.2V5.2L8 2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /><path d="M8 8v6M8 8L2.5 4.8M8 8l5.5-3.2" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" /></svg>',
        mount: moduleManagerPanel.mount,
        onShow: moduleManagerPanel.onShow,
      });

      const FALLBACK_RAIL_ICON_SVG = '<svg viewBox="0 0 16 16" fill="none"><rect x="3" y="3" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.3" /></svg>';

      // Strips anything that could execute if this SVG ends up in the HOST's own document (the
      // rail lives in editor.html itself, not a sandboxed iframe — unlike a plugin's panel
      // content, this has real Tauri access, so a plugin-supplied icon can't be trusted blindly).
      // innerHTML already never runs a <script> tag it inserts, but inline event-handler
      // attributes (onclick=, etc.) DO fire — those are the actual thing this strips.
      function sanitizeSvg(root) {
        root.querySelectorAll("script").forEach((el) => el.remove());
        root.querySelectorAll("*").forEach((el) => {
          for (const attr of Array.from(el.attributes)) {
            const name = attr.name.toLowerCase();
            if (name.startsWith("on") || (name === "href" && attr.value.trim().toLowerCase().startsWith("javascript:"))) {
              el.removeAttribute(attr.name);
            }
          }
        });
      }

      // Fetched as raw text over IPC (read_plugin_asset) rather than used as an <img src="..."> —
      // inlining it as a real <svg> lets it inherit currentColor for free, the same as the
      // fallback icon already does, which a rasterized <img> never could.
      async function loadRailIconSvg(pluginId, railIcon) {
        try {
          const text = await invoke("read_plugin_asset", { pluginId, relPath: railIcon });
          const doc = new DOMParser().parseFromString(text, "image/svg+xml");
          if (doc.querySelector("parsererror")) return null;
          const svg = doc.querySelector("svg");
          if (!svg) return null;
          sanitizeSvg(svg);
          return svg;
        } catch (err) {
          return null;
        }
      }

      // "__run" is the one console tab the app itself owns (dev-run + plugin log output) — every
      // other key is a plugin-contributed tab, both registered via contribute("console", ...) and
      // shown through the same showSlotTab() every other tab-strip region uses. activeConsoleTabKey
      // is still tracked separately (rather than always re-querying the DOM for it) since
      // requestNewTerminal() below needs it on every click, not just on activation.
      let activeConsoleTabKey = "__run";

      // Generalizes what activateConsoleTab(btn, key) used to be — takes just the key now (not a
      // button reference) so it can be called both from a real click (via renderTabStrip's
      // onActivate, below) and programmatically (startRun(), which has no click event to hand it).
      // Manually re-toggling is-active here is redundant on the click path (primitives.js's
      // initTabs() already did it, since #console-tabs is a [data-tabs] container) but necessary on
      // the programmatic one — cheap enough either way not to bother with two separate functions.
      function activateConsoleTab(key) {
        document.querySelectorAll("#console-tabs .console-tab").forEach((t) => t.classList.remove("is-active"));
        const btn = document.querySelector(`#console-tabs .console-tab[data-tab-value="${key}"]`);
        if (btn) btn.classList.add("is-active");

        activeConsoleTabKey = key;
        showSlotTab("console", "console-body", key);

        // The new-terminal controls only make sense while a session-mode tab (Terminal) is
        // active — "__run" has no pluginPanels entry at all, so it falls through to hidden too.
        const entry = key !== "__run" ? pluginPanels.get(key) : null;
        document.getElementById("console-session-controls").style.display = entry && entry.session ? "flex" : "none";
        document.getElementById("console-clear-run").style.display = key === "__run" ? "flex" : "none";
      }

      // ---------- Terminal's "new instance" controls (host chrome, not the plugin's own UI —
      // see the console header comment) ----------
      // Both just ask whichever session-mode tab is currently active to open another instance —
      // the plugin itself (Terminal) owns creating the session and adding it to its own sidebar,
      // this is only ever "tell the active session-mode iframe a new-instance request happened".
      function requestNewTerminal(shell) {
        const entry = pluginPanels.get(activeConsoleTabKey);
        if (entry && entry.iframe) {
          entry.iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:newTerminal", payload: { shell } }, "*");
        }
      }

      document.getElementById("console-new-session").addEventListener("click", () => requestNewTerminal(null));

      const CONSOLE_SESSION_SHELL_OPTIONS = [
        { value: "__default", label: "Default" },
        { value: "powershell", label: "PowerShell" },
        { value: "pwsh", label: "PowerShell 7 (pwsh)" },
        { value: "cmd", label: "Command Prompt" },
        { value: "bash", label: "Bash" },
        { value: "zsh", label: "Zsh" },
      ];
      document.getElementById("console-session-menu-trigger").addEventListener("click", (e) => {
        e.stopPropagation();
        openMenuFromTrigger(e.currentTarget, CONSOLE_SESSION_SHELL_OPTIONS).then((value) => {
          if (value) requestNewTerminal(value === "__default" ? null : value);
        });
      });

      // ---------- Maximize console (permanent, like Close — not scoped to any one tab) ----------
      let consoleMaximized = false;
      function setConsoleMaximized(maximized) {
        consoleMaximized = maximized;
        document.getElementById("console-expand").classList.toggle("is-active", maximized);
        if (maximized) {
          // Not calc(100vh - Npx) — CSS Grid doesn't shrink the *other* explicit/auto rows to
          // make room for one row that would overflow the container, it just lets the grid
          // overflow instead (confirmed live: the CSS var applied correctly but nothing visually
          // grew). Computing the real leftover pixels here, from the shell's own actual height
          // minus what the menu bar/status bar/divider genuinely take up, is what actually
          // collapses the center row to ~0 instead of merely overflowing past it.
          const shellHeight = shell.getBoundingClientRect().height;
          const menuHeight = document.querySelector(".menu-bar").getBoundingClientRect().height;
          const statusHeight = document.querySelector(".status-bar").getBoundingClientRect().height;
          const dividerHeight = 4; // the fixed 4px row between the center view and the console
          const available = shellHeight - menuHeight - statusHeight - dividerHeight;
          shell.style.setProperty("--console-height", `${Math.max(PANELS.console.min, available)}px`);
        } else {
          applyPanel("console"); // restores the normal, persisted (draggable) size
        }
      }
      document.getElementById("console-expand").addEventListener("click", () => setConsoleMaximized(!consoleMaximized));

      function appendConsoleLine(level, message) {
        const panel = document.getElementById("console-run-panel");
        const line = document.createElement("div");
        line.className = "line";
        line.textContent = message;
        if (level === "error") line.style.color = "var(--danger)";
        else if (level === "warn" || level === "warning") line.style.color = "var(--yellow)";
        panel.appendChild(line);
        panel.scrollTop = panel.scrollHeight;
      }

      // order:-10 so Run always sorts first, matching its old fixed "always first" position in the
      // static HTML. closeable:false — nothing currently renders a per-tab close control for ANY
      // console tab (Terminal manages closing its own sessions through its own UI, not a host-drawn
      // X), so this is forward-looking metadata, not something consumed yet. mount(el) just
      // re-parents the one #console-run-panel element that already exists and that
      // appendConsoleLine() already writes into regardless of migration — its own "is-active" class
      // (already set in its static HTML) is left untouched and permanent, exactly like a plugin
      // sidebar iframe's is-active is (see showSlotTab's wrapper comment); the WRAPPER's is-active
      // is what actually governs visibility once mounted.
      contribute("console", {
        id: "__run",
        sourceType: "host",
        label: "Run",
        order: -10,
        closeable: false,
        mount(el) {
          el.appendChild(document.getElementById("console-run-panel"));
        },
      });

      // ---------- Base system: shared region renderers ----------
      // Built on primitives.js's contribute()/getSlot() registry.

      // For a region with no tab strip at all — just one contribution shown, full-size (Inspector,
      // today). Same "first wins, a second is logged and otherwise ignored" rule the viewport used
      // to follow too, before it became the tab-bar/open-files system below (arbitrated per file by
      // extension, not one plugin claiming the whole slot forever — Inspector still claims it
      // forever, since nothing there is keyed by anything a user picks). A contribution's mount()
      // runs once, the first time this slot is actually rendered — calling renderSingleSlot again
      // (e.g. loadPluginContributions() re-running) is a no-op for whichever contribution already
      // won it.
      const singleSlotMounted = new Map(); // slot id -> the contribution id already mounted into it

      function renderSingleSlot(container, slot) {
        const contributions = getSlot(slot);
        if (!contributions.length) return;
        const [contribution, ...rest] = contributions;
        if (rest.length) {
          console.warn(`[base] "${slot}" is single-slot — "${contribution.id}" claimed it; ignoring ${rest.map((c) => `"${c.id}"`).join(", ")}.`);
        }
        if (singleSlotMounted.get(slot) === contribution.id) return;
        singleSlotMounted.set(slot, contribution.id);
        container.classList.add("hosts-plugin");
        try {
          contribution.mount(container);
        } catch (err) {
          const errorEl = document.createElement("div");
          errorEl.style.color = "var(--danger)";
          errorEl.style.padding = "12px";
          errorEl.textContent = `This panel failed to load: ${err}`;
          container.appendChild(errorEl);
          showToast({ variant: "error", message: `"${slot}" panel failed to render: ${err}`, source: contribution.pluginId || null });
        }
      }

      // For a region with a tab strip — (re)builds a button per contribution in `slot`, into
      // `container` (already wired as a [data-tabs] strip by primitives.js's initTabs(), and —
      // separately — by whichever initReorderable(...) call already covers this container, see the
      // "Drag-to-reorder" block above; this only builds the buttons and their activate/close
      // behavior on top of both, it doesn't reimplement either). Safe to call repeatedly — every
      // call clears and rebuilds just the tab elements (and the empty-state placeholder, if any) it
      // itself owns, the same "rebuild from scratch on every relevant change" shape renderTabBar()
      // already used before this existed; listener wiring (tab-change/click) only happens once per
      // container, guarded below, so repeated calls don't stack duplicate listeners.
      //
      // opts: { itemClass, anchorEl (a trailing non-item child tabs must stay before — the
      // console's own "+"/spacer controls; omit if there's none), iconBased (default true — rail
      // tabs are icon-only with a tooltip for the label, matching addSidebarRailIcon's old
      // convention; pass false for a text-label strip like the console's/a file tab's), emptyText
      // (shown in the strip itself when the slot has no contributions — omit for a strip that's
      // fine looking merely empty, like the rail), onActivate(contribution) (a tab just became the
      // active one), onToggleClose(contribution, btn) (optional — clicking the ALREADY-active tab
      // calls this INSTEAD of onActivate; return false to leave it active and let the click fall
      // through as normal), onClose(contribution) (optional — only takes effect on a contribution
      // whose own closeable is exactly true, e.g. a file tab; renders a close button and routes it
      // here instead of onActivate/onToggleClose), decorate(contribution, tabEl) (optional — called
      // for every tab element right after it's built, so a caller can apply status classes it reads
      // from ITS OWN live state rather than the contribution, which is meant to stay a fairly static
      // declaration — see renderTabBar()'s dirty/missing classes for the motivating case). An
      // icon-based contribution's icon is either static (iconHtml, shown immediately) or resolved
      // async (resolveIcon(), a plugin's own railIcon fetched over IPC — shown once it resolves,
      // FALLBACK_RAIL_ICON_SVG until then), matching how addSidebarRailIcon used to load one.
      function renderTabStrip(container, slot, opts) {
        const { itemClass = "sidebar-tab", anchorEl = null, iconBased = true, emptyText = null, onActivate, onToggleClose, onClose, decorate } = opts;

        container.querySelectorAll("[data-tab-value], .tab-bar-empty").forEach((el) => el.remove());

        // Filtered here, not inside getSlot() itself — hiding a tab/icon is purely about whether
        // it's SHOWN in this one strip, never about disabling the contribution. Every other
        // consumer of getSlot() (showSlotTab, activateConsoleTab, ensurePluginMounted, the Command
        // Palette, …) still needs to see and reach a hidden contribution exactly as before.
        const contributions = getSlot(slot).filter((c) => !isSlotItemHidden(slot, c.id));

        if (!contributions.length && emptyText) {
          const empty = document.createElement("div");
          empty.className = "tab-bar-empty";
          empty.textContent = emptyText;
          container.insertBefore(empty, anchorEl);
        }

        for (const contribution of contributions) {
          const closeable = contribution.closeable === true;
          // A closeable tab hosts a real nested <button> (the close control) — buttons can't nest,
          // so it's a div standing in for one (role/tabindex/keydown-triggers-click), the same shape
          // file-tabs already used before this existed. A non-closeable tab stays a real <button>.
          const tab = document.createElement(closeable ? "div" : "button");
          tab.className = itemClass;
          tab.dataset.tabValue = contribution.id;

          if (closeable) {
            tab.setAttribute("role", "button");
            tab.tabIndex = 0;
            tab.addEventListener("keydown", (e) => {
              if (e.key === "Enter" || e.key === " ") {
                e.preventDefault();
                tab.click();
              }
            });
          } else {
            tab.type = "button";
          }

          if (iconBased) {
            tab.dataset.tooltip = contribution.label;
            tab.setAttribute("aria-label", contribution.label);
            tab.innerHTML = contribution.iconHtml || FALLBACK_RAIL_ICON_SVG;
            if (contribution.resolveIcon) {
              contribution.resolveIcon().then((svg) => {
                if (!svg) return;
                svg.setAttribute("width", "16");
                svg.setAttribute("height", "16");
                tab.innerHTML = "";
                tab.appendChild(svg);
              });
            }
          } else if (closeable) {
            const label = document.createElement("span");
            label.textContent = contribution.label;
            tab.appendChild(label);
          } else {
            tab.textContent = contribution.label;
          }

          if (closeable) {
            const close = document.createElement("button");
            close.type = "button";
            close.className = "btn btn-icon-only btn-xs btn-ghost-danger file-tab-close";
            close.setAttribute("aria-label", `Close ${contribution.label}`);
            close.innerHTML =
              '<svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>';
            close.addEventListener("click", (e) => {
              // Without this, the click bubbles up to the tab bar and the primitive's own
              // delegation would treat it as "activate this tab" too, right as it's closing.
              e.stopPropagation();
              if (onClose) onClose(contribution);
            });
            tab.appendChild(close);
          }

          if (decorate) decorate(contribution, tab);
          container.insertBefore(tab, anchorEl);
        }

        applySavedOrder(container, "[data-tab-value]", "tabValue", anchorEl);
        initTooltips();

        if (container.dataset.tabStripWired) return;
        container.dataset.tabStripWired = "true";

        if (onActivate) {
          container.addEventListener("tab-change", (e) => {
            const contribution = getSlot(slot).find((c) => c.id === e.detail.value);
            if (contribution) onActivate(contribution);
          });
        }

        // Toggle-close-on-reclick — generic here instead of hand-wired per region. This is the
        // actual payoff of unifying: the behavior used to only exist for plugin-added rail icons
        // (wired inside addSidebarRailIcon() itself) until the two host-added manager icons — added
        // a different way — needed a second, separate fix. Capture phase: observes pre-click state
        // before [data-tabs]' own bubble-phase handler (primitives.js's initTabs()) mutates
        // is-active, and — only once onToggleClose actually handles it — stops that handler from
        // also firing and immediately reopening what this just closed.
        if (onToggleClose) {
          container.addEventListener(
            "click",
            (e) => {
              const btn = e.target.closest("[data-tab-value]");
              if (!btn || !btn.classList.contains("is-active")) return;
              const contribution = getSlot(slot).find((c) => c.id === btn.dataset.tabValue);
              if (!contribution) return;
              if (onToggleClose(contribution, btn) !== false) e.stopPropagation();
            },
            true,
          );
        }
      }

      // ---------- Rail/Console icon visibility (right-click to show/hide individual entries) ----------
      // Purely a display filter, independent of whether a plugin/module is actually enabled — hiding
      // an icon here only removes it from THIS strip; the underlying contribution (its panel, its
      // other slots if it has any) is untouched and still reachable everywhere else (Command
      // Palette, etc. — every OTHER getSlot() consumer besides renderTabStrip's own filter above
      // still sees it). Scoped to Rail (sidebar) and Console only, per Nolan: "Just the Console and
      // Rail. Nowhere else for now" — even though renderTabStrip's filter itself is generic enough
      // to already work for any slot the moment a menu is wired up for one.
      function isSlotItemHidden(slot, id) {
        return (loadedSettings?.hiddenSlotItems?.[slot] || []).includes(id);
      }

      // renderTabStrip rebuilds its buttons from scratch on every call (see its own comment) — that
      // means whichever one was is-active loses that class too, since it's a fresh element with no
      // memory of it. The startup restore path (restoredSidebarActiveKey, below) already has to
      // solve this same problem once; toggling hidden state re-solves it here every time instead of
      // only at load. A now-hidden active item legitimately has nothing to re-highlight — that's
      // correct, not a bug — its content stays open regardless (a plugin's own tab or panel is never
      // unmounted by any of this, only the tab/icon that points at it stops rendering).
      async function toggleSlotItemHidden(slot, id) {
        await updateSettings((fresh) => {
          const current = new Set(fresh.hiddenSlotItems?.[slot] || []);
          if (current.has(id)) current.delete(id);
          else current.add(id);
          return { hiddenSlotItems: { ...(fresh.hiddenSlotItems || {}), [slot]: [...current] } };
        });
        if (slot === "sidebar") {
          const activeKey = document.querySelector("#rail-tabs .sidebar-tab.is-active")?.dataset.tabValue;
          renderRailTabs();
          const btn = activeKey && document.querySelector(`#rail-tabs .sidebar-tab[data-tab-value="${activeKey}"]`);
          if (btn) btn.classList.add("is-active");
        } else if (slot === "console") {
          renderConsoleTabs();
          activateConsoleTab(activeConsoleTabKey);
        }
      }

      function renderRailTabs() {
        renderTabStrip(document.getElementById("rail-tabs"), "sidebar", {
          itemClass: "sidebar-tab",
          onActivate: (contribution) => {
            showSlotTab("sidebar", "left-panel-body", contribution.id);
            setPanelOpen("sidebar", true);
          },
          onToggleClose: (contribution, btn) => {
            if (!PANELS.sidebar.open) return false;
            btn.classList.remove("is-active");
            setPanelOpen("sidebar", false);
          },
        });
      }

      function renderConsoleTabs() {
        renderTabStrip(document.getElementById("console-tabs"), "console", {
          itemClass: "console-tab",
          iconBased: false,
          anchorEl: document.querySelector(".console-tabs-spacer"),
          onActivate: (contribution) => activateConsoleTab(contribution.id),
        });
      }

      // Lists every contribution currently registered for `slot`, including hidden ones — the whole
      // point of this menu is letting a hidden one be turned back on, so it can't just read what's
      // already shown. One click toggles that item and closes the menu (right-click again for more),
      // matching how every other menu in the app already behaves rather than inventing a
      // stays-open-across-clicks variant just for this.
      function openSlotVisibilityMenu(slot, x, y) {
        const items = getSlot(slot).map((c) => ({ label: c.label, value: c.id, checked: !isSlotItemHidden(slot, c.id) }));
        if (!items.length) return;
        openMenuOverlay(items, { x, y }).then((id) => {
          if (id) toggleSlotItemHidden(slot, id);
        });
      }

      // Bound to the whole #rail nav, not just #rail-tabs — #rail-tabs is only as tall as its own
      // icons (its own spacer, .rail-spacer, is a SIBLING outside it, unlike the console's own
      // spacer which lives INSIDE #console-tabs and so already made that whole row clickable). A
      // right-click below the last icon, or with every icon currently hidden, would otherwise hit
      // #rail with nothing listening — exactly the case this menu most needs to be reachable from.
      document.getElementById("rail").addEventListener("contextmenu", (e) => {
        e.preventDefault();
        e.stopPropagation();
        openSlotVisibilityMenu("sidebar", e.clientX, e.clientY);
      });
      document.getElementById("console-tabs").addEventListener("contextmenu", (e) => {
        e.preventDefault();
        e.stopPropagation();
        openSlotVisibilityMenu("console", e.clientX, e.clientY);
      });

      // extension (lowercase, dot-included) -> { pluginId, viewer }. Same "first wins, no silent
      // override" rule as renderSingleSlot, for the same reason — two viewers silently fighting
      // over one file type would be worse than an honest, logged "already taken".
      const viewersByExtension = new Map();

      function registerViewer(pluginId, viewer) {
        for (const ext of viewer.extensions || []) {
          const key = ext.toLowerCase();
          if (viewersByExtension.has(key)) {
            console.warn(`[plugins] "${key}" is already viewed by "${viewersByExtension.get(key).pluginId}" — ignoring the same contribution from "${pluginId}".`);
            continue;
          }
          viewersByExtension.set(key, { pluginId, viewer });
        }
      }

      async function loadPluginContributions() {
        let plugins = [];
        try {
          plugins = await invoke("list_installed_plugins");
        } catch (err) {
          showToast({ variant: "error", message: String(err) });
          return;
        }

        for (const plugin of plugins) {
          if (plugin.disabled || !plugin.contributes) continue;

          for (const panel of plugin.contributes.panels || []) {
            const key = panelKey(plugin.id, panel.id);
            pluginPanels.set(key, { pluginId: plugin.id, panel, iframe: null, session: plugin.session });
            if (panel.location === "sidebar") {
              contribute("sidebar", {
                id: key,
                sourceType: "plugin",
                pluginId: plugin.id,
                label: panel.title,
                resolveIcon: panel.railIcon ? () => loadRailIconSvg(plugin.id, panel.railIcon) : undefined,
                mount(container) {
                  mountPanelIframe(key, container).classList.add("is-active");
                },
              });
            } else if (panel.location === "inspector") {
              contribute("inspector", {
                id: key,
                sourceType: "plugin",
                pluginId: plugin.id,
                mount(container) {
                  mountPanelIframe(key, container).classList.add("is-active");
                },
              });
            }
          }

          for (const tab of plugin.contributes.consoleTabs || []) {
            const key = panelKey(plugin.id, tab.id);
            pluginPanels.set(key, { pluginId: plugin.id, panel: tab, iframe: null, session: plugin.session });
            contribute("console", {
              id: key,
              sourceType: "plugin",
              pluginId: plugin.id,
              label: tab.title,
              mount(el) {
                mountPanelIframe(key, el).classList.add("is-active");
              },
            });
          }

          for (const viewer of plugin.contributes.viewers || []) {
            registerViewer(plugin.id, viewer);
          }
        }

        // Mounted eagerly here (matching the old claimSingleSlot's timing) rather than lazily on
        // first open — Inspector's own open/close is a pure CSS-width toggle (see PANELS.right),
        // independent of whether anything is mounted inside it, so waiting for "first shown" would
        // actually be waiting for an event that doesn't exist yet.
        renderSingleSlot(document.getElementById("right-panel-body"), "inspector");

        // Built once, here, from everything contribute("sidebar", ...) registered above (both
        // managers, registered earlier at top-level script scope, plus whatever this loop just
        // added) — applySavedOrder's drag-order pass happens inside renderTabStrip itself, so it
        // only needs applying once, now that every icon that could be in it actually exists.
        renderRailTabs();

        // Same "built once, from the registry" shape as the rail above, just text-labeled
        // (iconBased: false) and anchored before .console-tabs-spacer instead of nothing, since
        // this container also holds the maximize/close/new-terminal controls after its tabs.
        renderConsoleTabs();

        // "__run" (Run) needs its one-time mount() — which reparents the static #console-run-panel
        // out of console-body and into its own wrapper — to happen right now, unconditionally, not
        // just whenever a user happens to click the Run tab first. Until that reparenting happens,
        // #console-run-panel's own permanently-baked-in "is-active" class (see its static HTML)
        // makes it render on its own regardless of any other tab's wrapper — a same-height phantom
        // sibling stacking underneath whatever tab genuinely is active, which is exactly what showed
        // up as unexplained extra scroll height the moment Terminal (or anything else) became active
        // before Run ever had been. Doesn't open the console panel itself — activateConsoleTab()
        // never does that — just establishes Run as the active tab underneath, matching what the
        // static HTML already visually implied by default.
        activateConsoleTab("__run");

        // [data-tabs] only marks .is-active in response to a real click (see initTabs() in
        // primitives.js) — it doesn't know about restoredSidebarActiveKey, the tab that was active
        // when this layout was last saved (see savePanelLayout/loadPanelLayout). Re-activate that
        // same rail icon now that the icons actually exist, so a session that closed with a rail
        // tab selected reopens showing that same panel instead of an empty one.
        const restoredBtn = restoredSidebarActiveKey && document.querySelector(`#rail-tabs .sidebar-tab[data-tab-value="${restoredSidebarActiveKey}"]`);
        if (restoredBtn) {
          restoredBtn.classList.add("is-active");
          showSlotTab("sidebar", "left-panel-body", restoredSidebarActiveKey);
        }

        // Whether or not that restore succeeded (the saved key might belong to a plugin that's no
        // longer installed), PANELS.sidebar.open can still be stale — it's restored from settings
        // independently of whether any rail tab ended up active. A panel claiming "open" with no
        // active tab behind it is a blank strip that looks broken, the same failure shape as the
        // console-maximize/xterm bugs already fixed this session. Force it shut if that's the state.
        if (PANELS.sidebar.open && !document.querySelector("#rail-tabs .sidebar-tab.is-active")) {
          setPanelOpen("sidebar", false);
        }
      }

      // ---------- Tab bar / open files (one or two editor groups — see toggleSplit below) ----------
      // openFiles: absolute path -> { title, dirty, missing, hasErrors, pluginId, iframe, groupId }.
      // ONE iframe per (editor group, viewer plugin) pair, not one per open file — a "multi-document
      // viewer" plugin (Monaco, today) manages several open files inside that one instance itself
      // (see the lowarc:openFile/activateFile/closeFile/getContent contract in plugin_assets.rs),
      // the same shape a "session": true plugin like Terminal already uses for multiple terminal
      // tabs inside one iframe — the host never needs to know a plugin has "instances," only which
      // path is currently active. Per-file scroll position/undo history survive a tab switch
      // because the PLUGIN itself saves/restores view state around each activateFile, the same way
      // VS Code's own editor does — not because the DOM node never went away.
      // Unlike VS Code, a file isn't shared across groups here — there's no way to share a model
      // between two separate sandboxed iframes (two different JS realms) to split — so a path can
      // only be open in ONE group at a time; opening an already-open file just activates it
      // wherever it already is, and moving it to the other group asks the source instance for its
      // current content (see requestPluginContent below) rather than re-reading the file from disk,
      // so unsaved edits survive the move.
      const openFiles = new Map();
      // iframe.contentWindow -> Set<path> this iframe is currently responsible for. A plugin's own
      // markDirty/markErrors/requestClose/saveFile calls all carry an explicit path now (see
      // plugin_assets.rs) — this Set is what validates that path actually belongs to the iframe
      // claiming it, the same trust role a single Map<Window, path> played before multiple files
      // could share one iframe.
      const windowToFilePaths = new Map();
      // "${groupId}:${pluginId}" -> the one iframe currently mounted for that plugin in that group,
      // if any — what openFile()/moveFileToGroup() check before deciding whether to reuse an
      // already-mounted multi-document viewer or create a fresh one.
      const groupViewerIframes = new Map();
      function viewerIframeKey(groupId, pluginId) {
        return `${groupId}:${pluginId}`;
      }
      const groupActiveFilePath = { 0: null, 1: null };
      let activeGroupId = 0;

      // The reverse of call()/saveFile()'s own request/reply plumbing (see plugin_assets.rs) — this
      // is the one place the HOST initiates a request a plugin must reply to, used by
      // moveFileToGroup() to pull a file's current (possibly unsaved) content out of its source
      // instance before mounting it in the other group. A plugin replies by posting
      // {type: "hostRequestReply", replyId, content} — matched in the message listener below.
      // A misbehaving (or just slow/stuck) plugin never replying would otherwise hang whatever
      // was awaiting it forever — moveFileToGroup's own move, or now the Outline panel's refresh.
      // Resolving null on timeout instead of leaving that stuck is the whole reason for it; both
      // callers already treat a null/falsy content result as "fall back to reading from disk."
      const REQUEST_CONTENT_TIMEOUT_MS = 2000;
      let nextHostRequestId = 1;
      const hostPendingRequests = new Map();
      function requestPluginContent(iframe, path) {
        return new Promise((resolve) => {
          const id = nextHostRequestId++;
          let settled = false;
          const finish = (value) => {
            if (settled) return;
            settled = true;
            hostPendingRequests.delete(id);
            resolve(value);
          };
          hostPendingRequests.set(id, finish);
          iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:getContent", payload: { path, replyId: id } }, "*");
          setTimeout(() => finish(null), REQUEST_CONTENT_TIMEOUT_MS);
        });
      }

      function groupEls(id) {
        return {
          tabBar: document.getElementById(`tab-bar-tabs-${id}`),
          viewport: document.getElementById(`center-viewport-${id}`),
          empty: document.getElementById(`center-viewport-empty-${id}`),
        };
      }

      // Tracks which group new files open into and which group's tab bar gets the "active" shade
      // (see .editor-group.is-active-group in the CSS above) — updated on any real interaction
      // with a group: clicking one of its tabs (via the per-group tab-change listener below),
      // clicking anywhere else in its chrome (this listener), or a viewer iframe inside it
      // receiving focus (see the iframe "focus" listener in openFile()).
      function setActiveGroup(id) {
        if (activeGroupId === id) return;
        activeGroupId = id;
        document.getElementById("editor-group-0").classList.toggle("is-active-group", id === 0);
        document.getElementById("editor-group-1").classList.toggle("is-active-group", id === 1);
        updateInspectorForActiveFile();
      }
      for (const id of [0, 1]) {
        document.getElementById(`editor-group-${id}`).addEventListener("mousedown", () => setActiveGroup(id));
      }

      // ---------- Inspector: active-file content broadcast ----------
      // Inspector is single-slot (renderSingleSlot) and mounted eagerly at startup, so "the
      // inspector's iframe" is just whichever contribution currently owns that slot, if any — no
      // installed inspector plugin at all is a legitimate, common state, not an error.
      function inspectorIframe() {
        const [contribution] = getSlot("inspector");
        if (!contribution) return null;
        const entry = pluginPanels.get(contribution.id);
        return entry ? entry.iframe : null;
      }

      // Tells whatever's in the Inspector slot (Outline, today) what the currently-focused file
      // actually is — null when there isn't one, or its viewer is a binary one (an image has
      // nothing for a symbols outline to extract). Live content, not a disk read: asks the owning
      // viewer instance directly (same requestPluginContent() moveFileToGroup uses), since an
      // outline that only ever reflected the last save would silently drift from what's actually
      // on screen the moment someone starts editing — falls back to a disk read only if that
      // times out or the viewer doesn't implement lowarc:getContent at all. Deliberately NOT wired
      // to every keystroke — only file focus changes and successful saves trigger this, matching
      // the scope this was actually built to.
      async function updateInspectorForActiveFile() {
        const iframe = inspectorIframe();
        if (!iframe) return;
        const path = groupActiveFilePath[activeGroupId];
        const file = path ? openFiles.get(path) : null;
        const viewer = path ? viewersByExtension.get(fileExtension(path)) : null;
        if (!file || !viewer || viewer.viewer.binary) {
          iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:activeFile", payload: null }, "*");
          return;
        }
        const live = file.iframe ? await requestPluginContent(file.iframe, path) : null;
        const contents = live ?? (await invoke("read_text_file", { path }).catch(() => null));
        iframe.contentWindow.postMessage({ type: "emit", event: "lowarc:activeFile", payload: contents == null ? null : { path, contents } }, "*");
      }

      // Pushed to every currently-mounted plugin iframe (sidebar/inspector panels *and* open-file
      // viewers, in either group) whenever anything about openFiles changes — the file explorer is
      // the reason this exists (so it can decorate its own tree rows with the same dirty/error
      // status the tab bar shows), but it's not addressed to any one plugin, since anything
      // sidebar-hosted might reasonably want it later. Sent as a full snapshot rather than a
      // delta: simpler, and cheap at the scale of "files a person has open in one project."
      function broadcastFileStatus() {
        const status = {};
        for (const [path, file] of openFiles) {
          status[path] = { dirty: file.dirty, missing: file.missing, hasErrors: file.hasErrors };
        }
        const payload = { type: "emit", event: "lowarc:fileStatus", payload: status };
        for (const entry of pluginPanels.values()) {
          if (entry.iframe) entry.iframe.contentWindow.postMessage(payload, "*");
        }
        // A Set, not a direct iteration over openFiles — several open files can now share one
        // iframe (see groupViewerIframes above), and that instance only needs this once, not once
        // per file it happens to have open.
        const notified = new Set();
        for (const file of openFiles.values()) {
          if (notified.has(file.iframe)) continue;
          notified.add(file.iframe);
          file.iframe.contentWindow.postMessage(payload, "*");
        }
      }

      function fileTitle(path) {
        return path.split(/[\\/]/).pop() || path;
      }

      function fileExtension(path) {
        const name = fileTitle(path);
        const dot = name.lastIndexOf(".");
        return dot === -1 ? "" : name.slice(dot).toLowerCase();
      }

      // #tab-bar-tabs-0/#tab-bar-tabs-1 are each their own "center-0"/"center-1" slot (see
      // contribute()/getSlot() in primitives.js) — a file's contribution is registered in
      // openFile() and removed in closeFile()/setSplitOpen(), both alongside (not instead of) the
      // matching openFiles.set()/delete(), since openFiles stays the authoritative store for the
      // MUTABLE per-file state (dirty/missing/hasErrors) a contribution deliberately doesn't carry
      // — decorate() below reads that live, straight from openFiles, on every render. groupId
      // selects which group's tab bar (and slot) to render; renderTabStrip is what actually builds
      // the tab elements, close buttons included (contribution.closeable:true is what triggers
      // those — see openFile()'s contribute() call).
      // Right-click on one open file's own tab — value handling shares closeGroupFiles/
      // closeSavedFiles with the tab-BAR's own context menu below (right-click on the empty strip
      // itself), since "close everything but this one"/"close everything already saved" mean the
      // same thing from either trigger.
      function showFileTabContextMenu(path, groupId, x, y) {
        openMenuOverlay(
          [
            { label: "Close", value: "close" },
            { label: "Close Others", value: "close-others" },
            { label: "Close Saved", value: "close-saved" },
            { label: "Close All", value: "close-all" },
            { divider: true },
            { label: "Copy Path", value: "copy-path" },
          ],
          { x, y }
        ).then((value) => {
          if (value === "close") closeFile(path);
          else if (value === "close-others") closeGroupFiles(groupId, path);
          else if (value === "close-saved") closeSavedFiles(groupId);
          else if (value === "close-all") closeGroupFiles(groupId);
          else if (value === "copy-path") {
            window.__TAURI__.clipboardManager.writeText(path).catch(() => showToast({ variant: "error", message: "Couldn't copy the path." }));
          }
        });
      }

      // Right-click on the tab bar's own empty space (not a specific tab) — no per-file actions,
      // just the group-wide ones, plus the same Split Editor toggle the View menu already has, for
      // discoverability right where a split would actually appear.
      function showTabBarContextMenu(groupId, x, y) {
        const hasFiles = Array.from(openFiles.values()).some((f) => f.groupId === groupId);
        openMenuOverlay(
          [
            { label: "Close All", value: "close-all", disabled: !hasFiles },
            { label: "Close Saved", value: "close-saved", disabled: !hasFiles },
            { divider: true },
            { label: "Split Editor", value: "split", checked: splitOpen },
          ],
          { x, y }
        ).then((value) => {
          if (value === "close-all") closeGroupFiles(groupId);
          else if (value === "close-saved") closeSavedFiles(groupId);
          else if (value === "split") toggleSplit();
        });
      }

      function renderTabBar(groupId) {
        const container = groupEls(groupId).tabBar;
        renderTabStrip(container, `center-${groupId}`, {
          itemClass: "file-tab",
          iconBased: false,
          emptyText: "No files open",
          decorate: (contribution, tab) => {
            const file = openFiles.get(contribution.id);
            if (!file) return;
            tab.title = contribution.id;
            tab.classList.toggle("is-active", contribution.id === groupActiveFilePath[groupId]);
            tab.classList.add(file.missing ? "status-missing" : file.dirty ? "status-dirty" : "status-clean");
            // Same per-language glyph the file explorer shows (window.lowarcIconClass, vendored
            // vendor/seti-icons/) — inserted first so it sits before the label, same reading order
            // as the explorer's own rows. Guarded the same way explorer.js guards it: if the icon
            // assets somehow aren't loaded, the tab just has no icon rather than an error.
            if (typeof window.lowarcIconClass === "function") {
              const icon = document.createElement("span");
              icon.className = "file-tab-icon file-icon " + window.lowarcIconClass(file.title);
              tab.insertBefore(icon, tab.firstChild);
            }
            // Stopped from bubbling to the tab bar's own contextmenu listener below — without
            // this, right-clicking a tab would show BOTH menus' worth of confusion (the container
            // listener firing right after this one resolves).
            tab.addEventListener("contextmenu", (e) => {
              e.preventDefault();
              e.stopPropagation();
              showFileTabContextMenu(contribution.id, groupId, e.clientX, e.clientY);
            });
          },
          onActivate: (contribution) => {
            groupActiveFilePath[groupId] = contribution.id;
            setActiveGroup(groupId);
            showActiveFile(groupId);
          },
          onClose: (contribution) => closeFile(contribution.id),
        });
      }

      for (const groupId of [0, 1]) {
        groupEls(groupId).tabBar.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          showTabBarContextMenu(groupId, e.clientX, e.clientY);
        });
      }

      // iframe -> Promise<void>, resolved once that iframe is actually ready to receive messages
      // (its own script has run far enough to register a lowarc:openFile listener). A second file
      // opened into an already-mounted-but-still-loading instance has to wait on this before
      // posting — without it, a message sent between iframe creation and the listener existing is
      // simply gone (postMessage doesn't queue for a future listener), the same failure shape the
      // very first ensurePluginMounted() bug this session turned out to be.
      const viewerIframeReady = new Map();

      // Gets-or-creates the one iframe for (groupId, viewer.pluginId), pushes this path's content
      // into it, and resolves once it's genuinely ready — either immediately (an already-mounted
      // instance already has a load-complete script running) or after a freshly-created iframe's
      // own load event fires. Doesn't touch openFiles/contribute/groupActiveFilePath/rendering —
      // callers (openFile, moveFileToGroup) own that, since what happens around a mount differs
      // between "brand new file" and "moved from the other group."
      function mountFileInGroup(path, contents, viewer, groupId) {
        const key = viewerIframeKey(groupId, viewer.pluginId);
        const existingIframe = groupViewerIframes.get(key);

        if (existingIframe) {
          return viewerIframeReady.get(existingIframe).then(() => {
            windowToFilePaths.get(existingIframe.contentWindow).add(path);
