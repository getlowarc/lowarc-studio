<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="theme.js"></script>
    <title>LowArc Studio</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="primitives.css" />
    <style>
      body {
        display: flex;
      }

      .actions {
        width: 220px;
        flex: none;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        gap: 4px;
      }

      .actions .brand {
        font-size: 15px;
        font-weight: 600;
        padding: 4px 8px 16px;
      }

      .actions .btn {
        width: 100%;
        justify-content: flex-start;
      }

      .actions .primary-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }

      .actions .spacer {
        flex: 1;
      }

      .actions .nav-actions {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      main {
        position: relative;
        flex: 1;
        overflow: auto;
        padding: 24px 32px;
      }

      /* Watermark: the bolt silhouette recolored via a CSS mask, always a flat neutral gray. A
         fixed black overlay rather than a foreground token on purpose — semi-transparent black
         always reads as a shade darker than whatever's under it, in either theme, without needing
         separate light/dark logic (a token like --fg-dim is deliberately lighter than the dark
         page so text stays readable, which is exactly backwards for a shadow-style watermark).
         Centered in main's own box, not bled past the edge, so it can't trigger main's own
         overflow:auto scrollbar. */
      main::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 320px;
        height: 420px;
        background-color: #000;
        opacity: 0.16;
        -webkit-mask-image: url("la-logo-mono.svg");
        mask-image: url("la-logo-mono.svg");
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        pointer-events: none;
        z-index: 0;
      }

      main h1,
      main .recent-list {
        position: relative;
        z-index: 1;
      }

      main h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 16px;
        color: var(--fg-dim);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .recent-list {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .recent-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 10px 12px;
        border-radius: 4px;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .recent-item:hover {
        background: var(--bg-hover);
        border-color: var(--border);
      }

      .recent-item .name {
        font-size: 14px;
      }

      .recent-item .path {
        font-size: 12px;
        color: var(--fg-dim);
      }

      .recent-item.missing {
        cursor: default;
        opacity: 0.6;
      }

      .recent-item.missing:hover {
        background: none;
        border-color: transparent;
      }

      .recent-item.missing .path::after {
        content: " — not found";
        color: var(--danger);
      }

      .empty-state {
        color: var(--fg-dim);
      }
    </style>
  </head>
  <body>
    <nav class="actions">
      <div class="brand">LowArc Studio</div>

      <div class="primary-actions">
        <button type="button" class="btn btn-md btn-main" id="new-project">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
          New Project
        </button>
        <button type="button" class="btn btn-md btn-outline" id="open-project">
          <svg viewBox="0 0 16 16" fill="none"><path d="M2 5a1 1 0 011-1h3l1.5 1.5H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1V5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /></svg>
          Open Project
        </button>
      </div>

      <div class="spacer"></div>

      <div class="nav-actions">
        <button type="button" class="btn btn-md btn-ghost" id="open-modules">
          <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" /><rect x="9" y="2" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" /><rect x="2" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" /><rect x="9" y="9" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3" /></svg>
          Modules
        </button>
        <button type="button" class="btn btn-md btn-ghost" id="open-plugins">
          <svg viewBox="0 0 16 16" fill="none"><path d="M6 2v3M10 2v3M4.5 5h7v3a3.5 3.5 0 01-7 0V5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" /><path d="M8 11.5v2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" /></svg>
          Plugins
        </button>
        <button type="button" class="btn btn-md btn-ghost" id="open-settings">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h10M3 12h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" /><circle cx="6" cy="4" r="1.6" fill="currentColor" /><circle cx="11" cy="8" r="1.6" fill="currentColor" /><circle cx="7" cy="12" r="1.6" fill="currentColor" /></svg>
          Settings
        </button>
        <button type="button" class="btn btn-md btn-ghost" id="open-website">
          <svg viewBox="0 0 16 16" fill="none"><path d="M6 10l5-5M8 5h3v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
          lowarc.com
        </button>
      </div>
    </nav>
    <main>
      <h1>Recent Projects</h1>
      <div id="recent-list" class="recent-list"></div>
    </main>

    <div class="popup-backdrop" data-popup id="new-project-popup">
      <div class="popup" style="width: 360px">
        <div class="popup-header">
          <h2>New project name</h2>
          <button type="button" class="popup-close" data-popup-close aria-label="Close"><svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg></button>
        </div>
        <div class="popup-body">
          <div class="field">
            <input id="new-project-name" class="input" type="text" placeholder="my-game" autocomplete="off" />
          </div>
          <div id="new-project-error" class="field-hint" style="color: var(--danger); min-height: 16px; margin-top: 6px"></div>
        </div>
        <div class="popup-actions">
          <button type="button" class="btn btn-md btn-ghost" data-popup-close>Cancel</button>
          <button type="button" class="btn btn-md btn-confirm" id="new-project-create">Create</button>
        </div>
      </div>
    </div>

    <script src="primitives.js"></script>
    <script src="startup.js"></script>
  </body>
</html>
